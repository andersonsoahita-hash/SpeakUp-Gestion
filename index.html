ct and the object are the same person, we use -self / -selves. 'By myself' means alone, without help.","fr":"Quand sujet et objet sont la même personne : -self / -selves. 'By myself' = tout seul.","mg":"Raha mitovy ny mpanao sy ny iharana: -self. 'By myself' = irery.","blocks":[{"t":"v","v":[{"en":"I did it myself.","ph":"maï-sèlf","fr":"Je l'ai fait moi-même.","mg":"Nataoko samirery."},{"en":"Help yourself!","ph":"yor-sèlf","fr":"Sers-toi !","mg":"Manasà!"},{"en":"She taught herself English.","ph":"her-sèlf","fr":"Elle a appris l'anglais seule.","mg":"Nianatra irery izy."},{"en":"We enjoyed ourselves.","ph":"aour-sèlvz","fr":"On s'est bien amusés.","mg":"Nifaly izahay."},{"en":"They blamed themselves.","ph":"them-sèlvz","fr":"Ils se sont culpabilisés.","mg":"Nanome tsiny ny tenany izy ireo."}]}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Complete.","items":["This is not your bag, it's ______ (moi).","Their car is new but ______ (le nôtre) is faster.","I saw ______ (elle) at the market yesterday.","He built the house by ______ .","Rewrite with a possessive pronoun: 'This is my phone.' → ______"]}},{"seance":11,"chapitre":17,"title":"Present Simple","sub":"Le présent simple • Ny 'present simple'","intro":["If you only master one tense in this book, master this one. It carries daily life: what you do, what you like, what you believe, what is true."],"sections":[{"title":"FORM AND USE","expl":"Structure: S + V (+ s/es for he/she/it) + C. We use the present simple for what is ALWAYS true (The sun rises in the east) and for HABITS (I check my phone every morning). Negative and question forms need the auxiliary DO / DOES.","fr":"S + V (+s à la 3e personne). Vérités générales et habitudes. Négation/question avec DO/DOES.","mg":"S + V (+s amin'ny he/she/it). Fahamarinana sy fahazarana. DO/DOES amin'ny fanontaniana sy fandavana.","blocks":[{"t":"tb","rows":[["Affirmative","Negative","Interrogative"],["I / you / we / they work","don't work","Do you work?"],["he / she / it works","doesn't work","Does he work?"],["Spelling: go → goes","finish → finishes","cry → cries (cons.+y)"],["but: play → plays","(vowel + y)","watch → watches"]]}]},{"title":"ADVERBS OF FREQUENCY","expl":"They go BEFORE the main verb but AFTER the verb 'to be': 'I often post pictures' / 'He is always late.'","fr":"Avant le verbe principal, mais après 'be'.","mg":"Alohan'ny matoanteny fototra, fa aorian'ny 'be'.","blocks":[{"t":"v","v":[{"en":"always / never","ph":"ol-weïz / nè-ver","fr":"toujours / jamais","mg":"foana / tsy mihitsy"},{"en":"usually / often","ph":"iou-jou-eli / o-fen","fr":"habituellement / souvent","mg":"matetika"},{"en":"sometimes / rarely","ph":"sam-taïmz / rèr-li","fr":"parfois / rarement","mg":"indraindray / mahalana"},{"en":"every day / once a week","ph":"wanss e wik","fr":"chaque jour / une fois par semaine","mg":"isan'andro / indray mandeha"},{"en":"twice a month","ph":"twaïss","fr":"deux fois par mois","mg":"indroa isam-bolana"}]},{"t":"c","title":"The classic mistake","text":"The -s of the third person disappears in questions and negatives, because DOES already carries it. 'Does he works?' is wrong. 'Does he work?' is right."}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Put the verb in the correct form.","items":["She ______ (work) eight hours a day.","He ______ (not know) my brother.","What ______ Tom usually ______ (have) for breakfast?","The train ______ (leave) at 17:25 from platform 3.","Word order: (never / I / post / on Sundays) → ______"]}},{"seance":12,"chapitre":18,"title":"Present Continuous","sub":"Le présent progressif • Ny 'present continuous'","intro":[],"sections":[{"title":"FORM AND USE","expl":"Structure: S + BE + V-ing. It describes what is happening NOW ('I'm studying at the moment') or a temporary situation ('He's living in Paris this year'). It also expresses a FIXED future arrangement: 'We're having dinner at eight.'","fr":"S + BE + V-ing : maintenant, situation temporaire, ou arrangement futur déjà fixé.","mg":"S + BE + V-ing: ankehitriny, mandalo, na fandaharana efa voafaritra.","blocks":[{"t":"tb","rows":[["Affirmative","Negative","Interrogative"],["I am eating","I'm not eating","Am I eating?"],["You are eating","You aren't eating","Are you eating?"],["He is eating","He isn't eating","Is he eating?"],["Adverbs","now, right now, at the moment","currently, these days"]]}]},{"title":"SIMPLE OR CONTINUOUS?","expl":"Compare: 'I work in a bank' (my job, permanent) and 'I'm working on a project' (right now, temporary). Some verbs of state — know, want, believe, love, need — are almost never used in -ing.","fr":"Verbes d'état (know, want, love, need…) ne se mettent presque jamais en -ing.","mg":"Ny matoanteny toe-javatra (know, want, love…) dia tsy atao -ing.","blocks":[{"t":"v","v":[{"en":"I work here. (always)","ph":"aï werk hir","fr":"Je travaille ici.","mg":"Miasa eto aho."},{"en":"I'm working now.","ph":"aïm wer-king","fr":"Je travaille en ce moment.","mg":"Miasa aho izao."},{"en":"He plays football.","ph":"hi pleïz","fr":"Il joue au foot (habitude).","mg":"Milalao baolina izy."},{"en":"He is playing now.","ph":"hi iz pleï-ing","fr":"Il joue en ce moment.","mg":"Milalao izy izao."},{"en":"I know the answer. (NOT knowing)","ph":"aï no","fr":"Je connais la réponse.","mg":"Fantatro ny valiny."}]},{"t":"c","title":"Watch out","text":"Verbs of state — know, want, believe, love, hate, need, understand — are almost never used in -ing. 'I am knowing' does not exist."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Present simple or present continuous?","items":["Look! It ______ (rain).","She ______ (speak) three languages.","I ______ (not understand) this word. (state verb)","What ______ you ______ (do) at this moment?","We ______ (have) dinner at eight tonight. (arrangement)"]}},{"seance":13,"chapitre":19,"title":"Linking Words","sub":"Les mots de liaison • Ny teny mampifandray","intro":["Two speakers can know exactly the same words. The one who sounds intelligent is the one who knows how to connect them. That is what this chapter is about."],"sections":[{"title":"BUILDING A SPEECH","expl":"Linking words are the skeleton of any speech or essay. Learn them by function: opening, adding, opposing, explaining, concluding. Used well, they instantly make you sound fluent.","fr":"Classe-les par fonction : ouvrir, ajouter, opposer, expliquer, conclure.","mg":"Zarao araka ny asany: manomboka, manampy, manohitra, manazava, mamarana.","blocks":[{"t":"p","text":"■  Open      First of all, To begin with      →  D'abord, pour commencer"},{"t":"p","text":"■  Add      Moreover, Besides, In addition      →  De plus, en outre"},{"t":"p","text":"■  Also      Not only… but also      →  Non seulement… mais aussi"},{"t":"p","text":"■  Oppose      However, Although, On the other hand      →  Cependant, bien que, d'autre part"},{"t":"p","text":"■  Despite      In spite of + noun, Even though + clause      →  Malgré, même si"},{"t":"p","text":"■  Cause      Because of + noun, Since, As      →  À cause de, puisque"},{"t":"p","text":"■  Result      That's why, Therefore, As a result      →  C'est pourquoi, donc"},{"t":"p","text":"■  Purpose      In order to, So as to      →  Afin de"},{"t":"p","text":"■  Condition      Provided that, As long as, Unless      →  À condition que, tant que, sauf si"},{"t":"p","text":"■  Conclude      To sum up, All in all, Finally      →  En résumé, en somme, enfin"}]},{"title":"COMMON TRAPS","expl":"'Because' is followed by a subject + verb; 'because of' by a noun. 'Although' is followed by a clause; 'despite / in spite of' by a noun or V-ing.","fr":"because + sujet+verbe ; because of + nom. although + proposition ; despite + nom/V-ing.","mg":"because + fehezanteny; because of + anarana.","blocks":[{"t":"v","v":[{"en":"because it was late","ph":"bi-koz","fr":"parce qu'il était tard","mg":"satria efa tara"},{"en":"because of the rain","ph":"bi-koz ov","fr":"à cause de la pluie","mg":"noho ny orana"},{"en":"although he was tired","ph":"ol-tho","fr":"bien qu'il fût fatigué","mg":"na dia reraka aza izy"},{"en":"despite the rain","ph":"dis-paït","fr":"malgré la pluie","mg":"na dia teo aza ny orana"},{"en":"in order to succeed","ph":"in or-der tou","fr":"afin de réussir","mg":"mba hahomby"},{"en":"unless you hurry","ph":"an-less","fr":"à moins que tu te dépêches","mg":"raha tsy maika ianao"}]},{"t":"c","title":"Watch out","text":"BECAUSE is followed by a subject and a verb; BECAUSE OF by a noun. Because it rained / because of the rain."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Complete with a linking word.","items":["______ the price, I bought it. (malgré)","He failed ______ he didn't revise. (parce que)","______ she is young, she runs a business. (bien que)","I work hard ______ support my family. (afin de)","Write a 6-sentence paragraph using: first of all, moreover, however, because, that's why, to sum up."]}},{"seance":14,"chapitre":25,"title":"Simple Past & Irregular Verbs","sub":"Le passé simple et les verbes irréguliers • Ny lasa tsotra","intro":[],"sections":[{"title":"FORM AND USE","expl":"Structure: S + past form + C. It describes a finished action in a finished period: 'I watched a film last night.' Regular verbs take -ed; irregular verbs must be memorised. In negatives and questions we use DID + base verb: 'I didn't watch', 'Did you watch?'","fr":"Action terminée dans un temps terminé. DID + base verbale à la négation et à la question.","mg":"Zava-nitranga efa vita. DID + matoanteny fototra amin'ny fandavana.","blocks":[{"t":"tb","rows":[["Affirmative","Negative","Interrogative"],["I spoke with him","I didn't speak with him","Did I speak with him?"],["She watched TV","She didn't watch TV","Did she watch TV?"],["Adverbs","yesterday, last week, two days ago","in 2019, this morning"]]}]},{"title":"THE MOST USEFUL IRREGULAR VERBS","expl":"Learn them in threes: infinitive – past – past participle. These twenty carry most everyday conversation.","fr":"Apprends-les par trois : infinitif – prétérit – participe passé.","mg":"Ianaro telo telo: infinitive – past – past participle.","blocks":[{"t":"tb","rows":[["Infinitive","Past","Past participle"],["be","was / were","been"],["go","went","gone"],["do","did","done"],["have","had","had"],["say / tell","said / told","said / told"],["make","made","made"],["take","took","taken"],["come","came","come"],["see","saw","seen"],["give","gave","given"],["know","knew","known"],["get","got","got / gotten"],["think","thought","thought"],["buy","bought","bought"],["write","wrote","written"],["speak","spoke","spoken"],["read","read","read"],["find","found","found"],["leave","left","left"],["begin","began","begun"]]},{"t":"c","title":"Study method","text":"Learn irregular verbs in threes and out loud: go–went–gone, see–saw–seen. Ten a day, revised the next morning, and the list is finished in three weeks."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Put into the simple past.","items":["I ______ (see) a movie yesterday.","Last year, she ______ (travel) to Japan.","They ______ (not come) to the party.","______ you ______ (buy) the tickets?","Tell in five sentences what you did last weekend."]}},{"seance":15,"chapitre":20,"title":"Prepositions & Punctuation","sub":"Les prépositions et la ponctuation • Ny mpampiankina sy ny mari-piatoana","intro":[],"sections":[{"title":"PREPOSITIONS OF TIME AND PLACE","expl":"Three key rules: AT for a precise point (at 6 p.m., at the corner), ON for a surface or a day (on the table, on Monday), IN for an enclosed space or a long period (in the room, in June, in 2026).","fr":"AT point précis, ON surface ou jour, IN espace fermé ou longue période.","mg":"AT toerana marina, ON velaran-javatra na andro, IN toerana mihidy na fotoana lava.","blocks":[{"t":"tb","rows":[["AT","ON","IN"],["at 8 o'clock","on Monday","in May / in 2026"],["at night","on my birthday","in the morning"],["at the bus stop","on the wall","in the kitchen"],["at school / at work","on the second floor","in Madagascar"]]}]},{"title":"OTHER USEFUL PREPOSITIONS","expl":"Some prepositions of movement and relation cannot be guessed from French. Note especially 'by + V-ing' which means 'en faisant'.","fr":"'by + V-ing' = en faisant quelque chose.","mg":"'by + V-ing' = amin'ny alalan'ny.","blocks":[{"t":"v","v":[{"en":"through the tunnel","ph":"throu","fr":"","mg":""},{"en":"FR  à travers le tunnel","ph":"","fr":"MG  namakivaky ny tonelina","mg":""},{"en":"across the street","ph":"e-kross","fr":"","mg":""},{"en":"FR  de l'autre côté de la rue","ph":"","fr":"MG  mita ny arabe","mg":""},{"en":"along the river","ph":"e-long","fr":"","mg":""},{"en":"FR  le long de la rivière","ph":"","fr":"MG  manaraka ny renirano","mg":""},{"en":"towards the exit","ph":"tou-wordz","fr":"","mg":""},{"en":"FR  vers la sortie","ph":"","fr":"MG  mankany amin'ny fivoahana","mg":""},{"en":"by working hard","ph":"baï wer-king","fr":"","mg":""},{"en":"FR  en travaillant dur","ph":"","fr":"MG  amin'ny fiasana mafy","mg":""},{"en":"instead of complaining","ph":"in-stèd ov","fr":"","mg":""},{"en":"FR  au lieu de se plaindre","ph":"","fr":"MG  fa tsy mitaraina","mg":""},{"en":"according to him","ph":"e-kor-ding tou","fr":"","mg":""},{"en":"FR  selon lui","ph":"","fr":"MG  araka ny filazany","mg":""}]}]},{"title":"PUNCTUATION MARKS","expl":"Knowing the names of these signs is essential to dictate an email address or a phone message in English.","fr":"Indispensable pour dicter une adresse e-mail en anglais.","mg":"Ilaina rehefa manonona adiresy mailaka.","blocks":[{"t":"tb","rows":[["Sign","English","Français"],[", .","comma / full stop (period)","virgule / point"],["; :","semicolon / colon","point-virgule / deux-points"],["? !","question mark / exclamation mark","point d'interrogation / d'exclamation"],["( ) \" \"","brackets / quotation marks","parenthèses / guillemets"],["- – /","hyphen / dash / slash","trait d'union / tiret / barre oblique"],["@ _","at sign / underscore","arobase / tiret bas"]]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"AT, ON or IN?","items":["The meeting is ______ Monday ______ 9 a.m.","She was born ______ 2003 ______ Antananarivo.","My office is ______ the third floor.","He succeeded ______ working every night. (en travaillant)","Dictate your email address in English, naming every sign."]}},{"seance":16,"chapitre":21,"title":"Quantifiers","sub":"Les quantifieurs • Ny mpamaritra habetsahana","intro":[],"sections":[{"title":"SOME / ANY / NO","expl":"SOME is used in affirmative sentences and in polite offers ('Would you like some tea?'). ANY is used in negatives and questions. NO makes a negative meaning with an affirmative structure: 'I have no money' = 'I don't have any money.'","fr":"SOME affirmatif et offres ; ANY négatif et questions ; NO = négation avec forme affirmative.","mg":"SOME amin'ny filaza tsotra; ANY amin'ny fandavana sy fanontaniana.","blocks":[{"t":"p","text":"■  I need some water.      I don't need any water.      →  I need no help."},{"t":"p","text":"■  Would you like some tea?      Do you have any questions?      →  There is no problem."},{"t":"p","text":"■  someone / something      anyone / anything      →  no one / nothing"},{"t":"p","text":"■  somewhere      anywhere      →  nowhere"}]},{"title":"MUCH / MANY / A LOT OF","expl":"MUCH goes with uncountable nouns (much money, much time), MANY with countable plurals (many friends). A LOT OF works with both and is preferred in affirmative sentences.","fr":"MUCH + indénombrable, MANY + dénombrable pluriel, A LOT OF les deux.","mg":"MUCH + tsy azo isaina; MANY + azo isaina; A LOT OF ny roa.","blocks":[{"t":"p","text":"■  much money / time      many books / people      →  a lot of / lots of / plenty of"},{"t":"p","text":"■  a little water      a few friends      →  enough / no"},{"t":"p","text":"■  How much is it?      How many are there?      →  all of / both of"},{"t":"p","text":"■  too much noise      too many cars      →  half of / one of / each of"},{"t":"c","title":"Memory trick","text":"MUCH goes with what you cannot count (money, time, water). MANY goes with what you can count (friends, books, cars). When in doubt, A LOT OF works with both."}]},{"title":"A LITTLE / A FEW AND FRIENDS","expl":"'A few' = some, enough (positive); 'few' = almost none (negative). Same for 'a little' and 'little'.","fr":"'a few' = quelques (positif) ; 'few' = peu, presque aucun (négatif).","mg":"'a few' = vitsivitsy (tsara); 'few' = kely dia kely (ratsy).","blocks":[{"t":"v","v":[{"en":"a few friends","ph":"e fiou","fr":"quelques amis","mg":"namana vitsivitsy"},{"en":"a little time","ph":"e li-tel","fr":"un peu de temps","mg":"fotoana kely"},{"en":"enough money","ph":"i-naf","fr":"assez d'argent","mg":"vola ampy"},{"en":"too much sugar","ph":"tou match","fr":"trop de sucre","mg":"siramamy be loatra"},{"en":"both of them","ph":"both","fr":"tous les deux","mg":"izy roa"},{"en":"each of us","ph":"itch ov ass","fr":"chacun de nous","mg":"ny tsirairay aminay"},{"en":"the whole week","ph":"the hol wik","fr":"toute la semaine","mg":"ny herinandro manontolo"}]}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Complete.","items":["There isn't ______ milk left.","How ______ students are there in your class?","I have ______ friends here, so I'm never alone. (quelques)","He drank too ______ coffee last night.","Translate: « Il n'y a personne dans la salle. »"]}},{"seance":17,"chapitre":26,"title":"Past Continuous","sub":"Le passé progressif • Ny lasa mitohy","intro":[],"sections":[{"title":"FORM AND USE","expl":"Structure: S + was/were + V-ing. It describes an action IN PROGRESS in the past, often interrupted by a shorter action in the simple past. WHEN introduces the short action, WHILE the long one: 'I was cooking WHEN he called.' / 'WHILE I was cooking, he called.'","fr":"Action en cours dans le passé. WHEN + action courte, WHILE + action longue.","mg":"Zava-natao teo am-panaovana. WHEN + fohy, WHILE + lava.","blocks":[{"t":"tb","rows":[["Affirmative","Negative","Interrogative"],["I was working","I wasn't working","Was I working?"],["You were working","You weren't working","Were you working?"],["Rule","Long action → past continuous","Short action → simple past"]]}]},{"title":"COMBINING THE TWO TENSES","expl":"The two tenses almost always travel together in a story. This is the basic engine of storytelling in English.","fr":"Les deux temps voyagent ensemble : c'est le moteur du récit.","mg":"Miaraka foana izy roa amin'ny tantara.","blocks":[{"t":"v","v":[{"en":"While I was sleeping, someone knocked.","ph":"waïl","fr":"","mg":""},{"en":"FR  Pendant que je dormais, on a frappé.","ph":"","fr":"MG  Raha natory aho dia nisy nandondona.","mg":""},{"en":"I was studying when the lights went out.","ph":"wèn","fr":"","mg":""},{"en":"FR  J'étudiais quand la lumière s'est éteinte.","ph":"","fr":"MG  Nianatra aho no maty ny jiro.","mg":""},{"en":"What were you doing at 8?","ph":"wèr you dou-ing","fr":"","mg":""},{"en":"FR  Que faisais-tu à 8h ?","ph":"","fr":"MG  Inona no nataonao tamin'ny 8?","mg":""},{"en":"They were arguing all evening.","ph":"ar-guiou-ing","fr":"","mg":""},{"en":"FR  Ils se disputaient toute la soirée.","ph":"","fr":"MG  Nifamaly nandritra ny hariva izy ireo.","mg":""},{"en":"It was raining when we arrived.","ph":"reï-ning","fr":"","mg":""},{"en":"FR  Il pleuvait quand nous sommes arrivés.","ph":"","fr":"MG  Nanorana raha tonga izahay.","mg":""}]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Simple past or past continuous?","items":["I ______ (watch) a film when the electricity ______ (go) out.","While she ______ (cook), the phone ______ (ring).","What ______ you ______ (do) when the accident occurred?","Last year I ______ (live) in the dorm.","Write a short story (5 lines) using WHEN and WHILE."]}},{"seance":18,"chapitre":22,"title":"WH-Questions & Relative Pronouns","sub":"Les questions et les pronoms relatifs • Fanontaniana sy solo-anarana mampifandray","intro":[],"sections":[{"title":"ASKING WITH WH-","expl":"Order: WH- word + auxiliary + subject + verb. 'What do you do?' — never 'What you do?'. The auxiliary changes with the tense: do/does, did, are, have, will.","fr":"Ordre : mot en WH- + auxiliaire + sujet + verbe.","mg":"Filaharana: WH- + mpanampy + lohateny + matoanteny.","blocks":[{"t":"v","v":[{"en":"What are you doing?","ph":"wat ar you dou-ing","fr":"","mg":""},{"en":"FR  Que fais-tu ?","ph":"","fr":"MG  Inona no ataonao?","mg":""},{"en":"Where did you go?","ph":"wèr did you go","fr":"","mg":""},{"en":"FR  Où es-tu allé ?","ph":"","fr":"MG  Taiza ianao?","mg":""},{"en":"When will you come?","ph":"wèn wil you kam","fr":"","mg":""},{"en":"FR  Quand viendras-tu ?","ph":"","fr":"MG  Rahoviana ianao no ho avy?","mg":""},{"en":"Why are you late?","ph":"waï ar you leït","fr":"","mg":""},{"en":"FR  Pourquoi es-tu en retard ?","ph":"","fr":"MG  Nahoana ianao no tara?","mg":""},{"en":"Who are you waiting for?","ph":"hou ar you weï-ting","fr":"","mg":""},{"en":"FR  Qui attends-tu ?","ph":"","fr":"MG  Iza no andrasanao?","mg":""},{"en":"Which one do you prefer?","ph":"witch wan","fr":"","mg":""},{"en":"FR  Lequel préfères-tu ?","ph":"","fr":"MG  Iza amin'ireo no tianao?","mg":""},{"en":"Whose bag is this?","ph":"houz bag","fr":"","mg":""},{"en":"FR  À qui est ce sac ?","ph":"","fr":"MG  An'iza ity kitapo ity?","mg":""},{"en":"How much / How many?","ph":"haou match","fr":"","mg":""},{"en":"FR  Combien ?","ph":"","fr":"MG  Ohatrinona / firy?","mg":""},{"en":"How long have you been here?","ph":"haou long","fr":"","mg":""},{"en":"FR  Depuis quand es-tu là ?","ph":"","fr":"MG  Efa hafiriana ianao no eto?","mg":""}]}]},{"title":"RELATIVE PRONOUNS","expl":"They join two sentences. WHO for people, WHICH for things, THAT for both, WHOSE for possession, WHERE for places, WHEN for time.","fr":"WHO personnes, WHICH choses, THAT les deux, WHOSE possession, WHERE lieu, WHEN temps.","mg":"WHO olona, WHICH zavatra, WHOSE fananana, WHERE toerana, WHEN fotoana.","blocks":[{"t":"v","v":[{"en":"the man who called me","ph":"hou","fr":"l'homme qui m'a appelé","mg":"ilay lehilahy niantso ahy"},{"en":"the book which I read","ph":"witch","fr":"le livre que j'ai lu","mg":"ilay boky novakiako"},{"en":"the girl whose father is a doctor","ph":"houz","fr":"la fille dont le père est médecin","mg":"ilay tovovavy izay dokotera ny rainy"},{"en":"the town where I grew up","ph":"wèr","fr":"la ville où j'ai grandi","mg":"ilay tanàna nahalehibe ahy"},{"en":"the day when we met","ph":"wèn","fr":"le jour où nous nous sommes rencontrés","mg":"ilay andro nihaonanay"},{"en":"That's what I mean.","ph":"wat","fr":"C'est ce que je veux dire.","mg":"Izay no tiako holazaina."}]},{"t":"c","title":"The classic mistake","text":"In a reported or indirect question there is no auxiliary and no inversion. Not 'I don't know where is he', but 'I don't know where he is'."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Complete with who, which, whose, where or when.","items":["This is the app ______ changed my life.","She's the girl ______ won the contest.","That's the café ______ we first met.","I know a boy ______ mother is a pilot.","Write five WH-questions to interview a young entrepreneur."]}},{"seance":19,"chapitre":27,"title":"Present Perfect & Present Perfect Continuous","sub":"Le present perfect • Ny 'present perfect'","intro":["This is the tense French speakers get wrong most often, because it does not exist the same way in French. Take your time here — a slow hour now saves you a hundred mistakes later."],"sections":[{"title":"PRESENT PERFECT: S + HAVE/HAS + PAST PARTICIPLE","expl":"It links the past to the present. Use it for an experience without a date ('I have visited Paris'), a recent action ('She has just left'), or a result we can see now ('I have lost my keys'). NEVER use it with a finished time expression: not 'I have seen him yesterday' but 'I saw him yesterday.'","fr":"Lie le passé au présent. Jamais avec une date terminée (yesterday, last week).","mg":"Mampifandray ny lasa sy ny ankehitriny. Tsy miaraka amin'ny daty efa vita.","blocks":[{"t":"v","v":[{"en":"I have already seen this film.","ph":"ol-rè-di","fr":"J'ai déjà vu ce film.","mg":"Efa hitako io sarimihetsika io."},{"en":"She has just left.","ph":"djast","fr":"Elle vient de partir.","mg":"Vao lasa izy."},{"en":"Have you ever been abroad?","ph":"è-ver","fr":"As-tu déjà été à l'étranger ?","mg":"Efa tany ivelany ve ianao?"},{"en":"I haven't finished yet.","ph":"yèt","fr":"Je n'ai pas encore fini.","mg":"Mbola tsy vitako."},{"en":"He has never called me.","ph":"nè-ver","fr":"Il ne m'a jamais appelé.","mg":"Tsy mbola niantso ahy izy."},{"en":"So far, so good.","ph":"so far","fr":"Jusqu'ici tout va bien.","mg":"Mandeha tsara hatreto."}]}]},{"title":"PRESENT PERFECT CONTINUOUS: HAVE BEEN + V-ING","expl":"It insists on the DURATION of an action that started in the past and still continues. Use FOR + a length of time (for three years) and SINCE + a starting point (since 2020).","fr":"Insiste sur la durée. FOR + durée, SINCE + point de départ.","mg":"Manasongadina ny faharetana. FOR + faharetana, SINCE + fiandohana.","blocks":[{"t":"v","v":[{"en":"I've been learning English for two years.","ph":"for","fr":"J'apprends l'anglais depuis deux ans.","mg":"Roa taona izay no ianarako anglisy."},{"en":"She's been waiting since 8 a.m.","ph":"sinss","fr":"Elle attend depuis 8h.","mg":"Miandry hatramin'ny 8 izy."},{"en":"How long have you been working here?","ph":"haou long","fr":"Depuis combien de temps travailles-tu ici ?","mg":"Hafiriana ianao no miasa eto?"},{"en":"They've been arguing all day.","ph":"ol deï","fr":"Ils se disputent toute la journée.","mg":"Nifamaly nandritra ny andro izy ireo."},{"en":"I've been trying to reach you.","ph":"traï-ing","fr":"J'essaie de te joindre.","mg":"Miezaka mifandray aminao aho."}]},{"t":"c","title":"The classic mistake","text":"Never put a finished date after the present perfect. Not 'I have seen him yesterday' but 'I saw him yesterday'. If the time is over, use the simple past."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Complete with the present perfect (simple or continuous), FOR or SINCE.","items":["I ______ (know) her ______ 2019.","She ______ (not finish) her project ______ .  (yet)","We ______ (wait) ______ two hours!","______ you ever ______ (eat) sushi?","Correct: 'I have called him yesterday.' → ______"]}},{"seance":20,"chapitre":28,"title":"Past Perfect (Continuous)","sub":"Le plus-que-parfait • Ny lasa talohan'ny lasa","intro":[],"sections":[{"title":"FORM AND USE","expl":"Structure: S + HAD + past participle. When two actions happened in the past, the past perfect marks the FIRST one. 'When I arrived, he had already left' — he left first, I arrived second. The continuous form (had been + V-ing) insists on the duration before that moment.","fr":"Marque l'action antérieure à une autre action passée.","mg":"Manondro ny zava-nitranga voalohany amin'ny roa lasa.","blocks":[{"t":"v","v":[{"en":"He had gone out when I arrived.","ph":"had gan","fr":"","mg":""},{"en":"FR  Il était sorti quand je suis arrivé.","ph":"","fr":"MG  Efa nivoaka izy raha tonga aho.","mg":""},{"en":"After we had eaten, we left.","ph":"af-ter","fr":"","mg":""},{"en":"FR  Après avoir mangé, nous sommes partis.","ph":"","fr":"MG  Rehefa avy nisakafo izahay dia lasa.","mg":""},{"en":"I had never seen such a thing.","ph":"nè-ver sin","fr":"","mg":""},{"en":"FR  Je n'avais jamais vu une telle chose.","ph":"","fr":"MG  Tsy mbola nahita zavatra toy izany aho.","mg":""},{"en":"She had been waiting for an hour.","ph":"had bin weï-ting","fr":"","mg":""},{"en":"FR  Elle attendait depuis une heure.","ph":"","fr":"MG  Efa adiny iray izy no niandry.","mg":""},{"en":"Once upon a time…","ph":"wanss e-pon e taïm","fr":"","mg":""},{"en":"FR  Il était une fois…","ph":"","fr":"MG  Indray andro hono…","mg":""},{"en":"a long time ago","ph":"e long taïm e-go","fr":"","mg":""},{"en":"FR  il y a longtemps","ph":"","fr":"MG  efa ela be izay","mg":""}]}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Put the verbs in the simple past or past perfect.","items":["When I ______ (get) to the station, the train ______ (already leave).","She ______ (be) tired because she ______ (work) all night.","After they ______ (finish) lunch, they ______ (go) to the cinema.","Translate: « Je n'avais jamais parlé anglais avant ce jour-là. »","Write three sentences about something you had never done before 2024."]}},{"seance":21,"chapitre":23,"title":"Adjectives, Adverbs, Comparatives & Superlatives","sub":"Adjectifs, adverbes et comparaisons • Mpamaritra sy fampitahana","intro":["Comparing is one of the most frequent things we do when we speak: cheaper, faster, better, the worst. Get the two patterns right and a whole family of sentences opens up."],"sections":[{"title":"FROM ADJECTIVE TO ADVERB","expl":"Add -ly to the adjective: quick → quickly. Adjectives in -ic take -ally: automatic → automatically. Careful: 'good' becomes 'well', and 'fast', 'hard', 'late' do not change.","fr":"Adjectif + -ly. Exceptions : good → well ; fast, hard, late invariables.","mg":"Mpamaritra + -ly. Ankoatra: good → well; fast, hard, late tsy miova.","blocks":[{"t":"p","text":"■  quick      quickly      →  regular"},{"t":"p","text":"■  happy      happily      →  y → ily"},{"t":"p","text":"■  automatic      automatically      →  -ic → -ically"},{"t":"p","text":"■  good      well      →  irregular"},{"t":"p","text":"■  fast / hard / late      fast / hard / late      →  same form"}]},{"title":"COMPARATIVES","expl":"Short adjective (1 syllable): ADJ + er + than (taller than). Long adjective (2+ syllables): more + ADJ + than (more interesting than). Inferiority: less + ADJ + than. Equality: as + ADJ + as.","fr":"Court : -er than. Long : more … than. Infériorité : less … than. Égalité : as … as.","mg":"Fohy: -er than. Lava: more … than. Mitovy: as … as.","blocks":[{"t":"v","v":[{"en":"cheaper than","ph":"tchi-per than","fr":"moins cher que","mg":"mora kokoa noho"},{"en":"more useful than","ph":"mor iouss-foul","fr":"plus utile que","mg":"mahasoa kokoa noho"},{"en":"less expensive than","ph":"less eks-pen-siv","fr":"moins cher que","mg":"tsy dia lafo noho"},{"en":"as fast as","ph":"az fast az","fr":"aussi rapide que","mg":"haingana tahaka"},{"en":"better / worse than","ph":"bè-ter / wers","fr":"meilleur / pire que","mg":"tsara / ratsy kokoa"},{"en":"bigger (big + g + er)","ph":"bi-guer","fr":"plus grand","mg":"lehibe kokoa"}]}]},{"title":"SUPERLATIVES","expl":"Short: the + ADJ + est (the tallest). Long: the most + ADJ (the most interesting). Irregular: good → the best, bad → the worst, far → the furthest.","fr":"Court : the …est. Long : the most … . Irréguliers : the best, the worst, the furthest.","mg":"Fohy: the …est. Lava: the most ….","blocks":[{"t":"v","v":[{"en":"the cheapest option","ph":"the tchi-pist","fr":"l'option la moins chère","mg":"ny mora indrindra"},{"en":"the most popular app","ph":"the most po-piou-ler","fr":"l'appli la plus populaire","mg":"ny malaza indrindra"},{"en":"the best decision","ph":"the bèst","fr":"la meilleure décision","mg":"ny fanapahan-kevitra tsara indrindra"},{"en":"the worst mistake","ph":"the werst","fr":"la pire erreur","mg":"ny hadisoana ratsy indrindra"},{"en":"The more you practise, the better you speak.","ph":"the mor… the bè-ter","fr":"Plus tu pratiques, mieux tu parles.","mg":"Arakaraka ny fampiharana no ahaiza-miteny."}]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Comparative or superlative?","items":["This phone is ______ (cheap) than that one.","She is ______ (good) student in the class.","English is ______ (useful) than I thought.","That was ______ (bad) day of my life.","Turn into an adverb: careful → ______ ; automatic → ______ ; good → ______"]}},{"seance":22,"chapitre":29,"title":"Future Forms","sub":"Les formes du futur • Ny hoavy","intro":[],"sections":[{"title":"WILL, GOING TO, PRESENT CONTINUOUS","expl":"WILL = a decision taken at the moment of speaking, a prediction or a promise ('I'll help you'). GOING TO = an intention decided before ('I'm going to start a business'). PRESENT CONTINUOUS = a fixed arrangement with a date ('I'm flying on Monday').","fr":"WILL décision immédiate/prédiction ; GOING TO intention déjà prise ; PRESENT CONTINUOUS arrangement fixé.","mg":"WILL fanapahan-kevitra am-pilazana; GOING TO fikasana efa noeritreretina; PRESENT CONTINUOUS fandaharana voafaritra.","blocks":[{"t":"tb","rows":[["Form","Meaning","Example"],["will + base verb","decision now, promise, prediction","I'll call you back."],["be going to + base verb","intention, visible evidence","I'm going to save money."],["present continuous","fixed arrangement","We're meeting at six."],["will be + V-ing","action in progress in the future","This time tomorrow I'll be flying."]]}]},{"title":"TALKING ABOUT YOUR PLANS","expl":"These are the sentences you will need in a job interview or when presenting a project.","fr":"Phrases utiles en entretien ou pour présenter un projet.","mg":"Fehezanteny ilaina amin'ny fanadinana asa na fanolorana tetikasa.","blocks":[{"t":"v","v":[{"en":"I'm going to launch a project.","ph":"lontch","fr":"Je vais lancer un projet.","mg":"Hanangana tetikasa aho."},{"en":"I'll do my best.","ph":"aïl dou maï bèst","fr":"Je ferai de mon mieux.","mg":"Hanao izay tratry ny aiko aho."},{"en":"I plan to move next year.","ph":"aï plan tou","fr":"Je compte déménager l'an prochain.","mg":"Mikasa hifindra aho."},{"en":"I'm about to leave.","ph":"e-baout tou","fr":"Je suis sur le point de partir.","mg":"Efa handeha aho."},{"en":"In five years, I'll have finished.","ph":"aïl hav fi-nicht","fr":"Dans cinq ans, j'aurai fini.","mg":"Ao anatin'ny dimy taona dia ho vitako."},{"en":"Hopefully, it will work.","ph":"hop-fou-li","fr":"Avec un peu de chance, ça marchera.","mg":"Antenaina fa handeha tsara."}]},{"t":"c","title":"Watch out","text":"No WILL after IF in a type 1 conditional. 'If it will rain' is wrong; say 'If it rains, I will stay home'."}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"WILL, GOING TO or present continuous?","items":["Look at those clouds! It ______ rain.","The phone is ringing. — Don't move, I ______ answer it.","I ______ (meet) my supervisor at 3 p.m. tomorrow. (fixed)","She has bought the tickets: she ______ travel to Kenya.","Write five sentences about your plans for the next two years."]}},{"seance":23,"chapitre":30,"title":"Modal Verbs","sub":"Les verbes modaux • Ny matoanteny modaly","intro":["Modals are small words with heavy meanings. 'You must' and 'you should' are one letter group apart and a world apart in politeness."],"sections":[{"title":"THE RULES OF MODALS","expl":"Modals never take -s in the third person (he can, NOT he cans), are always followed by the base verb without 'to', and form their past with HAVE + past participle: 'You should have called.'","fr":"Jamais de -s, jamais de 'to' après, passé avec HAVE + participe passé.","mg":"Tsy misy -s, tsy misy 'to', ny lasa dia HAVE + past participle.","blocks":[{"t":"tb","rows":[["Modal","Meaning","Past"],["can / can't","ability, permission","could / was able to"],["may / might","possibility","may have / might have + p.p."],["must / have to","obligation, strong probability","had to / must have + p.p."],["should / ought to","advice, moral duty","should have + p.p. = regret"],["would","conditional, polite request","would have + p.p."],["needn't / don't have to","absence of obligation","didn't have to"]]}]},{"title":"MODALS IN REAL SENTENCES","expl":"Notice the difference between 'mustn't' (it is forbidden) and 'don't have to' (it is not necessary). This is one of the most frequent mistakes.","fr":"'mustn't' = interdit ; 'don't have to' = pas obligatoire. Erreur très fréquente.","mg":"'mustn't' = voarara; 'don't have to' = tsy tsy maintsy.","blocks":[{"t":"v","v":[{"en":"Can you help me?","ph":"kan you hèlp mi","fr":"Peux-tu m'aider ?","mg":"Afaka manampy ahy ve ianao?"},{"en":"It might rain later.","ph":"maït reïn","fr":"Il se peut qu'il pleuve.","mg":"Mety hanorana any aoriana."},{"en":"You must wear a helmet.","ph":"mast wèr","fr":"Tu dois porter un casque.","mg":"Tsy maintsy misatroka ianao."},{"en":"You mustn't smoke here.","ph":"ma-sent smok","fr":"Il est interdit de fumer ici.","mg":"Voarara ny mifoka eto."},{"en":"You don't have to come.","ph":"dont hav tou","fr":"Tu n'es pas obligé de venir.","mg":"Tsy voatery ho avy ianao."},{"en":"You should revise more.","ph":"choud ri-vaïz","fr":"Tu devrais réviser plus.","mg":"Tokony hamerina mianatra ianao."},{"en":"I should have studied harder.","ph":"choud hav sta-did","fr":"J'aurais dû étudier plus.","mg":"Tokony nianatra mafy kokoa aho."},{"en":"Would you mind waiting?","ph":"woud you maïnd","fr":"Cela vous dérange d'attendre ?","mg":"Mba afaka miandry ve ianao?"}]},{"t":"c","title":"The difference that changes everything","text":"MUSTN'T = it is forbidden. DON'T HAVE TO = it is not necessary. 'You mustn't come' and 'You don't have to come' are opposite messages."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Complete with the right modal.","items":["I got a C. I ______ have studied harder.","Don't be hard on yourself. It ______ not be your fault.","You ______ park here — it's forbidden.","It's Sunday, you ______ get up early. (pas obligé)","Translate: « Tu aurais dû me le dire. »"]}},{"seance":24,"chapitre":24,"title":"Numbers & Sums","sub":"Les nombres et les calculs • Ny isa sy ny kajy","intro":[],"sections":[{"title":"CARDINAL AND ORDINAL NUMBERS","expl":"Cardinal numbers count (one, two); ordinal numbers rank (first, second). From 21, join with a hyphen: twenty-one, thirty-second. Put AND before the tens in British English: 125 = one hundred and twenty-five.","fr":"Cardinaux comptent, ordinaux classent. 'and' avant la dizaine en anglais britannique.","mg":"Cardinal manisa, ordinal manondro laharana.","blocks":[{"t":"tb","rows":[["Number","Cardinal","Ordinal"],["1 / 2 / 3","one / two / three","first / second / third"],["5 / 9 / 12","five / nine / twelve","fifth / ninth / twelfth"],["20 / 21","twenty / twenty-one","twentieth / twenty-first"],["100 / 1,000","a hundred / a thousand","hundredth / thousandth"],["1,000,000","a million","millionth"]]}]},{"title":"READING SUMS AND ZERO","expl":"The symbol + is 'plus', − is 'minus', × is 'times' or 'multiplied by', ÷ is 'divided by', = is 'equals'. The decimal point is read 'point' and the digits after it are read one by one: 1.36 = 'one point three six'.","fr":"Le point décimal se dit 'point' et les chiffres après se lisent un par un.","mg":"Ny teboka desimaly dia 'point', ary vakiana tsirairay ny isa manaraka.","blocks":[{"t":"v","v":[{"en":"4 + 6 = 10","ph":"for plas siks i-kwelz tèn","fr":"4 plus 6 égale 10","mg":"efatra ampy enina"},{"en":"9 − 3 = 6","ph":"naïn maï-ness thri","fr":"9 moins 3","mg":"sivy latsaka telo"},{"en":"5 × 2 = 10","ph":"faïv taïmz tou","fr":"5 fois 2","mg":"dimy indroa"},{"en":"8 ÷ 4 = 2","ph":"eït di-vaï-did baï for","fr":"8 divisé par 4","mg":"valo zaraina efatra"},{"en":"10% of 100","ph":"tèn per-sent ov","fr":"10 pour cent de 100","mg":"10 isan-jato"},{"en":"0 = 'oh' (phone number)","ph":"o","fr":"zéro (téléphone)","mg":"aotra"},{"en":"0 = 'nil' (football)","ph":"nil","fr":"zéro (football)","mg":"aotra"},{"en":"0 = 'zero' (temperature)","ph":"zi-ro","fr":"zéro (température)","mg":"aotra"}]}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Write in words.","items":["1,250 → ______________","3rd → ______________   3. 12th → ______________","7.05 → ______________","Read aloud: 'Chelsea 2 – Arsenal 0.'"]}},{"seance":25,"chapitre":31,"title":"Conditionals (If Clauses)","sub":"Les conditionnelles • Ny fehezanteny misy 'raha'","intro":[],"sections":[{"title":"THE THREE MAIN TYPES","expl":"Type 1 (real, possible): IF + present simple → WILL. Type 2 (imaginary, present): IF + simple past → WOULD. Type 3 (impossible, past regret): IF + past perfect → WOULD HAVE + past participle. Never put WILL after IF.","fr":"Type 1 réel, Type 2 imaginaire, Type 3 regret. Jamais WILL après IF.","mg":"Type 1 azo atao, Type 2 nofinofy, Type 3 nenina. Tsy misy WILL aorian'ny IF.","blocks":[{"t":"p","text":"■  1 — real      If I have time,      →  I will call you."},{"t":"p","text":"■  2 — imaginary      If I had money,      →  I would buy that car."},{"t":"p","text":"■  2 — advice      If I were you,      →  I would accept the offer."},{"t":"p","text":"■  3 — regret      If I had studied,      →  I would have passed."},{"t":"p","text":"■  0 — general truth      If you heat water,      →  it boils."}]},{"title":"OTHER CONDITIONAL LINKS","expl":"These connectors replace IF with a shade of meaning: 'unless' = if not, 'as long as' = on condition that, 'in case' = by precaution.","fr":"'unless' = sauf si ; 'as long as' = tant que ; 'in case' = au cas où.","mg":"'unless' = raha tsy; 'as long as' = raha mbola.","blocks":[{"t":"v","v":[{"en":"unless you hurry","ph":"an-less","fr":"à moins que tu te dépêches","mg":"raha tsy maika ianao"},{"en":"as long as you try","ph":"az long az","fr":"tant que tu essaies","mg":"raha mbola miezaka ianao"},{"en":"in case it rains","ph":"in keïss","fr":"au cas où il pleuvrait","mg":"sao dia hanorana"},{"en":"provided that you pay","ph":"pro-vaï-did that","fr":"à condition que tu paies","mg":"raha handoa ianao"},{"en":"whether you like it or not","ph":"wè-ther","fr":"que ça te plaise ou non","mg":"na tianao na tsia"},{"en":"either… or / neither… nor","ph":"aï-ther / naï-ther","fr":"soit… soit / ni… ni","mg":"na… na / tsy… na"}]}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Put the verbs in the correct form.","items":["If I ______ (have) time, I ______ (come) tonight.","If I ______ (be) you, I ______ (accept) the job.","If she ______ (revise), she ______ (pass) the exam. (regret)","You'll be late ______ you leave now. (à moins que)","Write one sentence of each type about your own life."]}},{"seance":26,"chapitre":32,"title":"Active & Passive Voice","sub":"Voix active et passive • Ny endrika mavitrika sy iharam-boka","intro":[],"sections":[{"title":"BUILDING THE PASSIVE","expl":"Structure: BE (in the tense of the active verb) + past participle. We use the passive when the agent is unknown or unimportant: 'My phone was stolen.' To name the agent, add BY: 'The song was written by her.'","fr":"BE au temps voulu + participe passé. On l'emploie quand l'agent est inconnu ou secondaire.","mg":"BE (araka ny fotoana) + past participle. Ampiasaina raha tsy fantatra ny mpanao.","blocks":[{"t":"tb","rows":[["Tense","Active","Passive"],["present","A sees B","B is seen by A"],["present cont.","A is seeing B","B is being seen by A"],["simple past","A saw B","B was seen by A"],["present perfect","A has seen B","B has been seen by A"],["future","A will see B","B will be seen by A"],["modal","A may see B","B may be seen by A"]]}]},{"title":"GET AND CAUSATIVE FORMS","expl":"'Get + past participle' is the informal passive: 'He got fired.' The causative 'have something done' means you do not do it yourself: 'I had my car washed.'","fr":"'get + participe' = passif familier ; 'have sth done' = faire faire.","mg":"'get + p.p.' = passif tsotra; 'have sth done' = mampanao.","blocks":[{"t":"v","v":[{"en":"He got fired.","ph":"gat faï-erd","fr":"","mg":""},{"en":"FR  Il s'est fait virer.","ph":"","fr":"MG  Noroahina izy.","mg":""},{"en":"I got paid yesterday.","ph":"gat peïd","fr":"","mg":""},{"en":"FR  J'ai été payé hier.","ph":"","fr":"MG  Nandray karama aho omaly.","mg":""},{"en":"I had my hair cut.","ph":"had maï hèr kat","fr":"","mg":""},{"en":"FR  Je me suis fait couper les cheveux.","ph":"","fr":"MG  Nampanety volo aho.","mg":""},{"en":"We're having the job done.","ph":"ha-ving","fr":"","mg":""},{"en":"FR  On fait faire le travail.","ph":"","fr":"MG  Ampanaovinay ny asa.","mg":""},{"en":"English is spoken worldwide.","ph":"iz spo-ken","fr":"","mg":""},{"en":"FR  L'anglais est parlé dans le monde entier.","ph":"","fr":"MG  Ampiasaina manerantany ny anglisy.","mg":""}]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Turn into the passive.","items":["Someone stole my bag. → ______","They will announce the results tomorrow. → ______","She has finished the report. → ______","Translate: « Je me suis fait couper les cheveux. »","Why is the passive useful in news headlines? Answer in English (2 sentences)."]}},{"seance":27,"chapitre":33,"title":"Reported Speech","sub":"Le discours indirect • Ny teny ampitaina","intro":[],"sections":[{"title":"CHANGING THE TENSE","expl":"When the introducing verb is in the past (he said, she asked), the tense of the sentence moves one step back into the past.","fr":"Si le verbe introducteur est au passé, le temps recule d'un cran.","mg":"Raha lasa ny matoanteny mampiditra dia mihemotra ny fotoana.","blocks":[{"t":"tb","rows":[["Direct speech","→","Reported speech"],["present simple","→","simple past"],["present continuous","→","past continuous"],["simple past","→","past perfect"],["present perfect","→","past perfect"],["will","→","would"],["can / may","→","could / might"],["must / should / could","→","unchanged"]]}]},{"title":"CHANGING TIME AND PLACE WORDS","expl":"Words that point to the moment of speaking also change. And remember: in a reported question there is NO auxiliary and NO question mark. 'Where do you live?' → 'He asked me where I lived.'","fr":"Dans une question rapportée : pas d'auxiliaire, pas de point d'interrogation.","mg":"Amin'ny fanontaniana ampitaina: tsy misy mpanampy na marika fanontaniana.","blocks":[{"t":"tb","rows":[["Direct","→","Reported"],["now / today","→","then / that day"],["yesterday","→","the day before"],["tomorrow","→","the next day"],["here / this","→","there / that"],["Yes/No question","→","asked if / whether"],["Order","→","told me to + base verb"]]}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Report the sentences.","items":["'I'm tired,' he said. → He said ______","'Where do you work?' she asked. → She asked me ______","'Finish the report by Friday,' my boss said. → My boss told me ______","'Can you help me?' he asked. → He asked me ______","'I saw him yesterday,' she said. → She said ______"]}},{"seance":28,"chapitre":34,"title":"Gerund, Infinitive & 'Used To'","sub":"Gérondif, infinitif et l'habitude • Gerondy, infinitive ary fahazarana","intro":[],"sections":[{"title":"V-ING OR TO + VERB?","expl":"After a preposition, always V-ing ('good at singing'). After certain verbs — enjoy, avoid, keep, mind, finish, practise — always V-ing. After others — want, decide, hope, try, promise, need — always TO + verb.","fr":"Après une préposition : V-ing. Après enjoy/avoid/keep : V-ing. Après want/decide/hope : to + verbe.","mg":"Aorian'ny preposition: V-ing. Aorian'ny want/decide: to + verbe.","blocks":[{"t":"p","text":"■  enjoy, avoid, keep      want, decide, hope      →  begin, start, continue"},{"t":"p","text":"■  mind, finish, practise      promise, need, refuse      →  like, love, hate, prefer"},{"t":"p","text":"■  look forward to      manage, learn, offer      →  (careful: stop / remember change meaning)"}]},{"title":"BE USED TO / GET USED TO / USED TO","expl":"'I used to smoke' = a past habit that has stopped. 'I am used to smoking' = I am accustomed to it. 'I am getting used to it' = I am becoming accustomed. Only the first is followed by the base verb.","fr":"'used to + base' = habitude passée. 'be/get used to + V-ing' = être/devenir habitué.","mg":"'used to + verbe' = fahazarana taloha. 'be used to + V-ing' = zatra.","blocks":[{"t":"v","v":[{"en":"I used to play football.","ph":"iouzd tou pleï","fr":"Je jouais au foot (avant).","mg":"Nilalao baolina aho taloha."},{"en":"I'm used to waking up early.","ph":"iouzd tou weï-king","fr":"J'ai l'habitude de me lever tôt.","mg":"Zatra mifoha maraina aho."},{"en":"I'm getting used to the city.","ph":"guè-ting iouzd","fr":"Je m'habitue à la ville.","mg":"Mihazatra amin'ny tanàna aho."},{"en":"I look forward to meeting you.","ph":"louk for-werd tou","fr":"J'ai hâte de te rencontrer.","mg":"Tsy mahandry ny hihaona aminao aho."},{"en":"I don't mind waiting.","ph":"dont maïnd","fr":"Ça ne me dérange pas d'attendre.","mg":"Tsy mampaninona ahy ny miandry."},{"en":"He dared to speak up.","ph":"dèrd tou","fr":"Il a osé parler.","mg":"Sahy niteny izy."}]},{"t":"c","title":"Watch out","text":"'I used to run' = a past habit that has stopped. 'I am used to running' = I am accustomed to it. One base verb, one -ing form: the difference is total."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"V-ing or to + verb?","items":["I enjoy ______ (read) before bed.","She decided ______ (start) her own business.","I'm looking forward to ______ (see) you.","I used ______ (live) in Tulear when I was a child.","Explain the difference: 'I stopped smoking' / 'I stopped to smoke'."]}},{"seance":29,"chapitre":35,"title":"Tricky Grammar: Plurals, Tag Questions & Make/Let/Help","sub":"Pièges grammaticaux • Fandrika ara-pitsipi-teny","intro":[],"sections":[{"title":"IRREGULAR PLURALS","expl":"Some nouns do not simply take -s. Learn the most frequent ones by heart.","fr":"Certains pluriels sont irréguliers : à apprendre par cœur.","mg":"Misy ploraly tsy manaraka ny fitsipika: tadidio.","blocks":[{"t":"tb","rows":[["Singular","Plural","Français"],["life","lives","vies"],["child","children","enfants"],["wife / knife","wives / knives","épouses / couteaux"],["leaf","leaves","feuilles"],["mouse / louse","mice / lice","souris / poux"],["man / woman","men / women","hommes / femmes"],["foot / tooth","feet / teeth","pieds / dents"],["person","people","personnes"]]}]},{"title":"TAG QUESTIONS","expl":"The tag is the English 'n'est-ce pas'. Rule: affirmative sentence → negative tag; negative sentence → affirmative tag. Repeat the auxiliary; if there is none, use DO/DOES/DID.","fr":"Phrase affirmative → tag négatif, et inversement. On reprend l'auxiliaire.","mg":"Filaza tsotra → tag manda, ary mifamadika.","blocks":[{"t":"tb","rows":[["Sentence","Tag","Français"],["You're late,","aren't you?","n'est-ce pas ?"],["He isn't coming,","is he?","n'est-ce pas ?"],["You like it,","don't you?","n'est-ce pas ?"],["She works hard,","doesn't she?","n'est-ce pas ?"],["They didn't call,","did they?","n'est-ce pas ?"],["You'll come,","won't you?","n'est-ce pas ?"]]}]},{"title":"MAKE, LET, HELP + BASE VERB","expl":"These three verbs are followed by the base verb without 'to': 'She made me laugh', 'Let him speak', 'Help me carry this.' MAKE + adjective means to cause a state: 'You made me angry.'","fr":"make / let / help + verbe sans 'to'. make + adjectif = rendre.","mg":"make / let / help + verbe tsy misy 'to'.","blocks":[{"t":"v","v":[{"en":"She made me laugh.","ph":"meïd mi laf","fr":"Elle m'a fait rire.","mg":"Nampihomehy ahy izy."},{"en":"Don't let anyone bully you.","ph":"lèt / bou-li","fr":"Ne laisse personne t'intimider.","mg":"Aza avela hisy hampijaly anao."},{"en":"Help me carry this.","ph":"hèlp mi ka-ri","fr":"Aide-moi à porter ça.","mg":"Ampio aho hitondra ity."},{"en":"You made me angry.","ph":"meïd mi an-gri","fr":"Tu m'as mis en colère.","mg":"Nampitezitra ahy ianao."},{"en":"It makes me happy.","ph":"meïks mi ha-pi","fr":"Ça me rend heureux.","mg":"Mahafaly ahy izany."}]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Add the tag question and correct the plural.","items":["You've finished, ______ ?","She doesn't know, ______ ?","Plural of: child ___ , foot ___ , knife ___ , person ___","Correct: 'She made me to laugh.' → ______","Write three sentences with make / let / help."]}},{"seance":30,"chapitre":9,"title":"Phone, Apps & Social Media","sub":"Téléphone, applis et réseaux sociaux • Finday, rindrambaiko, tambajotra sosialy","intro":["Here is the strange thing about our generation: we spend six hours a day inside English — apps, captions, playlists, comments — and yet we cannot say 'my battery is dead' out loud. This chapter closes that gap."],"sections":[{"title":"YOUR PHONE, EVERY DAY","expl":"Most digital verbs in English are phrasal verbs: a verb + a small word that changes the meaning. 'Log in' is not 'log'. Learn the pair together.","fr":"Le vocabulaire numérique repose sur des verbes à particule : apprends le couple entier.","mg":"Ny teny momba ny teknolojia dia matetika 'phrasal verbs': tadidio miaraka.","blocks":[{"t":"v","v":[{"en":"to charge my phone","ph":"tcharj maï fon","fr":"recharger mon téléphone","mg":"mampikarga ny findaiko"},{"en":"My battery is dead.","ph":"ba-te-ri iz dèd","fr":"Ma batterie est morte.","mg":"Lany ny bateriko."},{"en":"to log in / to log out","ph":"log in / log aout","fr":"se connecter / se déconnecter","mg":"miditra / mivoaka"},{"en":"to download an app","ph":"daoun-lod en ap","fr":"télécharger une appli","mg":"misintona rindrambaiko"},{"en":"to update the app","ph":"ap-deït","fr":"mettre à jour l'appli","mg":"manavao ny rindrambaiko"},{"en":"The Wi-Fi is down.","ph":"waï-faï iz daoun","fr":"Le Wi-Fi ne marche pas.","mg":"Tsy mandeha ny Wi-Fi."},{"en":"I ran out of data.","ph":"ran aout ov deï-ta","fr":"Je n'ai plus de données.","mg":"Lany ny data-ko."},{"en":"to take a screenshot","ph":"skrin-chot","fr":"faire une capture d'écran","mg":"maka sary mivantana"},{"en":"My phone froze.","ph":"maï fon froz","fr":"Mon téléphone a planté.","mg":"Nijanona ny findaiko."}]}]},{"title":"SOCIAL MEDIA","expl":"On social media we 'post' content, people 'like', 'comment' and 'share' it. A video that spreads very fast 'goes viral'. Someone who follows you is a 'follower'.","fr":"On 'post' du contenu ; une vidéo qui explose 'goes viral'.","mg":"Mametraka votoaty ('post'); ny lahatsary miely haingana dia 'goes viral'.","blocks":[{"t":"v","v":[{"en":"to post a picture","ph":"post e pik-tcher","fr":"publier une photo","mg":"mametraka sary"},{"en":"to scroll the feed","ph":"skrol the fid","fr":"faire défiler le fil","mg":"mikisaka ny fandaharana"},{"en":"to like / to comment","ph":"laïk / ko-ment","fr":"aimer / commenter","mg":"tia / maneho hevitra"},{"en":"to share a video","ph":"chèr e vi-di-o","fr":"partager une vidéo","mg":"mizara lahatsary"},{"en":"It went viral.","ph":"it wènt vaï-rel","fr":"C'est devenu viral.","mg":"Niely haingana be izany."},{"en":"followers / subscribers","ph":"fo-lo-erz","fr":"abonnés","mg":"mpanaraka"},{"en":"to go live","ph":"go laïv","fr":"faire un direct","mg":"mivantana"},{"en":"to block / to report someone","ph":"blok / ri-port","fr":"bloquer / signaler","mg":"manakana / mitatitra"},{"en":"screen time","ph":"skrin taïm","fr":"temps d'écran","mg":"fotoana eo anoloan'ny efijery"}]},{"t":"c","title":"Watch out","text":"A 'notification' is countable, but 'information' never takes an -s in English. Say 'some information', never 'informations'."}]},{"title":"MESSAGING AND CALLING","expl":"'Call' and 'text' are both verbs and nouns. 'Hang up' ends a call; 'pick up' answers it.","fr":"'Hang up' = raccrocher ; 'pick up' = décrocher.","mg":"'Hang up' = mandray antso; 'pick up' = mamaly antso.","blocks":[{"t":"v","v":[{"en":"to call / to text someone","ph":"kol / tèkst","fr":"appeler / envoyer un SMS","mg":"miantso / mandefa hafatra"},{"en":"to pick up / to hang up","ph":"pik ap / hang ap","fr":"décrocher / raccrocher","mg":"mandray / mamono antso"},{"en":"a video call","ph":"vi-di-o kol","fr":"un appel vidéo","mg":"antso an-tsary"},{"en":"Can you hear me?","ph":"kan you hir mi","fr":"Tu m'entends ?","mg":"Renao ve aho?"},{"en":"You're breaking up.","ph":"brei-king ap","fr":"Ça coupe.","mg":"Tapatapaka ny feo."},{"en":"I'll call you back.","ph":"kol you bak","fr":"Je te rappelle.","mg":"Hiantso anao indray aho."},{"en":"Leave me a voice note.","ph":"voïss not","fr":"Laisse-moi un vocal.","mg":"Andefaso hafatra am-peo."}]}]}],"dialogue":[{"who":"A","text":"Hey, did you see my post? It went viral!"},{"who":"B","text":"No, sorry — the Wi-Fi is down and I ran out of data."},{"who":"A","text":"Log in when you can. It already has two thousand likes."},{"who":"B","text":"Send me a screenshot, my phone froze this morning."}],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Complete with the right phrasal verb: log in • ran out of • went viral • hang up • download","items":["I can't watch the video, I ______ data.","Please ______ the app before the meeting.","Her dance video ______ in two days.","Don't ______ , I'm still talking!","Write four sentences about how you use social media."]}},{"seance":31,"chapitre":10,"title":"Money, Mobile Payment & Side Hustles","sub":"L'argent, le paiement mobile et les petits business • Vola, fandoavam-bola an-tserasera, asa fanampiny","intro":["Money is the topic where French speakers make the most mistakes in English, because the words look familiar and behave differently. Read this chapter slowly."],"sections":[{"title":"TALKING ABOUT MONEY","expl":"'To afford' means to have enough money for something; it is always used with can/can't. 'Cheap' describes a low price; 'affordable' describes a fair price you can pay.","fr":"'Afford' s'emploie toujours avec can/can't. 'Cheap' = bon marché ; 'affordable' = abordable.","mg":"'Afford' dia miaraka amin'ny can/can't foana.","blocks":[{"t":"v","v":[{"en":"It's expensive / cheap.","ph":"eks-pen-siv / tchip","fr":"","mg":""},{"en":"FR  C'est cher / bon marché.","ph":"","fr":"MG  Lafo / mora.","mg":""},{"en":"I can't afford it.","ph":"aï kant e-ford it","fr":"","mg":""},{"en":"FR  Je ne peux pas me le permettre.","ph":"","fr":"MG  Tsy takatro izany.","mg":""},{"en":"to save money","ph":"seïv ma-ni","fr":"","mg":""},{"en":"FR  économiser","ph":"","fr":"MG  mitahiry vola","mg":""},{"en":"to spend money on…","ph":"spend ma-ni on","fr":"","mg":""},{"en":"FR  dépenser en…","ph":"","fr":"MG  mandany vola amin'ny","mg":""},{"en":"to be broke","ph":"tou bi brok","fr":"","mg":""},{"en":"FR  être fauché","ph":"","fr":"MG  tsy manam-bola","mg":""},{"en":"to borrow / to lend","ph":"bo-ro / lend","fr":"","mg":""},{"en":"FR  emprunter / prêter","ph":"","fr":"MG  mindrana / mampindrana","mg":""},{"en":"to owe someone money","ph":"tou o","fr":"","mg":""},{"en":"FR  devoir de l'argent","ph":"","fr":"MG  tsosa vola","mg":""},{"en":"income / expenses","ph":"in-kam / eks-pen-siz","fr":"","mg":""},{"en":"FR  revenus / dépenses","ph":"","fr":"MG  fidiram-bola / fandaniana","mg":""},{"en":"a budget","ph":"ba-djet","fr":"","mg":""},{"en":"FR  un budget","ph":"","fr":"MG  teti-bola","mg":""}]}]},{"title":"PAYING AND SELLING","expl":"'Pay for something' takes 'for'. 'A refund' is money given back; 'a discount' is money taken off the price.","fr":"'Pay for' + chose. 'Refund' = remboursement ; 'discount' = réduction.","mg":"'Refund' = famerenam-bola; 'discount' = fihenam-bidy.","blocks":[{"t":"v","v":[{"en":"How much is it?","ph":"haou match iz it","fr":"Combien ça coûte ?","mg":"Ohatrinona?"},{"en":"to pay in cash / by card","ph":"in kach / baï kard","fr":"payer en espèces / par carte","mg":"mandoa amin'ny vola / karatra"},{"en":"mobile money transfer","ph":"mo-baïl ma-ni","fr":"transfert d'argent mobile","mg":"famindram-bola an-tserasera"},{"en":"a receipt","ph":"ri-sit","fr":"un reçu","mg":"tapakila"},{"en":"a discount","ph":"dis-kaount","fr":"une réduction","mg":"fihenam-bidy"},{"en":"a refund","ph":"ri-fand","fr":"un remboursement","mg":"famerenam-bola"},{"en":"Can you lower the price?","ph":"lo-er the praïss","fr":"Tu peux baisser le prix ?","mg":"Azo ahenanao ve ny vidiny?"},{"en":"It's a good deal.","ph":"e goud dil","fr":"C'est une bonne affaire.","mg":"Tsara vidy izany."}]},{"t":"c","title":"False friends","text":"'To assist' means to help, NOT to attend. You attend a meeting; you assist a colleague. 'Actually' means 'en fait', not 'actuellement'. For 'actuellement', say 'currently'."}]},{"title":"SIDE HUSTLES AND SMALL BUSINESS","expl":"A 'side hustle' is a small activity you run beside your studies or your main job. This vocabulary is the base of the debate chapters in Part 5.","fr":"Un 'side hustle' est une activité menée à côté des études ou du travail principal.","mg":"Ny 'side hustle' dia asa kely atao miaraka amin'ny fianarana na asa lehibe.","blocks":[{"t":"v","v":[{"en":"a side hustle","ph":"saïd ha-sel","fr":"une activité annexe","mg":"asa fanampiny"},{"en":"to start a business","ph":"start e biz-ness","fr":"lancer une affaire","mg":"manangana orinasa"},{"en":"a customer / a client","ph":"kas-te-mer","fr":"un client","mg":"mpanjifa"},{"en":"a supplier","ph":"se-plaï-er","fr":"un fournisseur","mg":"mpamatsy"},{"en":"the profit margin","ph":"pro-fit mar-djin","fr":"la marge","mg":"tombom-barotra"},{"en":"to make a profit / a loss","ph":"pro-fit / loss","fr":"faire un bénéfice / une perte","mg":"mahazo tombony / fatiantoka"},{"en":"to invest in…",
