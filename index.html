<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SpeakUp Gestion — by Stephen</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2D61B5; --blue-d:#234E96; --navy:#14238A; --navy-d:#0E1A66; --red:#A92B3A; --yellow:#F5CB4A;
  --cream:#FBF8F1; --paper:#FFFFFF; --sky:#DCE7F6; --sky-l:#EEF3FB; --ink:#16203A; --muted:#5F6B85; --line:#E4E0D4;
  --ok:#1F8A56; --ok-bg:#E3F4EA; --warn:#9A6A00; --warn-bg:#FFF3CF; --bad:#B3261E; --bad-bg:#FBE4E2;
  --r:14px; --shadow:0 1px 2px rgba(20,35,138,.06),0 6px 20px rgba(20,35,138,.07);
  --font:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif; --display:'Fraunces',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.5 var(--font);min-height:100vh}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15} h2{font-size:20px} h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .right{text-align:right} .nowrap{white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:
  radial-gradient(900px 500px at 85% -10%,rgba(245,203,74,.35),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,rgba(45,97,181,.25),transparent 60%),var(--cream)}
.login-card{width:100%;max-width:400px;background:var(--paper);border-radius:22px;padding:32px 28px;box-shadow:var(--shadow);border:1px solid var(--line)}
.login-card img{width:120px;display:block;margin:0 auto 10px}
.login-card h1{text-align:center;font-size:24px}
.login-card .by{text-align:center;color:var(--muted);font-size:12px;margin:4px 0 22px;letter-spacing:.06em}
.demo-banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:14px}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px;overflow:auto}
.brand{background:#fff;border-radius:16px;padding:12px 10px 10px;text-align:center}
.brand img{width:92px;display:block;margin:0 auto}
.brand b{display:block;font-family:var(--display);color:var(--navy);font-size:15px;margin-top:2px}
.brand span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin:12px 10px 4px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,.82);font-weight:500;font-size:13.5px}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:var(--yellow);color:var(--navy-d);font-weight:700}
nav button svg{width:18px;height:18px;flex:none}
nav button .soon{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.16);padding:1px 7px;border-radius:99px}
.who{margin-top:auto;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-size:12.5px}
.who b{display:block;font-size:13.5px}
.who button{all:unset;cursor:pointer;font-size:12px;text-decoration:underline;opacity:.85;margin-right:12px}
.byline{font-size:11px;opacity:.6;text-align:center}
main{padding:26px 30px 60px;min-width:0;max-width:1280px;width:100%}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,138,86,.5);animation:pulse 2s infinite}
.live.off i{background:var(--warn);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(31,138,86,0)}100%{box-shadow:0 0 0 0 rgba(31,138,86,0)}}

/* ---------- Components ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.grid>.card+.card{margin-top:0}
.g2>div>.card:first-child,.grid>div>.card:first-child{margin-top:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.kpi.y:before{background:var(--yellow)} .kpi.r:before{background:var(--red)} .kpi.n:before{background:var(--navy)}
.kpi small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi b{display:block;font-family:var(--display);font-size:30px;color:var(--navy);line-height:1.1;margin-top:4px}
.kpi span{font-size:12px;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--navy);transition:.15s}
.btn:hover{background:var(--sky-l);border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.accent{background:var(--yellow);border-color:var(--yellow);color:var(--navy-d)}
.btn.accent:hover{filter:brightness(.96)}
.btn.danger{color:var(--bad);border-color:#F0C9C6}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:15px;height:15px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--sky);color:var(--navy)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gray{background:#EEE;color:#555}
.pill.y{background:var(--yellow);color:var(--navy-d)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sky-l)}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty b{display:block;font-family:var(--display);font-size:18px;color:var(--navy);margin-bottom:4px}

/* forms */
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.f{grid-column:span 3;display:flex;flex-direction:column;gap:5px}
.f.w2{grid-column:span 2} .f.w4{grid-column:span 4} .f.w6{grid-column:span 6}
label{font-size:12px;font-weight:700;color:var(--navy);letter-spacing:.02em}
label .opt{font-weight:500;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,97,181,.15)}
textarea{min-height:90px;resize:vertical}
input[readonly]{background:var(--sky-l)}
.hint{font-size:11.5px;color:var(--muted)}
.form[style*="1fr 1fr"]>.f{grid-column:span 1}
.form[style*="1fr 1fr"]>.f.w6,.form[style*="1fr 1fr"]>.f.w4{grid-column:1/-1}
.form[style*="columns:1fr"]:not([style*="1fr 1fr"])>.f{grid-column:1/-1}
.fsec{grid-column:1/-1;font-family:var(--display);color:var(--red);font-size:16px;font-weight:700;border-bottom:2px solid var(--yellow);padding-bottom:4px;margin-top:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 13px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:12.5px;background:#fff}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:160px}
.toolbar .grow{flex:1;min-width:200px}

/* modal / drawer / toast */
.overlay{position:fixed;inset:0;background:rgba(14,26,102,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h2{margin-bottom:6px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--navy-d);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);max-width:340px;font-size:13px;animation:fade .2s}
.toast.err{background:var(--bad)} .toast.ok{background:var(--ok)}
.code-input{font-size:28px!important;letter-spacing:.5em;text-align:center;font-weight:700}

/* progress & lessons */
.bar{height:9px;background:var(--sky);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--navy));border-radius:99px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.les{border:1.5px solid var(--line);border-radius:10px;padding:8px 9px;font-size:12px;line-height:1.3;background:#fff;position:relative;min-height:62px}
.les b{display:block;color:var(--navy);font-size:12px;margin-bottom:2px}
.les.open{border-color:var(--ok);background:var(--ok-bg)}
.les.next{border-color:var(--yellow);background:var(--warn-bg);border-width:2px}
.les.lock{color:var(--muted);background:#F6F5F0}
.les.done b:after{content:" ✓";color:var(--ok)}
.part-title{grid-column:1/-1;font-family:var(--display);color:var(--red);font-weight:700;margin:10px 0 0;font-size:14px}

/* attendance */
.att-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.att-row:last-child{border:0}
.att-opts{display:flex;gap:5px}
.att-opts button{all:unset;cursor:pointer;padding:6px 11px;border-radius:8px;border:1.5px solid var(--line);font-size:12px;font-weight:700;background:#fff}
.att-opts button.p.on{background:var(--ok);border-color:var(--ok);color:#fff}
.att-opts button.a.on{background:var(--bad);border-color:var(--bad);color:#fff}
.att-opts button.l.on{background:var(--yellow);border-color:var(--yellow);color:var(--navy-d)}
.att-opts button.e.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-word}
.note-soon{border:2px dashed var(--sky);border-radius:14px;padding:16px;background:var(--sky-l);color:var(--navy)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button.on{color:var(--navy);border-color:var(--red)}
.phone{max-width:340px;margin:0 auto;border:8px solid var(--navy);border-radius:34px;background:var(--cream);padding:16px 14px 20px;min-height:420px}
.phone h3{margin-bottom:8px}

/* ---------- Receipt (screen + print + PDF) ---------- */
.receipt{background:#fff;color:#16203A;font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-size:12.5px;line-height:1.45;border:2px solid #14238A;border-radius:14px;padding:22px 24px;max-width:720px;margin:0 auto;position:relative}
.receipt .rh{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:3px solid #F5CB4A;padding-bottom:12px}
.receipt .rh img{height:74px}
.receipt .rh .inst{text-align:right;font-size:11.5px;color:#41507a}
.receipt .rh .inst b{display:block;font-size:15px;color:#14238A}
.receipt h2{font-family:Georgia,serif;color:#A92B3A;text-align:center;font-size:22px;margin:14px 0 2px;letter-spacing:.04em;text-transform:uppercase}
.receipt .num{text-align:center;color:#14238A;font-weight:700;margin-bottom:12px}
.receipt table{margin:8px 0}
.receipt td,.receipt th{padding:6px 8px;border-bottom:1px solid #E4E0D4;font-size:12.5px;text-transform:none;letter-spacing:0;color:#16203A}
.receipt td:first-child{color:#5F6B85;width:36%}
.receipt .tot td{font-weight:700;border-top:2px solid #14238A;border-bottom:0;font-size:14px;color:#14238A}
.receipt .tot td:first-child{color:#14238A}
.receipt .sign{display:flex;justify-content:space-between;margin-top:18px;gap:20px;font-size:11.5px;color:#5F6B85}
.receipt .sign div{flex:1;border-top:1px solid #aaa;padding-top:4px;text-align:center;min-height:54px}
.receipt .foot{margin-top:14px;text-align:center;font-size:10.5px;color:#5F6B85;border-top:1px dashed #bbb;padding-top:8px}
.receipt .paid{position:absolute;right:26px;top:96px;transform:rotate(-12deg);border:3px solid #1F8A56;color:#1F8A56;font-weight:800;padding:2px 12px;border-radius:8px;letter-spacing:.12em;opacity:.8;font-size:16px}
.receipt .paid.part{border-color:#9A6A00;color:#9A6A00}
.receipt .void{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;color:rgba(179,38,30,.25);transform:rotate(-20deg);pointer-events:none}
#printArea{display:none}

/* ---------- Mobile ---------- */
@media (max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:40;transform:translateX(-100%);transition:.2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(14,26,102,.45)}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:30}
  .topbar button{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:2px 6px}
  .topbar b{font-family:var(--display)}
  main{padding:18px 16px 60px}
  .g2{grid-template-columns:1fr}
  .form[style]{grid-template-columns:1fr!important} .form[style]>.f{grid-column:1/-1!important}
  .form{grid-template-columns:1fr} .f,.f.w2,.f.w4,.f.w6{grid-column:1/-1}
  h1{font-size:24px}
  .kv{grid-template-columns:1fr}
}
@media print{
  #app,#login,#overlays,#toasts{display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  .report{font-size:12px}
  .report table{margin-bottom:6px}
  @page{margin:12mm}
}

/* ===== Diaporama animé ===== */
.dk{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 30% 20%,#1b2f9e,#0b1450 70%);display:flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;color:#fff;user-select:none}
.dk-prog{position:absolute;top:0;left:0;right:0;height:5px;background:rgba(255,255,255,.12);z-index:3}.dk-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#fff);transition:width .4s}
.dk-stage{position:relative;overflow:hidden;border-radius:calc(var(--u)*1.2);background:linear-gradient(160deg,#fff 0%,var(--cream) 60%,var(--sky) 100%);color:var(--navy);box-shadow:0 30px 80px rgba(0,0,0,.45);font-size:calc(var(--u)*1.55)}
.dk-view{position:absolute;inset:0}.dk-slide{position:absolute;inset:0;padding:5.5em 4.5em 3.5em}
.dk-slide>*{opacity:0}.dk-view.go .dk-slide>*{animation:dkIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,.05s)}
.dk-view.back.go .dk-slide>*{animation-name:dkInB}
@keyframes dkIn{from{opacity:0;transform:translateY(2.2em) scale(.97)}to{opacity:1;transform:none}}
@keyframes dkInB{from{opacity:0;transform:translateY(-1.6em)}to{opacity:1;transform:none}}
.dk [data-rv]{opacity:0!important;transform:translateY(1.2em) scale(.96);transition:all .5s cubic-bezier(.2,.8,.2,1)}
.dk [data-rv].on{opacity:1!important;transform:none}
.dk-slide>.dk-tag{position:absolute;left:4.5em;top:1.6em;margin:0}
.dk-tag span{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:.75em;letter-spacing:.06em;text-transform:uppercase;padding:.45em 1.1em;border-radius:99em;border-bottom:.2em solid var(--yellow)}
.dk-brand{position:absolute;right:2.2em;top:1.2em;display:flex;align-items:center;gap:.6em;font-size:.62em;font-weight:700;color:var(--navy);opacity:.75;z-index:2}.dk-brand img{height:2.8em}
.dk-slide.cover,.dk-slide.end{padding:0;background:linear-gradient(135deg,var(--navy),var(--blue) 70%,var(--acc,var(--blue)));color:#fff}
.dk-slide.cover>*,.dk-slide.end>*{opacity:1}
.dk-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 7em;overflow:hidden}
.dk-cover.end{align-items:center;text-align:center}
.dk-blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.28;animation:dkFloat 9s ease-in-out infinite}
.dk-blob.b1{width:24em;height:24em;right:-6em;top:-7em;background:var(--yellow)}.dk-blob.b2{width:18em;height:18em;right:10em;bottom:-9em;background:var(--red);animation-delay:-3s}.dk-blob.b3{width:9em;height:9em;left:44%;top:12%;background:#fff;opacity:.12;animation-delay:-6s}
@keyframes dkFloat{50%{transform:translate(1.5em,-1.5em) scale(1.06)}}
.dk-emoji{position:absolute;right:8em;top:50%;transform:translateY(-50%);font-size:11em;animation:dkPop 1s .3s both cubic-bezier(.3,1.5,.5,1)}
.dk-cover.end .dk-emoji{position:static;transform:none;font-size:7em;margin-bottom:.1em}
@keyframes dkPop{from{opacity:0;transform:translateY(-50%) scale(.2) rotate(-25deg)}to{opacity:1;transform:translateY(-50%)}}
.dk-cover.end .dk-emoji{animation-name:dkPop2}@keyframes dkPop2{from{opacity:0;transform:scale(.2) rotate(-25deg)}to{opacity:1;transform:none}}
.dk-kick{display:flex;align-items:center;gap:.8em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.8em;color:var(--yellow)}.dk-kick i{width:3em;height:.18em;background:var(--yellow);border-radius:9em}
.dk-title{font-family:'Fraunces',serif;font-size:4.4em;line-height:1.05;margin:.25em 0 .2em;max-width:11em;font-weight:800;text-wrap:balance}
.dk-sub{font-size:1.25em;opacity:.92;max-width:22em}.dk-sub.mg{opacity:.7;font-style:italic;font-size:1.05em;margin-top:.3em}
.dk-part{margin-top:2.2em;font-size:.75em;font-weight:600;opacity:.75;letter-spacing:.06em}

async function api(action, payload = {}) {
  try {
    let data;
    if (DEMO) { Demo.init(); await new Promise(r => setTimeout(r, 60)); data = Demo.call(action, payload, S.user ? (Demo.s.utilisateurs.find(u => u.id === S.user.id) || S.user) : null); }
    else {
      const res = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, payload }) });
      const j = await res.json();
      if (!j.ok) { if (j.code === 'SESSION') { toast('Session expirée, reconnecte-toi.', 'err'); doLogout(true); } throw new Error(j.error || 'Erreur serveur'); }
      data = j.data;
    }
    S.online = true; return data;
  } catch (e) {
    if (e instanceof TypeError) { S.online = false; throw new Error('Connexion impossible. Vérifie internet ou l’URL du serveur.'); }
    throw e;
  }
}

    return `<tr class="click" data-act="viewStudent" data-id="${e.id}"><td><b>${esc(etuNom(e))}</b><div class="small muted">${esc(e.matricule)} · ${esc(actLabel(e))}</div></td>

}
V.etudiants = () => `${pageHead('Étudiants', `${D.etudiants.length} enregistré(s)`, `<button class="btn primary" data-act="nav" data-id="inscriptions">${ic('userplus')} Nouvelle inscription</button>`)}
  <div class="card"><div class="toolbar"><input class="grow" type="search" placeholder="Rechercher : nom, matricule, téléphone, e-mail…" value="${esc(S.f.q)}" data-filter="q">

  <select data-filter="groupe"><option value="">Tous les groupes</option>${opts(D.groupes.filter(g => !S.f.vague || g.vague_id === S.f.vague), x => x.id, x => `${x.nom} · ${by(D.vagues, x.vague_id)?.nom || ''}`, S.f.groupe)}</select>
  <select data-filter="statut"><option value="">Tous statuts</option>${['inscrit', 'en cours', 'terminé', 'abandon'].map(s => `<option ${S.f.statut === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div><div id="stuList">${studentTable()}</div></div>`;

/* ===== Reçus ===== */
function receiptTable() {
  const q = S.f.rq.toLowerCase();

    const remise = r.statut === 'annule' ? '<span class="pill bad">annulé</span>' : (r.email_envoye ? '<span class="pill ok">papier + e-mail</span>' : (e?.email ? '<span class="pill warn">papier · e-mail à envoyer</span>' : '<span class="pill gray">papier seul</span>'));
    return `<tr><td class="nowrap"><b>${esc(r.numero)}</b><div class="small muted">${r.type === 'versement' ? 'versement' : 'inscription'}</div></td><td class="small nowrap">${fmtDT(r.date)}</td><td>${esc(r.nom)}<div class="small muted">${esc(r.matricule)}</div></td><td class="right mono"><b>${fmtMoney(r.montant)}</b><div class="small muted">reste ${fmtMoney(r.reste)}</div></td><td class="small">${esc(r.mode)}</td><td>${remise}</td>

V.recus = () => `${pageHead('Reçus', 'Chaque inscription et chaque versement génère un reçu numéroté, enregistré dans la base.')}

/* ===== Appel & séances ===== */
function attInit(gid, date) {
  const g = by(D.groupes, gid); if (!g) { S.att = null; return; }
  const st = {}; D.etudiants.filter(e => e.groupe_id === gid && e.statut !== 'abandon').forEach(e => { const x = D.presences.find(p => p.groupe_id === gid && p.date === date && p.etudiant_id === e.id); st[e.id] = x ? x.statut : ''; });
  const se = D.seances.find(s => s.groupe_id === gid && s.date === date);
  S.att = { gid, date, st, formateur_id: se?.formateur_id || g.formateur_id || '', seance_no: se ? Number(se.seance_no) : Math.min(50, lastTaught(g) + 1), duree: se ? se.duree : 1.5, note: se?.note || '', unlock: true };
}
V.presences = () => {
  const t = today(); const actives = D.groupes.filter(g => { const v = by(D.vagues, g.vague_id); return v && vagueStatut(v) !== 'terminée'; });
  if (!S.att || !by(D.groupes, S.att.gid)) { const wd = isoWeekday(t); const pick = actives.find(g => String(g.jours).split(',').map(Number).includes(wd) && vagueStatut(by(D.vagues, g.vague_id)) === 'en cours') || actives[0]; if (pick) attInit(pick.id, t); }
  const A = S.att;
  const head = pageHead('Appel & séances', 'Présence du jour, dernière leçon enseignée et déblocage des cours pour le groupe.');
  if (!A) return head + `<div class="card">${empty('Aucun groupe actif', 'Crée une vague et un groupe pour commencer.')}</div>`;
  const g = by(D.groupes, A.gid), studs = D.etudiants.filter(e => e.groupe_id === A.gid && e.statut !== 'abandon').sort((a, b) => etuNom(a).localeCompare(etuNom(b)));
  const c = { p: 0, a: 0, r: 0, e: 0, n: 0 }; studs.forEach(e => { const s = A.st[e.id]; if (s === 'present') c.p++; else if (s === 'absent') c.a++; else if (s === 'retard') c.r++; else if (s === 'excuse') c.e++; else c.n++; });
  const hist = D.seances.filter(s => s.groupe_id === A.gid).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  const btn = (e, k, cl, lab) => `<button class="${cl} ${A.st[e.id] === k ? 'on' : ''}" data-act="setAtt" data-id="${e.id}" data-k="${k}">${lab}</button>`;
  return `${head}<div class="grid g-main"><div>
   <div class="card"><div class="toolbar"><select data-change="attGroup" class="grow">${opts(actives, x => x.id, x => `${x.nom} · ${by(D.vagues, x.vague_id)?.nom} · ${x.h_debut}`, A.gid)}</select><input type="date" value="${A.date}" data-change="attDate"></div>
    <div class="chips" style="margin-bottom:8px"><span class="pill ok">${c.p} présent</span><span class="pill y">${c.r} retard</span><span class="pill bad">${c.a} absent</span><span class="pill">${c.e} excusé</span>${c.n ? `<span class="pill gray">${c.n} non saisi</span>` : ''}</div>
    ${studs.length ? studs.map(e => `<div class="att-row"><div><b>${esc(etuNom(e))}</b><div class="small muted">${esc(e.matricule)}${presStats(e.id).rate != null ? ` · assiduité ${presStats(e.id).rate} %` : ''}</div></div><div class="att-opts">${btn(e, 'present', 'p', 'Présent')}${btn(e, 'retard', 'l', 'Retard')}${btn(e, 'absent', 'a', 'Absent')}${btn(e, 'excuse', 'e', 'Excusé')}</div></div>`).join('') : empty('Aucun étudiant dans ce groupe')}
    <div class="foot" style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap"><button class="btn" data-act="allPresent">Tous présents</button><button class="btn primary" data-act="saveAtt" ${studs.length ? '' : 'disabled'}>${ic('check')} Enregistrer l’appel</button></div></div></div>
   <div><div class="card"><div class="card-head"><h2>Séance du jour</h2></div>
    <div class="form" style="grid-template-columns:1fr 1fr">
     <div class="f" style="grid-column:1/-1"><label>Leçon enseignée</label><select data-att="seance_no">${D.lecons.map(l => `<option value="${l.no}" ${Number(l.no) === Number(A.seance_no) ? 'selected' : ''}>Séance ${l.no} — ${esc(l.titre)}</option>`).join('')}</select><div class="hint">Dernière séance validée : ${lastTaught(g) ? `<b>${lastTaught(g)}</b> — ${esc(lecon(lastTaught(g))?.titre || '')}` : 'aucune'}</div></div>
     <div class="f"><label>Formateur</label><select data-att="formateur_id">${opts(D.formateurs, x => x.id, x => x.nom, A.formateur_id, '—')}</select></div>
     <div class="f"><label>Durée (h)</label><input type="number" step="0.25" min="0.5" value="${A.duree}" data-att="duree"></div>
     <div class="f" style="grid-column:1/-1"><label>Note <span class="opt">(facultatif)</span></label><input type="text" value="${esc(A.note)}" data-att="note" placeholder="Ex : exercices 3 et 4 à reprendre"></div>
     <div class="f" style="grid-column:1/-1"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" style="width:auto" ${A.unlock ? 'checked' : ''} data-att-chk="unlock"> Débloquer cette leçon pour les étudiants du groupe</label></div></div>
    <button class="btn accent" style="margin-top:12px" data-act="closeSession">${ic('unlock')} Valider la séance donnée</button></div>
    <div class="card"><div class="card-head"><h3>Dernières séances</h3></div>${hist.length ? hist.map(s => `<div style="padding:6px 0;border-bottom:1px solid var(--line)" class="small"><b>${fmtDate(s.date)}</b> · séance ${s.seance_no} — ${esc(lecon(s.seance_no)?.titre || '')}<div class="muted">${esc(by(D.formateurs, s.formateur_id)?.nom || '')} · ${s.presents} présents · ${s.duree} h</div></div>`).join('') : '<div class="muted small">Aucune séance enregistrée.</div>'}</div></div></div>`;
};

/* ===== Vagues ===== */
V.vagues = () => `${pageHead('Vagues', 'Chaque vague = une rentrée de 2 mois. Les groupes et créneaux s’y rattachent.', can('struct') ? `<button class="btn primary" data-act="vagueForm">${ic('plus')} Nouvelle vague</button>` : '')}
  <div class="grid g2">${[...D.vagues].sort((a, b) => b.debut.localeCompare(a.debut)).map(v => { const st = vagueStatut(v), n = D.etudiants.filter(e => e.vague_id === v.id && e.statut !== 'abandon').length, gs = D.groupes.filter(g => g.vague_id === v.id);
    const pr = st === 'en cours' ? Math.round(diffDays(v.debut, today()) / Math.max(1, diffDays(v.debut, v.fin)) * 100) : (st === 'terminée' ? 100 : 0);
    return `<div class="card"><div class="card-head"><div><h2>${esc(v.nom)}</h2><span class="pill ${statutPill(st)}">${st}</span></div>${can('struct') ? `<div class="actions"><button class="btn sm" data-act="vagueForm" data-id="${v.id}">${ic('edit')}</button><button class="btn sm danger" data-act="del" data-t="vagues" data-id="${v.id}">${ic('trash')}</button></div>` : ''}</div>
     <dl class="kv"><dt>Début</dt><dd>${fmtDate(v.debut)}</dd><dt>Fin</dt><dd>${fmtDate(v.fin)}</dd><dt>Prix</dt><dd>${fmtMoney(v.prix || P().prix_defaut)}</dd><dt>Inscrits</dt><dd>${n} · ${gs.length} groupe(s)</dd>${v.note ? `<dt>Note</dt><dd>${esc(v.note)}</dd>` : ''}</dl>
     <div class="bar" style="margin:12px 0"><i style="width:${pr}%"></i></div><div class="actions"><button class="btn sm" data-act="nav" data-id="groupes">Voir les groupes</button><button class="btn sm" data-act="reportVague" data-id="${v.id}">${ic('print')} Rapport</button></div></div>`; }).join('') || `<div class="card">${empty('Aucune vague', 'Crée la première rentrée (ex. 09/11/2026).')}</div>`}</div>`;

/* ===== Groupes ===== */
V.groupes = () => `${pageHead('Groupes & horaires', 'Un groupe = une vague + un créneau + un formateur. Maximum d’étudiants par groupe défini dans les paramètres.', can('struct') ? `<button class="btn primary" data-act="groupForm">${ic('plus')} Nouveau groupe</button>` : '')}
  ${[...D.vagues].sort((a, b) => b.debut.localeCompare(a.debut)).map(v => { const gs = D.groupes.filter(g => g.vague_id === v.id); if (!gs.length && vagueStatut(v) === 'terminée') return '';
    return `<h2 style="margin:18px 0 10px">${esc(v.nom)} <span class="pill ${statutPill(vagueStatut(v))}">${vagueStatut(v)}</span></h2><div class="grid g2">${gs.map(g => { const f = by(D.formateurs, g.formateur_id), n = effectif(g), done = lastTaught(g);
      return `<div class="card"><div class="card-head"><div><h3>${esc(g.nom)} <span class="pill">${modeLabel(g.mode)}</span></h3><div class="small muted">${esc(joursTxt(g))} · ${esc(g.h_debut)}–${esc(g.h_fin)} · ${fmtDate(v.debut)} → ${fmtDate(v.fin)}</div></div><div class="actions">${can('struct') ? `<button class="btn sm" data-act="groupForm" data-id="${g.id}">${ic('edit')}</button><button class="btn sm danger" data-act="del" data-t="groupes" data-id="${g.id}">${ic('trash')}</button>` : ''}</div></div>
       <dl class="kv"><dt>Formateur</dt><dd>${esc(f?.nom || '— à définir')}</dd><dt>Effectif</dt><dd>${n} / ${g.capacite} ${n >= num(g.capacite) ? '<span class="pill warn">complet</span>' : ''}</dd><dt>Dernière leçon</dt><dd>${done ? `Séance ${done} — ${esc(lecon(done)?.titre || '')}` : 'Pas encore commencé'}</dd></dl>
       <div class="bar" style="margin:10px 0 4px"><i style="width:${Math.round(done / 50 * 100)}%"></i></div><div class="small muted" style="margin-bottom:10px">${done}/50 séances · ${lastOpen(g.id)} débloquée(s)</div>
       ${g.mode === 'en ligne' ? `<label>Lien de connexion (Teams, Zoom, Meet…)</label><div style="display:flex;gap:6px;margin:4px 0 10px"><input type="url" id="lien-${g.id}" value="${esc(g.lien || '')}" placeholder="https://teams.microsoft.com/…"><button class="btn sm" data-act="saveLien" data-id="${g.id}">Enregistrer</button>${g.lien ? `<a class="btn sm" href="${esc(g.lien)}" target="_blank" rel="noopener">${ic('link')}</a>` : ''}</div>` : `<div class="small muted" style="margin-bottom:10px">📍 ${esc(g.salle || P().adresse)}</div>`}
       <div class="actions"><button class="btn sm primary" data-act="openGroupe" data-id="${g.id}">Détail & programme</button><button class="btn sm" data-act="goAppel" data-id="${g.id}">${ic('check')} Appel</button></div></div>`; }).join('') || `<div class="card">${empty('Aucun groupe', 'Ajoute un créneau (ex. Journée A, Soirée en ligne).')}</div>`}</div>`; }).join('') || `<div class="card">${empty('Aucune vague', 'Crée d’abord une vague.')}</div>`}`;

V.groupe = () => {

  let body = '';
  if (tab === 'prog') {

    body += '</div>';
  } else if (tab === 'eleves') body = studs.length ? `<table><thead><tr><th>Étudiant</th><th>Contact</th><th>Assiduité</th><th>Reste</th></tr></thead><tbody>${studs.map(e => `<tr class="click" data-act="viewStudent" data-id="${e.id}"><td><b>${esc(etuNom(e))}</b><div class="small muted">${esc(e.matricule)}</div></td><td class="small">${esc(e.tel)}<div class="muted">${esc(e.email || 'pas d’e-mail')}</div></td><td>${presStats(e.id).rate == null ? '—' : presStats(e.id).rate + ' %'}</td><td>${fmtMoney(solde(e))}</td></tr>`).join('')}</tbody></table>` : empty('Aucun étudiant');
  else { const se = D.seances.filter(s => s.groupe_id === g.id).sort((a, b) => b.date.localeCompare(a.date)); body = se.length ? `<table><thead><tr><th>Date</th><th>Leçon</th><th>Formateur</th><th>Présents</th><th>Durée</th></tr></thead><tbody>${se.map(s => `<tr><td>${fmtDate(s.date)}</td><td>Séance ${s.seance_no} — ${esc(lecon(s.seance_no)?.titre || '')}</td><td>${esc(by(D.formateurs, s.formateur_id)?.nom || '')}</td><td>${s.presents}</td><td>${s.duree} h</td></tr>`).join('')}</tbody></table>` : empty('Aucune séance enregistrée'); }
  return `${pageHead(esc(g.nom) + ' · ' + esc(v?.nom || ''), `${modeLabel(g.mode)} · ${esc(joursTxt(g))} ${esc(g.h_debut)}–${esc(g.h_fin)} · Formateur : ${esc(f?.nom || 'à définir')} · ${effectif(g)}/${g.capacite} élèves`, `<button class="btn" data-act="nav" data-id="groupes">← Groupes</button><button class="btn primary" data-act="goAppel" data-id="${g.id}">${ic('check')} Appel & séance</button>`)}

/* ===== Formateurs ===== */
V.formateurs = () => `${pageHead('Formateurs', 'Suivi en temps réel : groupes, séances données et heures.', can('struct') ? `<button class="btn primary" data-act="formateurForm">${ic('plus')} Nouveau formateur</button>` : '')}

S.mail = { segment: 'groupe', ref: '', tpl: 'bienvenue', subject: MAIL_TPL.bienvenue.subject, body: MAIL_TPL.bienvenue.body, free: '' };
function mailRecipients() {
  const m = S.mail; let list = [], without = 0;
  const addE = e => { if (emailOK(e.email)) list.push({ to: e.email, name: etuNom(e), e }); else without++; };
  if (m.segment === 'etudiant') { const e = by(D.etudiants, m.ref); if (e) addE(e); }
  else if (m.segment === 'groupe') D.etudiants.filter(e => e.groupe_id === m.ref && e.statut !== 'abandon').forEach(addE);
  else if (m.segment === 'vague') D.etudiants.filter(e => e.vague_id === m.ref && e.statut !== 'abandon').forEach(addE);
  else if (m.segment === 'echeance') D.etudiants.filter(e => ['retard', 'proche'].includes(echInfo(e).etat)).forEach(addE);
  else if (m.segment === 'tous') D.etudiants.filter(e => e.statut !== 'abandon').forEach(addE);
  else if (m.segment === 'formateurs') D.formateurs.forEach(f => emailOK(f.email) ? list.push({ to: f.email, name: f.nom, e: { nom: f.nom, prenoms: '' } }) : without++);
  else if (m.segment === 'libre') String(m.free).split(/[;, \n]+/).filter(emailOK).forEach(x => list.push({ to: x, name: x, e: null }));
  return { list, without };
}
function segLabel() {
  const m = S.mail;
  if (m.segment === 'groupe') { const g = by(D.groupes, m.ref); return g ? `${g.nom} · ${by(D.vagues, g.vague_id)?.nom || ''}` : ''; }
  if (m.segment === 'vague') return by(D.vagues, m.ref)?.nom || '';
  return '';
}
function mailSubject(m, vars) { const sub = mergeText(m.subject, vars), l = segLabel(); return (l && m.prefix !== false && ['groupe', 'vague'].includes(m.segment)) ? `[${l}] ${sub}` : sub; }
const echPill = e => { const i = echInfo(e); return i.etat === 'retard' ? ` <span class="pill bad">retard ${-i.jours} j</span>` : i.etat === 'proche' ? ` <span class="pill y">avant le ${fmtDate(i.date)}</span>` : i.etat === 'avenir' ? ` <span class="pill gray">${fmtDate(i.date)}</span>` : i.etat === 'sans' ? ' <span class="pill gray">sans date</span>' : ''; };
function mailPreview() {

}

    <div class="f"><label>Destinataires</label><select data-mail="segment">${[['groupe', 'Un groupe'], ['vague', 'Une vague entière'], ['etudiant', 'Un étudiant'], ['echeance', 'Paiements en retard / proches'], ['tous', 'Tous les étudiants actifs'], ['formateurs', 'Les formateurs'], ['libre', 'Adresses libres']].map(([k, l]) => `<option value="${k}" ${m.segment === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>

/* ===== Paiements & échéances ===== */
V.paiements = () => {
  const f = S.f.pay || 'retard';
  const rows = D.etudiants.map(e => ({ e, i: echInfo(e) })).filter(x => x.i.etat !== 'solde');
  const cnt = k => rows.filter(x => x.i.etat === k).length;
  const order = { retard: 0, proche: 1, avenir: 2, sans: 3 };
  const list = rows.filter(x => f === 'tous' || x.i.etat === f).sort((a, b) => (order[a.i.etat] - order[b.i.etat]) || String(a.e.echeance || '9').localeCompare(String(b.e.echeance || '9')));
  const totalDu = rows.reduce((s, x) => s + x.i.reste, 0), retardDu = rows.filter(x => x.i.etat === 'retard').reduce((s, x) => s + x.i.reste, 0);
  const tabs = [['retard', 'En retard', 'bad'], ['proche', `Sous ${num(P().alerte_jours) || 7} jours`, 'warn'], ['avenir', 'À venir', 'gray'], ['sans', 'Sans date', 'gray'], ['tous', 'Tous', 'gray']];
  return `${pageHead('Paiements & échéances', 'Suivi des paiements différés : qui doit quoi, et avant quand.', `<button class="btn" data-act="relanceAll">${ic('send')} Relancer par e-mail </button>`)}
  <div class="grid g3" style="margin-bottom:16px"><div class="kpi"><small>Total restant dû</small><b>${fmtMoney(totalDu)}</b><span>${rows.length} étudiant(s)</span></div><div class="kpi"><small>Dont en retard</small><b style="color:var(--red)">${fmtMoney(retardDu)}</b><span>${cnt('retard')} étudiant(s)</span></div><div class="kpi"><small>Échéances proches</small><b>${cnt('proche')}</b><span>à relancer cette semaine</span></div></div>
  <div class="card"><div class="tabs">${tabs.map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="filt" data-k="pay" data-v="${k}">${l} <span class="pill ${k === 'retard' && cnt(k) ? 'bad' : 'gray'}">${k === 'tous' ? rows.length : cnt(k)}</span></button>`).join('')}</div>
  ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Étudiant</th><th>Groupe</th><th>Reste dû</th><th>Date limite</th><th>État</th><th></th></tr></thead><tbody>${list.map(({ e, i }) => `<tr><td><b>${esc(etuNom(e))}</b><div class="small muted">${esc(e.tel)}${e.email ? ' · ' + esc(e.email) : ' · pas d’e-mail'}</div></td><td class="small">${esc(by(D.groupes, e.groupe_id)?.nom || '')}<div class="muted">${esc(by(D.vagues, e.vague_id)?.nom || '')}</div></td><td><b>${fmtMoney(i.reste)}</b></td><td>${i.date ? fmtDate(i.date) : '—'}</td><td>${i.etat === 'retard' ? `<span class="pill bad">en retard de ${-i.jours} j</span>` : i.etat === 'proche' ? `<span class="pill y">dans ${i.jours} j</span>` : i.etat === 'avenir' ? `<span class="pill gray">dans ${i.jours} j</span>` : '<span class="pill gray">sans date</span>'}</td><td class="right nowrap"><button class="btn sm" data-act="echForm" data-id="${e.id}">${ic('calendar')}</button> <button class="btn sm" data-act="payment" data-id="${e.id}">Encaisser</button> ${emailOK(e.email) ? `<button class="btn sm" data-act="relance1" data-id="${e.id}">${ic('send')} Relancer</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : empty('Rien dans cette catégorie', 'Aucun paiement en attente ici.')}</div>`;
};

/* ===== Historique des promotions ===== */
V.historique = () => {
  const vs = [...D.vagues].sort((a, b) => b.debut.localeCompare(a.debut));
  const sel = S.f.hist || (vs[0] || {}).id;
  const stat = v => {
    const es = D.etudiants.filter(e => e.vague_id === v.id), act = es.filter(e => e.statut !== 'abandon');
    const encaisse = D.recus.filter(r => r.vague_id === v.id && r.statut !== 'annule').reduce((s, r) => s + num(r.montant), 0);
    const pr = D.presences.filter(x => D.groupes.find(g => g.id === x.groupe_id)?.vague_id === v.id); const ok = pr.filter(x => ['present', 'retard'].includes(x.statut)).length;
    return { n: es.length, act: act.length, aband: es.length - act.length, enc: encaisse, du: act.reduce((s, e) => s + solde(e), 0), rate: pr.length ? Math.round(ok / pr.length * 100) : null, seances: D.seances.filter(x => D.groupes.find(g => g.id === x.groupe_id)?.vague_id === v.id).length };
  };
  const cmp = `<div class="tablewrap"><table><thead><tr><th>Promotion</th><th>Période</th><th>Statut</th><th>Inscrits</th><th>Abandons</th><th>Encaissé</th><th>Reste dû</th><th>Assiduité</th></tr></thead><tbody>${vs.map(v => { const s = stat(v); return `<tr class="click" data-act="filt" data-k="hist" data-v="${v.id}" style="${v.id === sel ? 'background:var(--sky-l)' : ''}"><td><b>${esc(v.nom)}</b></td><td class="small">${fmtDate(v.debut)} → ${fmtDate(v.fin)}</td><td><span class="pill ${statutPill(vagueStatut(v))}">${vagueStatut(v)}</span></td><td>${s.n}</td><td>${s.aband}</td><td>${fmtMoney(s.enc)}</td><td>${fmtMoney(s.du)}</td><td>${s.rate == null ? '—' : s.rate + ' %'}</td></tr>`; }).join('')}</tbody></table></div>`;
  const v = by(D.vagues, sel); let det = '';
  if (v) {
    const s = stat(v), gs = D.groupes.filter(g => g.vague_id === v.id);
    det = `<div class="card" style="margin-top:16px"><div class="card-head"><h2>${esc(v.nom)}</h2><div class="actions"><button class="btn sm" data-act="reportVague" data-id="${v.id}">${ic('print')} Rapport</button></div></div>
    <div class="grid g4" style="margin-bottom:14px"><div class="kpi"><small>Inscrits</small><b>${s.n}</b></div><div class="kpi"><small>Séances données</small><b>${s.seances}</b></div><div class="kpi"><small>Encaissé</small><b style="font-size:20px">${fmtMoney(s.enc)}</b></div><div class="kpi"><small>Assiduité</small><b>${s.rate == null ? '—' : s.rate + ' %'}</b></div></div>
    ${gs.map(g => { const es = D.etudiants.filter(e => e.groupe_id === g.id).sort((a, b) => etuNom(a).localeCompare(etuNom(b))); return `<h3 style="margin:14px 0 6px">${esc(g.nom)} <span class="pill">${modeLabel(g.mode)}</span> <span class="small muted">· ${esc(by(D.formateurs, g.formateur_id)?.nom || '—')} · ${es.length} élève(s)</span></h3>${es.length ? `<div class="tablewrap"><table><thead><tr><th>Étudiant</th><th>Statut</th><th>Assiduité</th><th>Dernière leçon</th><th>Paiement</th></tr></thead><tbody>${es.map(e => `<tr class="click" data-act="viewStudent" data-id="${e.id}"><td><b>${esc(etuNom(e))}</b> <span class="small muted">${esc(e.matricule)}</span></td><td><span class="pill ${statutPill(e.statut)}">${esc(e.statut)}</span></td><td>${presStats(e.id).rate == null ? '—' : presStats(e.id).rate + ' %'}</td><td>${lastTaught(g) ? 'Séance ' + lastTaught(g) : '—'}</td><td>${solde(e) > 0 ? `<span class="pill warn">reste ${fmtMoney(solde(e))}</span>` : '<span class="pill ok">soldé</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Aucun élève.</p>'}`; }).join('')}</div>`;
  }
  return `${pageHead('Historique des promotions', 'Compare les vagues passées et retrouve la liste complète de chaque promotion. Clique une ligne pour voir le détail.')}<div class="card">${cmp}</div>${det}`;
};

/* ---------- confirmation simple ---------- */

/* ---------- reçus : affichage / impression / envoi ---------- */
function showReceipt(r, o = {}) {
  const e = by(D.etudiants, r.etudiant_id);
  const note = e && e.email ? '' : `<div class="demo-banner" style="margin:0 0 10px">Pas d’adresse e-mail : le reçu est bien enregistré dans la base. Imprime-le et remets la version papier.</div>`;
  const ov = openModal(`${o.fresh ? `<h2>✅ Inscription enregistrée</h2><p class="muted">Reçu n° <b>${esc(r.numero)}</b> créé et sauvegardé dans la base.</p>` : ''}${note}
    <div style="overflow:auto;margin:10px -6px">${withLogo(receiptHTML(r))}</div>
    <div class="foot"><label class="small" style="align-self:center;margin-right:auto;font-weight:600"><input type="checkbox" id="twoCopies" style="width:auto"> 2 exemplaires (élève + institut)</label>
    ${e?.email && r.statut !== 'annule' ? `<button class="btn" id="rMail">${ic('send')} Envoyer par e-mail</button>` : ''}<button class="btn primary" id="rPrint">${ic('print')} Imprimer / PDF</button><button class="btn" data-act="closeModal">Fermer</button></div>`, { wide: true, nofocus: true });
  $('#rPrint', ov).onclick = () => { const two = $('#twoCopies', ov).checked; const one = `<div style="page-break-inside:avoid">${receiptHTML(r)}</div>`; printHTML(two ? one.replace('<div style="page-break-inside:avoid">', '<div style="page-break-inside:avoid;page-break-after:always">') + `<div style="margin:0">${receiptHTML(r)}</div>` : one); };
  const mb = $('#rMail', ov); if (mb) mb.onclick = wrap(async () => { mb.disabled = true; await sendReceiptMail(r); mb.disabled = false; });
  return ov;
}
async function sendReceiptMail(r) {
  const e = by(D.etudiants, r.etudiant_id), p = P(); if (!e || !emailOK(e.email)) throw new Error('Pas d’adresse e-mail valide pour cet étudiant.');
  const pr = (e.prenoms || e.nom).split(' ')[0];
  const body = `Bonjour ${pr},\n\nMerci pour votre confiance. Vous trouverez en pièce jointe votre reçu n° ${r.numero} d’un montant de ${fmtMoney(r.montant)}${num(r.reste) > 0 ? `, il reste ${fmtMoney(r.reste)} à régler` : ' (formation soldée)'}.\n\nCet envoi complète la version papier qui vous a été remise ; conservez les deux précieusement.\n\nÀ très bientôt chez ${p.nom} !`;
  await api('sendReceipt', { recu_id: r.id, to: e.email, subject: `Votre reçu n° ${r.numero} — ${p.nom}`, html: bodyToHTML(body), receipt_html: receiptDoc(r), logo: LOGO, numero: r.numero });
  await refresh(true); toast(DEMO ? 'Démo : e-mail simulé (rien n’est envoyé).' : `Reçu envoyé à ${e.email}`, 'ok');
}

const FORMS = {
  async register(form) {
    const f = formData(form); const g = by(D.groupes, f.groupe_id); if (!g) throw new Error('Choisis un groupe / créneau.');
    if (f.email && !emailOK(f.email)) throw new Error('Adresse e-mail invalide (ou laisse vide).');
    if (f.activite === 'autre' && !f.activite_detail) throw new Error('Précise l’activité de la personne.');
    let force = false; if (effectif(g) >= num(g.capacite)) { if (!await askConfirm('Groupe complet', `Ce groupe a déjà ${effectif(g)}/${g.capacite} étudiants. Inscrire quand même ?`, 'Inscrire quand même')) return; force = true; }
    const btn = $('#regBtn'); btn.disabled = true;
    try {
      const res = await api('register', { force, etudiant: { nom: f.nom, prenoms: f.prenoms, activite: f.activite, activite_detail: f.activite_detail, tel: f.tel, email: f.email, adresse: f.adresse, vague_id: f.vague_id, groupe_id: f.groupe_id, total_du: num(f.total_du), echeance: f.echeance || '' }, paiement: { montant: num(f.montant), mode: f.mode, reference: f.reference } });
      await refresh(true);
      const r = by(D.recus, res.recu.id) || res.recu;
      const ov = showReceipt(r, { fresh: true });
      if (f.auto_mail && f.email) { try { await sendReceiptMail(r); } catch (e) { toast('Reçu créé, mais e-mail non envoyé : ' + e.message, 'err'); } }
      new MutationObserver((_, ob) => { if (!document.body.contains(ov)) { ob.disconnect(); S.params = {}; render(); } }).observe($('#overlays'), { childList: true });
    } finally { btn.disabled = false; }
  },
  async editStudent(form) {
    const f = formData(form); const g = by(D.groupes, f.groupe_id); const rec = { ...f, vague_id: g.vague_id }; if (!can('price')) delete rec.total_du; else rec.total_du = num(f.total_du);
    await api('save', { table: 'etudiants', rec }); closeModal(); await refresh(); toast('Étudiant mis à jour', 'ok');
  },
  async payment(form) {
    const f = formData(form); const res = await api('addPayment', f); await refresh(true); closeModal(); showReceipt(by(D.recus, res.recu.id) || res.recu, { fresh: true }); render();
  },
  async ech(form) { const f = formData(form); await api('save', { table: 'etudiants', rec: { id: f.id, echeance: f.echeance } }); closeModal(); await refresh(); toast('Date limite enregistrée', 'ok'); },
  async vague(form) { const f = formData(form); if (!f.id) delete f.id; f.prix = num(f.prix); if (f.fin < f.debut) throw new Error('La fin doit être après le début.'); await api('save', { table: 'vagues', rec: f }); closeModal(); await refresh(); toast('Vague enregistrée', 'ok'); },
  async groupe(form) {
    const f = formData(form); const jours = $$('input[name=jour]:checked', form).map(x => x.value).join(','); if (!jours) throw new Error('Choisis au moins un jour.');
    const rec = { ...f, jours, capacite: num(f.capacite) }; delete rec.jour; if (!rec.id) { delete rec.id; rec.derniere_seance = 0; }
    await api('save', { table: 'groupes', rec }); closeModal(); await refresh(); toast('Groupe enregistré', 'ok');
  },
  async formateur(form) { const f = formData(form); if (!f.id) { delete f.id; f.actif = 1; } await api('save', { table: 'formateurs', rec: f }); closeModal(); await refresh(); toast('Formateur enregistré', 'ok'); },
  async lesson(form) { const f = formData(form); await api('save', { table: 'lecons', rec: f }); closeModal(); await refresh(); toast('Séance mise à jour', 'ok'); },
  async lib(form) {
    const f = formData(form), file = form.file.files[0]; const btn = $('#libBtn'); btn.disabled = true;
    try {
      if (!file && !f.url) throw new Error('Ajoute un fichier ou un lien.');
      if (file && file.size > 14 * 1024 * 1024) throw new Error('Fichier trop lourd (14 Mo max). Utilise un lien Drive.');
      let b64 = ''; if (file) b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
      if (file) await api('upload', { titre: f.titre, categorie: f.categorie, name: file.name, mime: file.type || 'application/octet-stream', b64, visible_formateurs: !!f.visible_formateurs, visible_eleves: !!f.visible_eleves });
      else await api('save', { table: 'bibliotheque', rec: { titre: f.titre, categorie: f.categorie, url: f.url, drive_id: '', visible_formateurs: f.visible_formateurs ? 1 : 0, visible_eleves: f.visible_eleves ? 1 : 0, date: today(), par: S.user.nom } });
      closeModal(); await refresh(); toast('Fichier ajouté', 'ok');
    } finally { btn.disabled = false; }
  },
  async user(form) {
    const f = formData(form); closeModal();
    secure(`Créer l’accès de ${f.nom} (${f.role === 'admin' ? 'administrateur' : 'gestion'})`, async code => { const r = await api('createUser', { ...f, code }); await refresh(); toast(DEMO ? 'Utilisateur créé (mot de passe démo : demo)' : 'Utilisateur créé, mot de passe provisoire envoyé par e-mail.', 'ok'); }, { cta: 'Créer l’accès' });
  },
  async params(form) { const f = formData(form); await api('saveParams', { params: f }); await refresh(); toast('Paramètres enregistrés', 'ok'); },
  async password(form) { const f = formData(form); await api('changePassword', f); form.reset(); toast('Mot de passe modifié', 'ok'); }
};

/* ---------- événements ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.tagName === 'A') return; const fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset, a); }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return; e.preventDefault();
  const fn = FORMS[form.dataset.form]; if (!fn) return;
  if (form.dataset.busy) return;                       // anti double-envoi : un seul enregistrement par formulaire
  form.dataset.busy = '1'; const btns = $$('button', form).filter(x => x.type !== 'button'); const old = btns.map(x => x.innerHTML);
  btns.forEach(x => { x.disabled = true; }); const main = btns[btns.length - 1]; if (main) main.innerHTML = 'Enregistrement…';
  try { await fn(form); } catch (err) { toast(err.message || String(err), 'err'); }
  finally { delete form.dataset.busy; if (document.body.contains(form)) btns.forEach((x, i) => { x.disabled = false; x.innerHTML = old[i]; }); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter) { S.f[t.dataset.filter] = t.value; if (t.dataset.filter === 'rq' || t.dataset.filter === 'rstatut') $('#recList').innerHTML = receiptTable(); else if (t.dataset.filter === 'vague' || t.dataset.filter === 'groupe' || t.dataset.filter === 'q' || t.dataset.filter === 'statut') { if (t.dataset.filter === 'vague') { S.f.groupe = ''; render(); } else $('#stuList').innerHTML = studentTable(); } }
  if (t.dataset.mail) { const k = t.dataset.mail; S.mail[k] = k === 'prefix' ? t.checked : t.value; if (k === 'tpl') { const tp = MAIL_TPL[t.value]; S.mail.subject = tp.subject; S.mail.body = tp.body; render(); } else if (k === 'segment') { S.mail.ref = ''; render(); } else if (k === 'ref') render(); else if (k === 'free') { /* recalcul à la sortie du champ */ } else { updateMailPreview(); } }
  if (t.dataset.att) { S.att[t.dataset.att] = t.dataset.att === 'seance_no' || t.dataset.att === 'duree' ? Number(t.value) : t.value; }
  if (t.dataset.change === 'inscCalc') inscCalc();
});
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset.attChk) S.att[t.dataset.attChk] = t.checked;
  if (t.dataset.mail === 'free') render();
  if (t.dataset.filter === 'vague' || t.dataset.filter === 'groupe' || t.dataset.filter === 'statut' || t.dataset.filter === 'rstatut') { /* déjà géré par input */ }
  const c = t.dataset.change; if (!c) return;
  if (c === 'actChange') { const lbl = $('#actDetailLbl'), inp = $('[name=activite_detail]'); if (t.value === 'autre') { lbl.innerHTML = 'Précise l’activité'; inp.required = true; inp.placeholder = 'Ex : lycéen, retraité, agriculteur…'; } else { lbl.innerHTML = 'Précision <span class="opt">(facultatif)</span>'; inp.required = false; inp.placeholder = 'Ex : étudiant en droit, commerçante…'; } }
  if (c === 'inscVague') { const v = by(D.vagues, t.value); $('#inscGroupe').innerHTML = inscGroupOptions(t.value); $('#inscTotal').value = num(v?.prix) || num(P().prix_defaut); inscCalc(); }

  if (c === 'attGroup') attInit(t.value, S.att.date), render();

  if (c === 'appsGroup') { S.tab.appsG = t.value; render(); }
});

:"","fr":"MG  Mipetraka an-trano aho.","mg":""},{"en":"I live downtown.","ph":"daoun-taoun","fr":"","mg":""},{"en":"FR  J'habite en centre-ville.","ph":"","fr":"MG  Mipetraka afovoan-tanàna aho.","mg":""},{"en":"I share a room with…","ph":"chèr e roum","fr":"","mg":""},{"en":"FR  Je partage une chambre avec…","ph":"","fr":"MG  Miara-mipetraka amin'…","mg":""},{"en":"I live alone.","ph":"aï liv e-lon","fr":"","mg":""},{"en":"FR  Je vis seul.","ph":"","fr":"MG  Mipetraka irery aho.","mg":""},{"en":"It's a quiet neighbourhood.","ph":"kwaï-et neï-ber-houd","fr":"","mg":""},{"en":"FR  C'est un quartier calme.","ph":"","fr":"MG  Faritra milamina io.","mg":""},{"en":"The rent is expensive.","ph":"the rent iz eks-pen-siv","fr":"","mg":""},{"en":"FR  Le loyer est cher.","ph":"","fr":"MG  Lafo ny hofan-trano.","mg":""},{"en":"landlord / tenant","ph":"land-lord / tè-nent","fr":"","mg":""},{"en":"FR  propriétaire / locataire","ph":"","fr":"MG  tompon-trano / mpanofa","mg":""}]}]},{"title":"ASKING FOR DIRECTIONS","expl":"To ask politely, start with 'Excuse me' then 'Could you tell me how to get to…?' The answer uses imperative verbs (go, turn, take) plus prepositions of place.","fr":"On commence toujours par 'Excuse me', puis la réponse utilise l'impératif.","mg":"Manomboka amin'ny 'Excuse me'; ny valiny dia amin'ny endrika baiko.","blocks":[{"t":"v","v":[{"en":"Excuse me, I'm lost.","ph":"eks-kiouz mi","fr":"Excusez-moi, je suis perdu.","mg":"Azafady, very aho."},{"en":"How do I get to the station?","ph":"haou dou aï guèt tou","fr":"Comment aller à la gare ?","mg":"Ahoana ny handeha any amin'ny gara?"},{"en":"Is it far from here?","ph":"iz it far from hir","fr":"C'est loin d'ici ?","mg":"Lavitra ve eto?"},{"en":"It's a five-minute walk.","ph":"faïv mi-nit wok","fr":"C'est à cinq minutes à pied.","mg":"Dimy minitra an-tongotra."},{"en":"Go straight ahead.","ph":"go streït e-hèd","fr":"Continue tout droit.","mg":"Mandehana mahitsy."},{"en":"Turn left / right.","ph":"tern lèft / raït","fr":"Tourne à gauche / à droite.","mg":"Mivilia ankavia / ankavanana."},{"en":"Take the second street.","ph":"teïk the sè-kend strit","fr":"Prends la deuxième rue.","mg":"Raiso ny arabe faharoa."},{"en":"Cross the road.","ph":"kross the rod","fr":"Traverse la route.","mg":"Miampita ny arabe."},{"en":"It's on your left.","ph":"its on yor lèft","fr":"C'est sur ta gauche.","mg":"Eo ankavianao."}]},{"t":"c","title":"Memory trick","text":"To remember the three prepositions: AT is a point, ON is a line or a surface, IN is a box. At the corner, on the street, in the building."}]},{"title":"PREPOSITIONS OF PLACE","expl":"These little words tell you exactly where something is. Learn them with a real object in front of you.","fr":"Ces mots situent précisément un objet dans l'espace.","mg":"Ireto teny ireto no milaza ny toerana marina.","blocks":[{"t":"v","v":[{"en":"in front of","ph":"in frant ov","fr":"devant","mg":"eo anoloan'ny"},{"en":"behind","ph":"bi-haïnd","fr":"derrière","mg":"eo ambadiky ny"},{"en":"next to / beside","ph":"nèkst tou / bi-saïd","fr":"à côté de","mg":"eo akaikin'ny"},{"en":"between","ph":"bi-twin","fr":"entre","mg":"eo anelanelan'ny"},{"en":"opposite","ph":"o-pe-zit","fr":"en face de","mg":"mifanatrika amin'ny"},{"en":"at the corner of","ph":"at the kor-ner ov","fr":"au coin de","mg":"eo an-joron'ny"},{"en":"around the corner","ph":"e-raound","fr":"juste après le coin","mg":"ao aoriana kely"}]}]}],"dialogue":[{"who":"A","text":"Excuse me, how do I get to the university?"},{"who":"B","text":"Go straight ahead, then turn left at the corner. It's opposite the bank."},{"who":"A","text":"Is it far from here?"},{"who":"B","text":"No, it's a five-minute walk."}],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Give directions from your house to the nearest market, using at least four expressions from this chapter.","items":["Complete: 'Turn ______ at the second street.'","Complete: 'The pharmacy is ______ the school (en face).'","Translate: « C'est à dix minutes à pied. »","Translate: « Le loyer est trop cher pour moi. »","Write your directions (4 sentences)."]}},{"seance":5,"chapitre":5,"title":"Time, Dates & Daily Routine","sub":"L'heure, la date, la routine • Ora, daty, fahazarana andavanandro","intro":[],"sections":[{"title":"TELLING THE TIME","expl":"There are two systems. The conversational one uses 'past' (after) and 'to' (before): 'twenty past three', 'a quarter to nine'. The digital one simply reads the numbers: 'three twenty', 'eight forty-five'.","fr":"Système parlé : past = plus, to = moins. Système digital : on lit les chiffres.","mg":"'past' = mihoatra; 'to' = latsaka. Na koa vakiana fotsiny ny isa.","blocks":[{"t":"v","v":[{"en":"What time is it?","ph":"wat taïm iz it","fr":"Quelle heure est-il ?","mg":"Amin'ny firy izao?"},{"en":"It's five past one.","ph":"faïv past wan","fr":"Il est une heure cinq.","mg":"Iray ora sy dimy minitra."},{"en":"It's a quarter past two.","ph":"e kwor-ter past","fr":"Il est deux heures et quart.","mg":"Roa sy fahefany."},{"en":"It's half past six.","ph":"haf past siks","fr":"Il est six heures et demie.","mg":"Enina sy sasany."},{"en":"It's a quarter to nine.","ph":"e kwor-ter tou","fr":"Il est neuf heures moins le quart.","mg":"Sivy latsaka fahefany."},{"en":"It's noon / midnight.","ph":"noun / mid-naït","fr":"Il est midi / minuit.","mg":"Mitatao vovonana / misasakalina."},{"en":"My watch is ten minutes fast.","ph":"fast / slo","fr":"Ma montre avance de dix minutes.","mg":"Mialoha folo minitra ny famataranandroko."},{"en":"I'm running late.","ph":"ra-ning leït","fr":"Je suis en retard.","mg":"Tara aho."}]}]},{"title":"DAYS, MONTHS AND DATES","expl":"British English says 'the 1st of September'; American English says 'September 1st'. Use ON + day, IN + month or year, AT + hour.","fr":"ON + jour, IN + mois/année, AT + heure.","mg":"ON + andro, IN + volana/taona, AT + ora.","blocks":[{"t":"v","v":[{"en":"What's today's date?","ph":"wats tou-deïz deït","fr":"Quelle est la date ?","mg":"Inona ny daty androany?"},{"en":"on Monday / on Friday","ph":"on man-deï","fr":"lundi / vendredi","mg":"alatsinainy / zoma"},{"en":"in June / in 2026","ph":"in djoun","fr":"en juin / en 2026","mg":"volana jona / tamin'ny 2026"},{"en":"at 7 o'clock","ph":"at sè-ven","fr":"à 7 heures","mg":"amin'ny 7 ora"},{"en":"the day before yesterday","ph":"the deï bi-for","fr":"avant-hier","mg":"afakomaly"},{"en":"the day after tomorrow","ph":"af-ter tou-mo-ro","fr":"après-demain","mg":"afaka ampitso"},{"en":"next week / last month","ph":"nèkst wik","fr":"la semaine prochaine / le mois dernier","mg":"herinandro ho avy / volana lasa"},{"en":"every other day","ph":"èv-ri a-ther deï","fr":"un jour sur deux","mg":"isaky ny indroa andro"}]},{"t":"c","title":"Watch out","text":"Never say 'I have 20 minutes late'. Say 'I'm twenty minutes late' or 'I'm running late'."}]},{"title":"YOUR DAILY ROUTINE","expl":"A routine is described in the present simple, with sequence words: first, then, after that, finally.","fr":"On décrit sa routine au présent simple avec des mots de séquence.","mg":"Ampiasaina ny 'present simple' sy ny teny mifandimby.","blocks":[{"t":"v","v":[{"en":"I wake up at six.","ph":"weïk ap","fr":"Je me réveille à six heures.","mg":"Mifoha amin'ny enina aho."},{"en":"I take a shower.","ph":"teïk e chaou-er","fr":"Je prends une douche.","mg":"Mandro aho."},{"en":"I brush my teeth.","ph":"brach maï tith","fr":"Je me brosse les dents.","mg":"Manasa nify aho."},{"en":"I get dressed.","ph":"guèt drèst","fr":"Je m'habille.","mg":"Miakanjo aho."},{"en":"I have breakfast.","ph":"hav brèk-fest","fr":"Je prends le petit déjeuner.","mg":"Misakafo maraina aho."},{"en":"I commute to work.","ph":"ke-mioutt","fr":"Je fais le trajet au travail.","mg":"Mandeha any am-piasana aho."},{"en":"I do the dishes.","ph":"dou the di-chiz","fr":"Je fais la vaisselle.","mg":"Manasa vilia aho."},{"en":"I go to bed late.","ph":"go tou bèd leït","fr":"Je me couche tard.","mg":"Mandeha matory tara aho."}]}]}],"dialogue":[{"who":"A","text":"What time do you usually wake up?"},{"who":"B","text":"At half past five. I take a shower, have breakfast, and I leave at a quarter to seven."},{"who":"A","text":"That's early! Why?"},{"who":"B","text":"Because of the traffic. If not, I'm running late."}],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Write the time in words.","items":["07:15 → ______________","12:30 → ______________","09:45 → ______________","Complete: 'I was born ______ 2004, ______ the 3rd of May.'","Describe your morning routine in five sentences."]}},{"seance":6,"chapitre":6,"title":"Health & Small Problems","sub":"La santé et les petits soucis • Fahasalamana sy olana madinika","intro":[],"sections":[{"title":"SAYING WHAT IS WRONG","expl":"Use 'I have a…' for a pain located in a body part (a headache, a sore throat), and 'I feel…' for a general state (dizzy, sick, weak).","fr":"'I have a…' pour une douleur localisée, 'I feel…' pour un état général.","mg":"'I have a…' raha misy faritra marary; 'I feel…' raha toe-batana ankapobeny.","blocks":[{"t":"v","v":[{"en":"What's wrong with you?","ph":"wats rong with you","fr":"Qu'est-ce qui ne va pas ?","mg":"Inona no manjo anao?"},{"en":"I have a headache.","ph":"hè-deïk","fr":"J'ai mal à la tête.","mg":"Marary loha aho."},{"en":"I have a sore throat.","ph":"sor throt","fr":"J'ai mal à la gorge.","mg":"Marary tenda aho."},{"en":"I have a stomach ache.","ph":"sta-mek eïk","fr":"J'ai mal au ventre.","mg":"Marary kibo aho."},{"en":"I have a fever / the flu.","ph":"fi-ver / the flou","fr":"J'ai de la fièvre / la grippe.","mg":"Manavy / mikohaka aho."},{"en":"I sprained my ankle.","ph":"spreïnd maï an-kel","fr":"Je me suis foulé la cheville.","mg":"Nikitoantoana ny kitrokoko."},{"en":"I feel dizzy.","ph":"aï fil di-zi","fr":"J'ai le vertige.","mg":"Manerinerina aho."},{"en":"I'm allergic to…","ph":"e-ler-djik tou","fr":"Je suis allergique à…","mg":"Tsy mahazaka … aho."}]}]},{"title":"AT THE CHEMIST'S","expl":"'Chemist's' (UK) and 'drugstore' (US) both mean pharmacy. A doctor writes a prescription; the pharmacist gives you the medicine.","fr":"'Chemist's' (GB) et 'drugstore' (US) = pharmacie.","mg":"'Chemist's' na 'drugstore' = fivarotam-panafody.","blocks":[{"t":"v","v":[{"en":"a prescription","ph":"pris-krip-chen","fr":"une ordonnance","mg":"ordonnance"},{"en":"a tablet / a pill","ph":"ta-blet / pil","fr":"un comprimé","mg":"fanafody"},{"en":"cough syrup","ph":"kof si-rep","fr":"du sirop","mg":"siropy kohaka"},{"en":"a bandage","ph":"ban-didj","fr":"un bandage","mg":"bandy"},{"en":"a painkiller","ph":"peïn-ki-ler","fr":"un antidouleur","mg":"fanafody manala fanaintainana"},{"en":"Take it twice a day.","ph":"twaïss e deï","fr":"À prendre deux fois par jour.","mg":"Indroa isan'andro."},{"en":"You should see a doctor.","ph":"choud si e dok-ter","fr":"Tu devrais voir un médecin.","mg":"Tokony hijery dokotera ianao."},{"en":"Get well soon!","ph":"guèt wèl soun","fr":"Bon rétablissement !","mg":"Mahazoa fahasalamana!"}]},{"t":"c","title":"Watch out","text":"The word 'sensible' in English means 'raisonnable', not 'sensitive'. If you are easily hurt, you are 'sensitive'."}]}],"dialogue":[{"who":"A","text":"You don't look well. What's wrong?"},{"who":"B","text":"I have a fever and a sore throat."},{"who":"A","text":"How long have you been in this condition?"},{"who":"B","text":"Since Monday. I think I should see a doctor."}],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Match the problem with the advice.","items":["I have a headache. → a) Take some cough syrup.","I sprained my ankle. → b) Take a painkiller.","I have a bad cough. → c) Rest and don't walk.","Translate: « Je suis allergique aux crevettes. »","Write a short dialogue at the chemist's (4 lines)."]}},{"seance":7,"chapitre":7,"title":"Understanding, Agreeing & Disagreeing","sub":"Comprendre, être d'accord ou non • Mahazo, manaiky na tsia","intro":[],"sections":[{"title":"WHEN YOU UNDERSTAND — OR NOT","expl":"Never stay silent when you do not understand. English gives you polite formulas to ask for a repetition without losing face.","fr":"Ne reste jamais silencieux : demande poliment qu'on répète.","mg":"Aza mangina raha tsy mazava: mangataha famerenana.","blocks":[{"t":"v","v":[{"en":"I see. / I got it.","ph":"aï si / aï gat it","fr":"Je vois. / J'ai compris.","mg":"Azoko."},{"en":"I know what you mean.","ph":"aï no wat you min","fr":"Je vois ce que tu veux dire.","mg":"Fantatro izay tianao holazaina."},{"en":"Sorry, I don't follow.","ph":"aï dont fo-lo","fr":"Désolé, je ne suis pas.","mg":"Miala tsiny, tsy mahatanteraka aho."},{"en":"Sorry, I didn't catch that.","ph":"aï did-ent katch that","fr":"Désolé, je n'ai pas saisi.","mg":"Miala tsiny, tsy tratro izany."},{"en":"I'm not sure I follow you.","ph":"aïm not chour aï fo-lo you","fr":"Je ne suis pas sûr de te suivre.","mg":"Tsy azoko tsara ny teninao."},{"en":"Could you say that again?","ph":"seï that e-guèn","fr":"Peux-tu répéter ?","mg":"Azafady, averinao?"},{"en":"Could you put it another way?","ph":"pout it e-na-ther weï","fr":"Peux-tu le dire autrement ?","mg":"Azonao lazaina amin'ny fomba hafa ve?"},{"en":"Could you speak more slowly?","ph":"mor slo-li","fr":"Peux-tu parler plus lentement ?","mg":"Azafady, miteny miadana?"},{"en":"What does it mean?","ph":"wat daz it min","fr":"Qu'est-ce que ça veut dire ?","mg":"Inona no dikan'izany?"},{"en":"How do you spell it?","ph":"haou dou you spèl it","fr":"Comment ça s'écrit ?","mg":"Ahoana no anoratana azy?"}]}]},{"title":"AGREEING AND DISAGREEING","expl":"Agreement goes from soft ('I suppose so') to strong ('Absolutely'). Disagreement should stay polite in a debate: 'I see your point, but…' is far better than 'You're wrong.'","fr":"En débat, 'I see your point, but…' vaut mieux que 'You're wrong.'","mg":"Amin'ny adihevitra: 'I see your point, but…' no mety kokoa.","blocks":[{"t":"v","v":[{"en":"I totally agree.","ph":"to-te-li e-gri","fr":"Je suis tout à fait d'accord.","mg":"Manaiky tanteraka aho."},{"en":"Absolutely! / Definitely!","ph":"ab-so-lout-li / dè-fi-nit-li","fr":"Absolument ! / Tout à fait !","mg":"Tena izany!"},{"en":"That's true. / Exactly!","ph":"thats trou / eg-zakt-li","fr":"C'est vrai. / Exactement !","mg":"Marina izany."},{"en":"You're absolutely right.","ph":"yor ab-so-lout-li raït","fr":"Tu as tout à fait raison.","mg":"Marina tanteraka ianao."},{"en":"I suppose so.","ph":"aï se-poz so","fr":"Je suppose que oui.","mg":"Angamba."},{"en":"I'm not so sure.","ph":"aïm not so chour","fr":"Je n'en suis pas si sûr.","mg":"Tsy dia azoko antoka."},{"en":"I see your point, but…","ph":"aï si yor poïnt","fr":"Je comprends, mais…","mg":"Azoko ny hevitrao, saingy…"},{"en":"I'm afraid I don't agree.","ph":"aïm e-freïd aï dont e-gri","fr":"Je crains de ne pas être d'accord.","mg":"Miala tsiny fa tsy miombon-kevitra aho."},{"en":"I completely disagree.","ph":"dis-e-gri","fr":"Je ne suis pas du tout d'accord.","mg":"Tsy manaiky mihitsy aho."},{"en":"That's out of the question.","ph":"aout ov the kwès-tchen","fr":"C'est hors de question.","mg":"Tsy misy resaka."},{"en":"It depends.","ph":"it di-pends","fr":"Ça dépend.","mg":"Miankina."}]},{"t":"c","title":"Speaking strategy","text":"Never answer a debate question with a bare 'yes' or 'no'. Even 'It depends' followed by one reason is worth ten times more, and it buys you three seconds to think."}]}],"dialogue":[{"who":"A","text":"Social media is a waste of time. Don't you agree?"},{"who":"B","text":"I see your point, but I'm not so sure. It depends how you use it."},{"who":"A","text":"Sorry, I don't follow. Could you say that again?"},{"who":"B","text":"Of course. I mean it can be a tool, not only entertainment."}],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Classify: agreement (A), disagreement (D), or asking for repetition (R).","items":["'Exactly!' → ____   2. 'I'm not so sure.' → ____","'Could you speak more slowly?' → ____","'That's out of the question.' → ____","Answer with a polite disagreement: 'Money is the only thing that matters.'"]}},{"seance":8,"chapitre":8,"title":"Hospitality, Meals, Travel Wishes & Weather","sub":"Accueillir, manger, souhaiter bon voyage, parler du temps • Mandray vahiny, misakafo, faniriana, toetrandro","intro":[],"sections":[{"title":"WELCOMING SOMEONE","expl":"When you receive somebody, English uses short imperative sentences with 'please'. They sound warm, not rude.","fr":"À l'impératif avec 'please', ces phrases sont chaleureuses, pas brusques.","mg":"Amin'ny endrika baiko miaraka amin'ny 'please': tsy henjana izany.","blocks":[{"t":"v","v":[{"en":"Come in, please.","ph":"kam in pliz","fr":"Entrez, je vous en prie.","mg":"Mandrosoa azafady."},{"en":"Have a seat.","ph":"hav e sit","fr":"Asseyez-vous.","mg":"Mipetraha."},{"en":"Make yourself at home.","ph":"meïk yor-sèlf at hom","fr":"Faites comme chez vous.","mg":"Aza mihafahafa."},{"en":"Would you like something to drink?","ph":"woud you laïk","fr":"Voulez-vous boire quelque chose ?","mg":"Te-hisotro ve ianao?"},{"en":"Help yourself!","ph":"hèlp yor-sèlf","fr":"Servez-vous !","mg":"Manasà!"},{"en":"Enjoy your meal!","ph":"in-djoï yor mil","fr":"Bon appétit !","mg":"Mazotoa homana!"},{"en":"Thanks for having me.","ph":"for ha-ving mi","fr":"Merci de m'avoir reçu.","mg":"Misaotra nandray ahy."}]}]},{"title":"TRAVEL WISHES","expl":"Each situation has its own fixed wish. Learn them as blocks, do not translate word for word.","fr":"Ce sont des formules figées : apprends-les en bloc.","mg":"Fomba fiteny mifatotra: tadidio manontolo.","blocks":[{"t":"v","v":[{"en":"Have a safe trip!","ph":"seïf trip","fr":"","mg":""},{"en":"FR  Bon voyage !","ph":"","fr":"MG  Soava dia!","mg":""},{"en":"Have a nice flight!","ph":"naïs flaït","fr":"","mg":""},{"en":"FR  Bon vol !","ph":"","fr":"MG  Soava dia an'habakabaka!","mg":""},{"en":"Drive safely!","ph":"draïv seïf-li","fr":"","mg":""},{"en":"FR  Conduis prudemment !","ph":"","fr":"MG  Mitandrema eny an-dalana!","mg":""},{"en":"Text me when you arrive.","ph":"tèkst mi wèn","fr":"","mg":""},{"en":"FR  Envoie-moi un message en arrivant.","ph":"","fr":"MG  Mandefasa hafatra rehefa tonga.","mg":""},{"en":"Enjoy your holiday!","ph":"ho-li-deï","fr":"","mg":""},{"en":"FR  Bonnes vacances !","ph":"","fr":"MG  Mifalia amin'ny fialan-tsasatra!","mg":""}]}]},{"title":"THE WEATHER","expl":"The question is always 'What's the weather like?' — never 'How is the weather?' in natural speech. The answer uses 'It's' + adjective or 'It's' + verb-ing.","fr":"Question standard : 'What's the weather like?' Réponse : 'It's' + adjectif ou verbe-ing.","mg":"Fanontaniana: 'What's the weather like?' Valiny: 'It's' + mpamaritra na verbe-ing.","blocks":[{"t":"v","v":[{"en":"What's the weather like?","ph":"wats the wè-ther laïk","fr":"Quel temps fait-il ?","mg":"Manao ahoana ny andro?"},{"en":"It's sunny / cloudy.","ph":"sa-ni / klaou-di","fr":"Il fait soleil / nuageux.","mg":"Mibaliaka / mandrahona."},{"en":"It's raining / drizzling.","ph":"reï-ning / driz-ling","fr":"Il pleut / il bruine.","mg":"Manorana / mierikerika."},{"en":"It's windy / foggy.","ph":"win-di / fo-gui","fr":"Il y a du vent / du brouillard.","mg":"Mandrivotra / misy zavona."},{"en":"It's freezing / boiling hot.","ph":"fri-zing / boï-ling","fr":"Il gèle / il fait très chaud.","mg":"Mangatsiaka be / mafana be."},{"en":"It's thundering.","ph":"than-de-ring","fr":"Il tonne.","mg":"Mikotroka."},{"en":"in summer / in winter","ph":"sa-mer / win-ter","fr":"en été / en hiver","mg":"fahavaratra / ririnina"}]}]}],"dialogue":[{"who":"A","text":"Come in, please. Make yourself at home."},{"who":"B","text":"Thank you. It's freezing outside!"},{"who":"A","text":"I know, it's been raining all day. Would you like something to drink?"},{"who":"B","text":"Yes please. And thanks for having me."}],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"What do you say?","items":["Your friend is taking a plane tonight. → ______________","A guest arrives at your door. → ______________","Everybody sits down to eat. → ______________","Describe today's weather in three sentences.","Translate: « Il pleut et il y a du vent. »"]}},{"seance":9,"chapitre":15,"title":"Articles & Demonstratives","sub":"Les articles et les démonstratifs • Ny mpanoro sy mpanondro","intro":[],"sections":[{"title":"A / AN / THE","expl":"'A' and 'an' introduce ONE thing, not yet known by the listener. Use 'a' before a consonant SOUND (a cat, a university) and 'an' before a vowel SOUND (an apple, an hour). 'The' points to a thing both speakers already know. We say nothing (zero article) before plurals and uncountable nouns used in general: 'I like music.'","fr":"'a/an' = une chose non encore connue ; 'the' = une chose connue des deux. Attention : c'est le SON qui compte, pas la lettre (a university, an hour).","mg":"'a/an' = zavatra iray tsy mbola fantatra; 'the' = efa fantatra. Ny FEO no jerena fa tsy ny litera.","blocks":[{"t":"p","text":"■  a      consonant sound      →  a book, a euro, a university"},{"t":"p","text":"■  an      vowel sound      →  an egg, an hour, an honest man"},{"t":"p","text":"■  the      known / unique thing      →  the sun, the book I bought"},{"t":"p","text":"■  Ø (nothing)      general plural / uncountable      →  I love coffee. Dogs are loyal."}]},{"title":"THIS / THAT / THESE / THOSE","expl":"THIS and THESE point to what is near you; THAT and THOSE to what is far. THIS/THAT are singular, THESE/THOSE plural.","fr":"This/These = près ; That/Those = loin.","mg":"This/These = akaiky; That/Those = lavitra.","blocks":[{"t":"v","v":[{"en":"This phone is mine.","ph":"this fon","fr":"Ce téléphone est à moi.","mg":"Ahy ity finday ity."},{"en":"These shoes are new.","ph":"thiz chouz","fr":"Ces chaussures sont neuves.","mg":"Vaovao ireto kiraro ireto."},{"en":"That building over there.","ph":"that bil-ding","fr":"Ce bâtiment là-bas.","mg":"Iny trano iny."},{"en":"Those people are waiting.","ph":"thoz pi-pel","fr":"Ces gens attendent.","mg":"Miandry ireny olona ireny."},{"en":"What's this? / What's that?","ph":"wats this","fr":"Qu'est-ce que c'est ?","mg":"Inona ity / iny?"}]},{"t":"c","title":"Memory trick","text":"The choice between A and AN depends on the SOUND, never on the letter. A university (you hear 'you'), an hour (the h is silent)."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Complete with a, an, the or Ø.","items":["She is ______ engineer in ______ company I told you about.","I don't drink ______ coffee, but I'd like ______ tea, please.","It took me ______ hour to finish ______ exercise.","______ shoes over there are cheaper than ______ ones here.","Write two sentences with 'this' and two with 'those'."]}},{"seance":10,"chapitre":16,"title":"Pronouns & Possessives","sub":"Les pronoms et les possessifs • Ny solo-anarana sy ny fananana","intro":[],"sections":[{"title":"THE FOUR COLUMNS","expl":"English has four parallel sets. The subject does the action (I speak). The object receives it (he calls ME). The possessive adjective comes BEFORE a noun (my book). The possessive pronoun stands ALONE (that book is mine).","fr":"Adjectif possessif + nom (my book) ; pronom possessif seul (it's mine).","mg":"Ny 'possessive adjective' dia arahin'anarana; ny 'possessive pronoun' dia mitokana.","blocks":[{"t":"p","text":"■  I / me      my      →  mine"},{"t":"p","text":"■  you / you      your      →  yours"},{"t":"p","text":"■  he / him      his      →  his"},{"t":"p","text":"■  she / her      her      →  hers"},{"t":"p","text":"■  it / it      its      →  —"},{"t":"p","text":"■  we / us      our      →  ours"},{"t":"p","text":"■  they / them      their      →  theirs"}]},{"title":"REFLEXIVE PRONOUNS","expl":"When the subje
