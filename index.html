atra fiakarana","mg":""},{"en":"the departure gate","ph":"di-par-tcher gueït","fr":"","mg":""},{"en":"FR  la porte d'embarquement","ph":"","fr":"MG  vavahady fiaingana","mg":""},{"en":"The flight is delayed.","ph":"di-leïd","fr":"","mg":""},{"en":"FR  Le vol est retardé.","ph":"","fr":"MG  Nihemotra ny sidina.","mg":""},{"en":"The flight was cancelled.","ph":"kan-seld","fr":"","mg":""},{"en":"FR  Le vol est annulé.","ph":"","fr":"MG  Nofoanana ny sidina.","mg":""},{"en":"to go through customs","ph":"kas-temz","fr":"","mg":""},{"en":"FR  passer la douane","ph":"","fr":"MG  mandalo fadintseranana","mg":""},{"en":"to pick up my luggage","ph":"pik ap","fr":"","mg":""},{"en":"FR  récupérer mes bagages","ph":"","fr":"MG  maka ny entako","mg":""},{"en":"Enjoy your stay!","ph":"in-djoï yor steï","fr":"","mg":""},{"en":"FR  Bon séjour !","ph":"","fr":"MG  Mankafiza ny fitoeranao!","mg":""}]}]}],"dialogue":[{"who":"A","text":"Good morning. I'd like to check in, please."},{"who":"B","text":"Your passport and booking confirmation? … Here is your boarding pass. Gate 12."},{"who":"A","text":"Is the flight on time?"},{"who":"B","text":"It's delayed by thirty minutes. Enjoy your stay!"}],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Put the airport steps in order: go through customs • check in • pick up your luggage • board the plane","items":["______  2. ______  3. ______  4. ______","Translate: « Mon vol a été annulé, je dois réserver un autre billet. »"]}},{"seance":36,"chapitre":36,"title":"Expressing an Opinion","sub":"Exprimer son opinion • Maneho hevitra","intro":["From this chapter on, you stop collecting words and start defending ideas. Everything you have learned so far becomes material."],"sections":[{"title":"OPENING YOUR OPINION","expl":"Never start an opinion with a bare 'I think' every time. English gives you a whole ladder, from the most personal ('as for me') to the most argued ('from my point of view'). Vary them and your speech immediately sounds mature.","fr":"Varie les introductions : c'est ce qui rend un discours mature.","mg":"Ovay ny fomba fanombohana hevitra: izany no mahatonga ny resaka ho matotra.","blocks":[{"t":"v","v":[{"en":"I think that…","ph":"aï think that","fr":"Je pense que…","mg":"Mihevitra aho fa…"},{"en":"In my opinion,","ph":"in maï o-pi-nien","fr":"À mon avis,","mg":"Araka ny hevitro,"},{"en":"From my point of view,","ph":"poïnt ov viou","fr":"De mon point de vue,","mg":"Araka ny fijeriko,"},{"en":"As far as I'm concerned,","ph":"az far az","fr":"En ce qui me concerne,","mg":"Raha ny amiko,"},{"en":"I reckon that…","ph":"aï rè-ken","fr":"J'estime que…","mg":"Heveriko fa…"},{"en":"It seems to me that…","ph":"it simz tou mi","fr":"Il me semble que…","mg":"Toa amiko fa…"},{"en":"I'd say that…","ph":"aïd seï","fr":"Je dirais que…","mg":"Hilaza aho fa…"},{"en":"To be honest,","ph":"tou bi o-nist","fr":"Pour être honnête,","mg":"Raha ny marina,"}]}]},{"title":"THE STRUCTURE OF A GOOD ANSWER","expl":"A strong spoken answer has four steps: 1) thank and reformulate the question, 2) give your position, 3) give two arguments with an example, 4) conclude and open. This is exactly the plan used in every debate chapter of this part.","fr":"Quatre étapes : reformuler, position, deux arguments + exemple, conclusion.","mg":"Dingana efatra: mamerina ny fanontaniana, mametraka hevitra, manome porofo, mamarana.","blocks":[{"t":"v","v":[{"en":"Thanks for your question.","ph":"thanks for yor","fr":"Merci pour votre question.","mg":"Misaotra amin'ny fanontaniana."},{"en":"To begin with,","ph":"tou bi-guin with","fr":"Pour commencer,","mg":"Ho fanombohana,"},{"en":"On the one hand… on the other hand…","ph":"on the wan hand","fr":"D'une part… d'autre part…","mg":"Etsy an-daniny… etsy ankilany…"},{"en":"For instance / for example","ph":"for inss-tenss","fr":"Par exemple","mg":"Ohatra"},{"en":"That's to say,","ph":"thats tou seï","fr":"C'est-à-dire,","mg":"Izany hoe,"},{"en":"All in all, / To sum up,","ph":"ol in ol","fr":"Tout compte fait, / En résumé,","mg":"Raha fintinina,"},{"en":"That's all I can say.","ph":"thats ol","fr":"C'est tout ce que je peux dire.","mg":"Izay no azoko lazaina."}]},{"t":"p","text":"Q  What do you think about learning English online?"},{"t":"p","text":"A  Thanks for your question. In my opinion, it's a real opportunity. On the one hand, it's cheaper and flexible. On the other hand, you need discipline, because nobody checks on you. For instance, I follow a course every evening at eight. All in all, I'd say it works if you keep going."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Answer using the four-step structure (8–10 sentences).","items":["What do you think about English being an international language?","Rewrite 'I think it's good' in three more advanced ways.","Give two arguments FOR and two AGAINST online courses."]}},{"seance":37,"chapitre":37,"title":"Debate — Money, Hustle & Entrepreneurship","sub":"Débat : l'argent, l'initiative, l'entrepreneuriat • Adihevitra: vola sy fandraharahana","intro":["Nobody will hand you a career in a language you cannot argue in. This chapter, and the seven that follow, are built to make you speak for two minutes without stopping."],"sections":[{"title":"KEY VOCABULARY","expl":"This is the vocabulary of the question: 'Should young people start a business instead of looking for a job?' Learn the words first, then build the answer.","fr":"Vocabulaire de la question : « Les jeunes doivent-ils entreprendre plutôt que chercher un emploi ? »","mg":"Voambolana ho an'ny fanontaniana momba ny fandraharahana.","blocks":[{"t":"v","v":[{"en":"an entrepreneur","ph":"on-tre-pre-neur","fr":"un entrepreneur","mg":"mpandraharaha"},{"en":"a start-up","ph":"start-ap","fr":"une jeune entreprise","mg":"orinasa vao mijoro"},{"en":"start-up capital","ph":"ka-pi-tel","fr":"capital de départ","mg":"renivola fanombohana"},{"en":"to take a risk","ph":"teïk e risk","fr":"prendre un risque","mg":"mandray risika"},{"en":"unemployment rate","ph":"an-em-ploï-ment reït","fr":"taux de chômage","mg":"tahan'ny tsy fananana asa"},{"en":"the cost of living","ph":"kost ov li-ving","fr":"le coût de la vie","mg":"ny vidim-piainana"},{"en":"purchasing power","ph":"per-tche-sing paou-er","fr":"le pouvoir d'achat","mg":"fahefana mividy"},{"en":"to make a living","ph":"meïk e li-ving","fr":"gagner sa vie","mg":"mivelona"},{"en":"to struggle","ph":"tou stra-guel","fr":"galérer","mg":"misedra fahasahiranana"},{"en":"to succeed / to fail","ph":"sek-sid / feïl","fr":"réussir / échouer","mg":"mahomby / tsy tafita"},{"en":"hard work pays off","ph":"peïz of","fr":"le travail finit par payer","mg":"mamokatra ny asa mafy"},{"en":"to scale a business","ph":"skeïl","fr":"faire grandir une affaire","mg":"mampitombo ny orinasa"}]}]},{"title":"MODEL ANSWER","expl":"Read this answer aloud three times, then replace the examples with your own. The structure is what you keep; the content is what you change.","fr":"Lis à voix haute puis remplace les exemples par les tiens.","mg":"Vakio mafy, avy eo soloy ny ohatra manokana anao.","blocks":[{"t":"p","text":"Should young people start their own business?"},{"t":"p","text":"Thanks for your question. To begin with, I'd say that entrepreneurship is not a fashion — it is often a necessity. In my country, the unemployment rate is high and the cost of living keeps rising, so waiting for a perfect job can take years."},{"t":"p","text":"On the one hand, starting a side hustle teaches you skills no classroom gives you: you learn to talk to customers, to manage a small budget and to recover from a loss. For instance, a student who sells clothes online learns marketing, logistics and negotiation at the same time."},{"t":"p","text":"On the other hand, I don't think everybody should quit their studies to become an entrepreneur. You need start-up capital, patience, and the courage to fail more than once. Many young people give up after the first bad month."},{"t":"p","text":"All in all, as far as I'm concerned, the best path is to keep learning while testing a small project on the side. Hard work pays off, but only if it is combined with knowledge and a bit of luck."},{"t":"c","title":"Speaking strategy","text":"In a debate, admit one point of your opponent before answering. 'That's true, however…' makes you sound confident; refusing everything makes you sound afraid."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Prepare your own two-minute answer.","items":["Give three advantages of having a side hustle while studying.","Give two risks, using 'On the other hand'.","Translate: « Le coût de la vie augmente, donc le pouvoir d'achat baisse. »","Write your answer (10 sentences) and read it aloud three times."]}},{"seance":38,"chapitre":38,"title":"Debate — Education: Is a Degree Still Worth It?","sub":"Débat : le diplôme a-t-il encore de la valeur ? • Adihevitra: mbola manan-danja ve ny mari-pahaizana?","intro":[],"sections":[{"title":"KEY VOCABULARY","expl":"'Education' is not only school. It includes what you learn from your mistakes, from others, and from experience. Keep that idea in mind: it is the strongest argument in this debate.","fr":"L'éducation ne se limite pas à l'école : c'est l'argument le plus fort du débat.","mg":"Tsy voafetra amin'ny sekoly ny fanabeazana: izany no porofo matanjaka indrindra.","blocks":[{"t":"v","v":[{"en":"knowledge / skills","ph":"no-lidj / skilz","fr":"connaissances / compétences","mg":"fahalalana / fahaiza-manao"},{"en":"a soft skill","ph":"soft skil","fr":"une compétence humaine","mg":"fahaiza-mifandray"},{"en":"self-taught","ph":"sèlf-tot","fr":"autodidacte","mg":"nianatra samirery"},{"en":"to unlock your potential","ph":"an-lok yor po-ten-chel","fr":"révéler son potentiel","mg":"mamoha ny fahaizana"},{"en":"to drop out of school","ph":"drop aout","fr":"abandonner l'école","mg":"mijanona tsy mianatra"},{"en":"a certificate","ph":"ser-ti-fi-kit","fr":"un certificat","mg":"fanamarinana"},{"en":"experience matters","ph":"eks-pi-riens ma-terz","fr":"l'expérience compte","mg":"zava-dehibe ny traikefa"},{"en":"a well-paid job","ph":"wèl-peïd djob","fr":"un emploi bien payé","mg":"asa mahazo karama tsara"},{"en":"to be overqualified","ph":"o-ver-kwo-li-faïd","fr":"être surdiplômé","mg":"be diplaoma loatra"},{"en":"lifelong learning","ph":"laïf-long ler-ning","fr":"apprendre toute sa vie","mg":"fianarana mandavan-taona"},{"en":"to learn from mistakes","ph":"ler n from mis-teïks","fr":"apprendre de ses erreurs","mg":"mianatra amin'ny fahadisoana"}]}]},{"title":"MODEL ANSWER","expl":"Notice how the speaker refuses the simple 'yes or no' and answers 'it depends', which is almost always the most intelligent position in a debate.","fr":"Le locuteur refuse le oui/non simple : 'it depends' est souvent la position la plus fine.","mg":"Tsy mamaly eny na tsia fotsiny: 'it depends' no matetika tsara indrindra.","blocks":[{"t":"p","text":"Is a university degree still worth it today?"},{"t":"p","text":"Thanks for the question. To be honest, my answer is: it depends on what you want to do with it."},{"t":"p","text":"From my point of view, a degree is still a door-opener. It proves that you can work on a long project, respect deadlines and think in a structured way. In many companies, without a diploma your CV is never even read."},{"t":"p","text":"However, a diploma alone is no longer enough. Today employers look at skills: languages, digital tools, public speaking, the ability to work in a team. You may know somebody who is self-taught and earns more than a graduate — that happens, and it proves that education does not stop at the school gate."},{"t":"p","text":"To sum up, I'd say the degree and the skills are not enemies. The best combination is a solid diploma plus real experience, and above all lifelong learning, because the person who stops learning stops progressing."}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Debate preparation.","items":["List four skills you cannot learn at university.","Give two arguments for the diploma, two against.","Translate: « Il est autodidacte mais il a réussi. »","Prepare and record a two-minute answer."]}},{"seance":39,"chapitre":39,"title":"Debate — Social Media & Mental Health","sub":"Débat : réseaux sociaux et santé mentale • Adihevitra: tambajotra sosialy sy ny saina","intro":[],"sections":[{"title":"KEY VOCABULARY","expl":"This debate needs precise words: 'addiction' is not 'habit', and 'to compare yourself' is the verb at the heart of the problem.","fr":"'Addiction' n'est pas 'habitude' ; 'to compare yourself' est le verbe clé.","mg":"Tsy mitovy ny 'addiction' sy ny 'habit'.","blocks":[{"t":"v","v":[{"en":"to be addicted to","ph":"e-dik-tid tou","fr":"être accro à","mg":"zatra loatra amin'ny"},{"en":"screen time","ph":"skrin taïm","fr":"temps d'écran","mg":"fotoana eo amin'ny efijery"},{"en":"to compare yourself to others","ph":"kom-pèr yor-sèlf","fr":"se comparer aux autres","mg":"mampitaha ny tena amin'ny hafa"},{"en":"self-esteem","ph":"sèlf ess-tim","fr":"estime de soi","mg":"fanajan-tena"},{"en":"peer pressure","ph":"pir prè-cher","fr":"pression du groupe","mg":"tsindrin'ny namana"},{"en":"cyberbullying","ph":"saï-ber-bou-li-ing","fr":"harcèlement en ligne","mg":"fanaratsiana an-tserasera"},{"en":"fake news","ph":"feïk niouz","fr":"fausses informations","mg":"vaovao diso"},{"en":"to fact-check","ph":"fakt-tchèk","fr":"vérifier une information","mg":"manamarina vaovao"},{"en":"to take a break from…","ph":"teïk e breïk","fr":"faire une pause de…","mg":"miala amin'ny"},{"en":"to raise awareness","ph":"reïz e-wèr-ness","fr":"sensibiliser","mg":"manentana"},{"en":"a digital detox","ph":"di-dji-tel di-toks","fr":"une cure sans écran","mg":"fialana amin'ny finday"}]}]},{"title":"MODEL ANSWER","expl":"Observe the balance: the speaker does not condemn, he distinguishes the tool from the way it is used. That distinction wins debates.","fr":"Le locuteur distingue l'outil de l'usage : c'est ce qui gagne un débat.","mg":"Manavaka ny fitaovana sy ny fampiasana azy: izany no mandresy.","blocks":[{"t":"p","text":"Are social media good or bad for young people?"},{"t":"p","text":"Thanks for your question. As far as I'm concerned, social media are neither good nor bad in themselves: everything depends on how we use them."},{"t":"p","text":"On the one hand, they give an incredible opportunity. A young person in a small town can now learn English, find clients, follow a course or show his talent to thousands of people without leaving his room. Ten years ago that was impossible."},{"t":"p","text":"On the other hand, I can't ignore the damage. Many of us spend hours scrolling, comparing our real life with other people's edited life. That destroys self-esteem, especially when you are seventeen. Add cyberbullying and fake news, and you understand why some people decide to take a break."},{"t":"p","text":"To sum up, I'd say the solution is not to delete everything, but to control our screen time, to fact-check what we read, and to remember one simple thing: what you see online is a highlight, not a life."},{"t":"c","title":"Speaking strategy","text":"On sensitive topics, separate the tool from the use. 'Social media are not the problem; the way we use them is.' That sentence pattern works for almost any debate."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Your turn.","items":["How much screen time do you have per day? Is it too much?","Give three concrete rules for a healthier use of social media.","Translate: « Comparer sa vie à celle des autres détruit l'estime de soi. »","Prepare a two-minute answer and record it."]}},{"seance":40,"chapitre":40,"title":"Debate — Climate & Environment","sub":"Débat : le climat et l'environnement • Adihevitra: toetrandro sy tontolo iainana","intro":[],"sections":[{"title":"KEY VOCABULARY","expl":"Environmental English is largely made of compound nouns: climate change, global warming, waste management. Learn the pairs, not the isolated words.","fr":"Vocabulaire fait de noms composés : apprends-les par paires.","mg":"Teny mitambatra no be: ianaro tsiroaroa.","blocks":[{"t":"v","v":[{"en":"climate change","ph":"klaï-met tcheïndj","fr":"","mg":""},{"en":"FR  le changement climatique","ph":"","fr":"MG  fiovan'ny toetrandro","mg":""},{"en":"global warming","ph":"glo-bel wor-ming","fr":"","mg":""},{"en":"FR  le réchauffement climatique","ph":"","fr":"MG  fiakaran'ny mari-pana","mg":""},{"en":"pollution / to pollute","ph":"po-liou-chen","fr":"","mg":""},{"en":"FR  la pollution / polluer","ph":"","fr":"MG  fandotoana / mandoto","mg":""},{"en":"deforestation","ph":"di-fo-ress-teï-chen","fr":"","mg":""},{"en":"FR  la déforestation","ph":"","fr":"MG  fandripahana ala","mg":""},{"en":"a drought / a flood","ph":"draout / flad","fr":"","mg":""},{"en":"FR  une sécheresse / une inondation","ph":"","fr":"MG  hain-tany / tondra-drano","mg":""},{"en":"waste / to throw away","ph":"weïst","fr":"","mg":""},{"en":"FR  les déchets / jeter","ph":"","fr":"MG  fako / manary","mg":""},{"en":"to recycle","ph":"ri-saï-kel","fr":"","mg":""},{"en":"FR  recycler","ph":"","fr":"MG  manodina","mg":""},{"en":"renewable energy","ph":"ri-niou-e-bel","fr":"","mg":""},{"en":"FR  énergie renouvelable","ph":"","fr":"MG  angovo azo havaozina","mg":""},{"en":"solar panels","ph":"so-ler pa-nelz","fr":"","mg":""},{"en":"FR  panneaux solaires","ph":"","fr":"MG  takela-masoandro","mg":""},{"en":"to plant trees","ph":"plant triz","fr":"","mg":""},{"en":"FR  planter des arbres","ph":"","fr":"MG  mamboly hazo","mg":""},{"en":"a farmer / crops","ph":"far-mer / krops","fr":"","mg":""},{"en":"FR  un agriculteur / des récoltes","ph":"","fr":"MG  mpamboly / vokatra","mg":""},{"en":"sustainable development","ph":"ses-teï-ne-bel","fr":"","mg":""},{"en":"FR  développement durable","ph":"","fr":"MG  fampandrosoana maharitra","mg":""}]}]},{"title":"MODEL ANSWER","expl":"Here the speaker links a global problem to a personal action — the technique that makes an argument concrete instead of abstract.","fr":"Relier le problème mondial à une action personnelle rend l'argument concret.","mg":"Mampifandray ny olana manerantany sy ny asa manokana.","blocks":[{"t":"p","text":"Can young people really do something about climate change?"},{"t":"p","text":"Thank you for this question. In my opinion, the answer is yes — but not in the way people usually imagine."},{"t":"p","text":"First of all, let's be realistic: a student who recycles his bottles will not stop global warming. The main decisions are taken by governments and big companies, and it would be dishonest to pretend otherwise."},{"t":"p","text":"However, that's not a reason to do nothing. Young people have two real powers. The first one is the power to raise awareness: one video, one campaign at school, and hundreds of people change a small habit. The second one is the power of choice: what we buy, what we waste, how we travel. In my region, deforestation and droughts already affect the farmers' crops, so this is not a distant problem."},{"t":"p","text":"All in all, I'd say that our generation cannot solve the crisis alone, but we can refuse to make it worse, and we can put pressure on those who decide. That's already a lot."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Prepare your position.","items":["Name three environmental problems in your region.","Give two actions a student can take, and one limit of those actions.","Translate: « La déforestation provoque des sécheresses. »","Write and read aloud a 10-sentence answer."]}},{"seance":41,"chapitre":41,"title":"Debate — Work, Career & the Job Interview","sub":"Débat : travail, carrière et entretien d'embauche • Adihevitra: asa sy fitadiavana asa","intro":["You can be the best candidate in the room and lose the job because you froze on the first question. The four questions in this chapter come back in almost every interview on earth. Write your answers once, and you will never freeze again."],"sections":[{"title":"JOBS AND CONTRACTS","expl":"Careful with false friends: 'to apply for a job' means to send an application, and 'a formation' does not exist — say 'training'.","fr":"Faux amis : 'apply for' = postuler ; 'formation' se dit 'training'.","mg":"Tandremo: 'apply for' = mangataka asa; 'training' fa tsy 'formation'.","blocks":[{"t":"v","v":[{"en":"to apply for a job","ph":"e-plaï for","fr":"postuler à un emploi","mg":"mangataka asa"},{"en":"a CV / a résumé","ph":"si-vi / rè-zou-meï","fr":"un CV","mg":"taratasy filazana ny mombamomba"},{"en":"a cover letter","ph":"ka-ver lè-ter","fr":"une lettre de motivation","mg":"taratasy fangatahana"},{"en":"a job interview","ph":"djob in-ter-viou","fr":"un entretien d'embauche","mg":"fanadinana asa"},{"en":"full-time / part-time","ph":"foul-taïm","fr":"à plein temps / temps partiel","mg":"asa feno / fotoana fohy"},{"en":"an internship","ph":"in-tern-chip","fr":"un stage","mg":"fanofanana"},{"en":"a work-study contract","ph":"werk-sta-di","fr":"une alternance","mg":"fifanarahana asa sy fianarana"},{"en":"training","ph":"treï-ning","fr":"une formation","mg":"fiofanana"},{"en":"a salary / a raise","ph":"sa-le-ri / reïz","fr":"un salaire / une augmentation","mg":"karama / fiakaram-bola"},{"en":"to be promoted","ph":"pro-mo-tid","fr":"être promu","mg":"misandratra"},{"en":"to resign / to get fired","ph":"ri-zaïn / faï-erd","fr":"démissionner / être licencié","mg":"miala / voaroaka"},{"en":"a career path","ph":"ke-rir path","fr":"un parcours professionnel","mg":"lalan'asa"}]}]},{"title":"THE INTERVIEW: QUESTIONS AND ANSWERS","expl":"Four questions come back in almost every interview. Prepare them word by word — improvising in a foreign language is the fastest way to lose the job.","fr":"Quatre questions reviennent toujours : prépare-les mot à mot.","mg":"Fanontaniana efatra miverimberina: omany tsara.","blocks":[{"t":"v","v":[{"en":"Tell me about yourself.","ph":"tèl mi e-baout","fr":"Parlez-moi de vous.","mg":"Lazao ny mombamomba anao."},{"en":"What are your strengths?","ph":"strengths","fr":"Quelles sont vos forces ?","mg":"Inona ny tanjakao?"},{"en":"What are your weaknesses?","ph":"wik-ne-siz","fr":"Quels sont vos points faibles ?","mg":"Inona ny fahalemenao?"},{"en":"Where do you see yourself in five years?","ph":"in faïv yirz","fr":"Où vous voyez-vous dans 5 ans ?","mg":"Aiza ianao afaka dimy taona?"},{"en":"Why should we hire you?","ph":"haï-er you","fr":"Pourquoi vous embaucher ?","mg":"Nahoana no hanakarama anao?"},{"en":"I'm a fast learner.","ph":"fast ler-ner","fr":"J'apprends vite.","mg":"Mianatra haingana aho."},{"en":"I work well under pressure.","ph":"an-der prè-cher","fr":"Je travaille bien sous pression.","mg":"Miasa tsara na misy tsindry aza."},{"en":"I'm looking for a new challenge.","ph":"tcha-lendj","fr":"Je cherche un nouveau défi.","mg":"Mitady fanamby vaovao aho."}]},{"t":"c","title":"Interview rule","text":"When asked about a weakness, never answer 'I'm a perfectionist' — every recruiter hears it ten times a day. Name a real weakness, then immediately name what you did about it."},{"t":"p","text":"Q  Tell me about yourself."},{"t":"p","text":"A  Certainly. My name's Ando, I'm twenty-three and I'm finishing a Master's degree in marketing. For the last year I've been working on a work-study contract, where I manage social media content. I'm a fast learner and I work well under pressure."},{"t":"p","text":"Q  What are your weaknesses?"},{"t":"p","text":"A  To be honest, I used to take on too many tasks at the same time. I've been working on that: now I set priorities every Monday morning."}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Interview simulation.","items":["Write your answer to 'Tell me about yourself' (6 sentences).","Name two strengths and one weakness — with the correction you bring to it.","Translate: « Je postule pour une alternance en marketing. »","Role-play the four questions with a partner."]}},{"seance":42,"chapitre":42,"title":"Debate — Society, Rights & Justice","sub":"Débat : société, droits et justice • Adihevitra: fiaraha-monina sy rariny","intro":[],"sections":[{"title":"LAW AND JUSTICE VOCABULARY","expl":"These words appear in every news report. Note the difference between 'to accuse' (to say someone did it) and 'to convict' (a court decides he did it).","fr":"'accuse' = accuser ; 'convict' = reconnaître coupable (par un tribunal).","mg":"'accuse' = miampanga; 'convict' = manameloka (fitsarana).","blocks":[{"t":"v","v":[{"en":"a witness","ph":"wit-ness","fr":"un témoin","mg":"vavolombelona"},{"en":"to accuse someone","ph":"e-kiouz","fr":"accuser quelqu'un","mg":"miampanga olona"},{"en":"to be guilty / innocent","ph":"guil-ti / i-no-sent","fr":"être coupable / innocent","mg":"meloka / tsy manan-tsiny"},{"en":"to arrest / to detain","ph":"e-rèst / di-teïn","fr":"arrêter / détenir","mg":"misambotra / mitana"},{"en":"a trial / a court","ph":"traï-el / kort","fr":"un procès / un tribunal","mg":"fitsarana"},{"en":"to convict / to sentence","ph":"kon-vikt","fr":"condamner","mg":"manameloka"},{"en":"a fine / a sentence","ph":"faïn","fr":"une amende / une peine","mg":"sazy vola / sazy"},{"en":"to file a complaint","ph":"faïl e kom-pleïnt","fr":"porter plainte","mg":"mitory"},{"en":"human rights","ph":"hiou-men raïts","fr":"les droits humains","mg":"zon'olombelona"},{"en":"equality / discrimination","ph":"i-kwo-li-ti","fr":"égalité / discrimination","mg":"fitoviana / fanavakavahana"},{"en":"corruption / a bribe","ph":"ke-rap-chen / braïb","fr":"corruption / pot-de-vin","mg":"kolikoly"},{"en":"freedom of speech","ph":"fri-dem ov spitch","fr":"liberté d'expression","mg":"fahalalahana miteny"}]}]},{"title":"MODEL ANSWER","expl":"On sensitive topics, the safest and strongest technique is to present both sides before giving your own position, and to stay respectful.","fr":"Sur les sujets sensibles : présenter les deux camps puis se positionner, avec respect.","mg":"Amin'ny lohahevitra sarotra: aseho ny roa tonta vao milaza ny hevitrao.","blocks":[{"t":"p","text":"What would you do if someone stole your belongings?"},{"t":"p","text":"Thank you for the question. To begin with, I think the honest answer is that the first reaction is always anger."},{"t":"p","text":"On the one hand, some people would take justice into their own hands. I understand the feeling, but I completely disagree with the method: if everyone punishes by himself, there is no law left, only revenge."},{"t":"p","text":"On the other hand, the legal way can be slow and, in some places, expensive. That's the real argument of those who don't trust the system."},{"t":"p","text":"As far as I'm concerned, I would file a complaint and give the police every detail I have. And beyond my own case, I'd say the deeper issue is prevention: better lighting, real jobs for young people, and a justice system people can trust. To sum up, punishing is necessary, but preventing is far more useful."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Discuss.","items":["What is the difference between 'to accuse' and 'to convict'?","Give two arguments in favour of freedom of speech and one limit to it.","Translate: « Il a porté plainte contre son voisin. »","Prepare a two-minute answer to the model question."]}},{"seance":43,"chapitre":43,"title":"Debate — Youth, Politics & Citizenship","sub":"Débat : jeunesse, politique et citoyenneté • Adihevitra: tanora sy fitondrana","intro":[],"sections":[{"title":"POLITICAL VOCABULARY","expl":"To discuss politics in English you mainly need verbs of action: to vote, to run, to elect, to govern, to protest. Stay factual and avoid insulting anyone — that is the rule of every serious debate.","fr":"Surtout des verbes d'action. Reste factuel : c'est la règle du débat sérieux.","mg":"Matoanteny no ilaina indrindra. Aza manevateva: fitsipiky ny adihevitra.","blocks":[{"t":"v","v":[{"en":"to vote / an election","ph":"vot / i-lek-chen","fr":"voter / une élection","mg":"mifidy / fifidianana"},{"en":"a candidate","ph":"kan-di-deït","fr":"un candidat","mg":"kandidà"},{"en":"to run for president","ph":"ran for","fr":"se présenter à la présidence","mg":"milatsaka ho filoha"},{"en":"a political party","ph":"po-li-ti-kel par-ti","fr":"un parti politique","mg":"antoko politika"},{"en":"a campaign","ph":"kam-peïn","fr":"une campagne","mg":"fampielezan-kevitra"},{"en":"the government","ph":"the ga-vern-ment","fr":"le gouvernement","mg":"ny fitondrana"},{"en":"to govern / to lead","ph":"ga-vern / lid","fr":"gouverner / diriger","mg":"mitondra"},{"en":"to protest / to go on strike","ph":"pro-tèst / straïk","fr":"manifester / faire grève","mg":"mitokona"},{"en":"taxes / public services","ph":"tak-siz","fr":"impôts / services publics","mg":"hetra / tolotra ho an'ny daholobe"},{"en":"to keep a promise","ph":"kip e pro-miss","fr":"tenir une promesse","mg":"mitana ny teny"},{"en":"accountability","ph":"e-kaoun-te-bi-li-ti","fr":"la reddition de comptes","mg":"fitantanana mangarahara"},{"en":"a citizen / citizenship","ph":"si-ti-zen","fr":"un citoyen / la citoyenneté","mg":"olom-pirenena"}]}]},{"title":"MODEL ANSWER","expl":"Note the useful formula 'It would be unfair to say that…' It lets you disagree with a common opinion without attacking anyone.","fr":"'It would be unfair to say that…' permet de contredire sans attaquer.","mg":"'It would be unfair to say that…' fomba mandà tsy misy fanafihana.","blocks":[{"t":"p","text":"Are young people really interested in politics?"},{"t":"p","text":"Thanks for your question. It's often said that our generation doesn't care about politics. From my point of view, that's not accurate — it would be unfair to say that young people are indifferent."},{"t":"p","text":"What is true is that many of us don't trust the classical political system. We see campaigns full of promises and very little accountability afterwards, so a lot of young people simply stop voting."},{"t":"p","text":"But look at what happens online: petitions, awareness campaigns, debates about jobs, education and the environment. That IS politics, even if it doesn't happen in a party office. In other words, the interest has moved, it hasn't disappeared."},{"t":"p","text":"To sum up, I'd say the real question is not whether young people care, but whether the system gives them a reason to participate. And as a citizen, I believe we should do both: express ourselves online AND vote, because only one of the two changes the law."}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Your position.","items":["Do you vote? Why, or why not? Answer in five sentences.","Give two things you would change if you were in charge, using 'If I were…, I would…'.","Translate: « Le gouvernement doit tenir ses promesses. »","Prepare a two-minute answer and record it."]}},{"seance":44,"chapitre":44,"title":"The Body, the Face & Describing People","sub":"Le corps, le visage, décrire quelqu'un • Ny vatana sy ny tarehy","intro":[],"sections":[{"title":"THE BODY","expl":"You need this vocabulary twice: to describe a person, and to explain a pain to a doctor (see Chapter 6).","fr":"Utile pour décrire une personne et pour expliquer une douleur.","mg":"Ilaina amin'ny famaritana olona sy filazana aretina.","blocks":[{"t":"tb","rows":[["English","Français","Malagasy"],["head / neck / shoulder","tête / cou / épaule","loha / vozona / soroka"],["chest / back / waist","poitrine / dos / taille","tratra / lamosina / valahana"],["arm / elbow / wrist / hand","bras / coude / poignet / main","sandry / kiho / hato-tanana / tanana"],["hip / thigh / knee","hanche / cuisse / genou","fe / lohalika"],["leg / calf / ankle / foot","jambe / mollet / cheville / pied","tongotra / kitrokitro / kitrokely"],["finger / thumb / nail","doigt / pouce / ongle","rantsan-tanana / ankihibe / hoho"]]}]},{"title":"THE FACE","expl":"Note the plural: 'hair' is uncountable in English — say 'her hair IS long', never 'hairs are'.","fr":"'hair' est indénombrable : 'her hair is long'.","mg":"'hair' tsy azo isaina: 'her hair is long'.","blocks":[{"t":"tb","rows":[["English","Français","Malagasy"],["hair / forehead / skin","cheveux / front / peau","volo / handrina / hoditra"],["eyebrow / eyelash / eye","sourcil / cil / œil","volomaso / maso"],["nose / nostril / cheek","nez / narine / joue","orona / takolaka"],["mouth / lip / tooth","bouche / lèvre / dent","vava / molotra / nify"],["chin / jaw / ear","menton / mâchoire / oreille","saoka / valanorano / sofina"],["wrinkle / freckle / dimple","ride / tache de rousseur / fossette","ketrona"]]}]},{"title":"DESCRIBING SOMEONE","expl":"Order of adjectives: size, age, shape, colour. 'She has long straight black hair', never 'black straight long'.","fr":"Ordre des adjectifs : taille, âge, forme, couleur.","mg":"Filaharan'ny mpamaritra: habe, taona, endrika, loko.","blocks":[{"t":"v","v":[{"en":"He's tall and slim.","ph":"tol and slim","fr":"Il est grand et mince.","mg":"Lava sy mahia izy."},{"en":"She has curly hair.","ph":"ker-li","fr":"Elle a les cheveux bouclés.","mg":"Ngoly ny volony."},{"en":"He's in his thirties.","ph":"in hiz ther-tiz","fr":"Il a la trentaine.","mg":"Telopolo taona eo izy."},{"en":"She looks like her mother.","ph":"louks laïk","fr":"Elle ressemble à sa mère.","mg":"Mitovy amin-dreniny izy."},{"en":"He's good-looking.","ph":"goud-lou-king","fr":"Il est beau.","mg":"Tsara tarehy izy."},{"en":"She's easy-going.","ph":"i-zi go-ing","fr":"Elle est facile à vivre.","mg":"Mora miaraka izy."}]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Describe a person.","items":["Put in order: (black / long / beautiful) hair → ______","Translate: « Il a la trentaine et il est très grand. »","Which part of the body hurts? 'I have a backache.' → ______","Describe your best friend in six sentences (physical + character)."]}},{"seance":45,"chapitre":45,"title":"American Accent Training: Intonation","sub":"L'accent américain : l'intonation • Feo amerikanina: ny fiakaran'ny feo","intro":["Your accent is not a defect to erase. But intonation is not an accent — it is the music that tells your listener where the meaning is. Without it, correct English still sounds flat and hard to follow."],"sections":[{"title":"THE STAIRCASE PRINCIPLE","expl":"American English is not flat: the voice goes up and down like a staircase. In each sentence, one or two key words are stressed — they are said LOUDER, LONGER and HIGHER. All the other words become short and weak. Getting this right matters more than pronouncing every sound perfectly.","fr":"La voix monte et descend comme un escalier. Un ou deux mots-clés sont accentués : plus forts, plus longs, plus hauts.","mg":"Miakatra midina toy ny tohatra ny feo. Misy teny iray na roa asongadina.","blocks":[{"t":"p","text":"Reading practice — raise your voice on the words in capitals"},{"t":"p","text":"HELLO, my NAME is ______ . I'm TAKING American ACCENT training."},{"t":"p","text":"There's a LOT to learn, but I HOPE to make it as ENJOYABLE as possible."},{"t":"p","text":"I should PICK UP on the American intonation pattern pretty EASILY,"},{"t":"p","text":"although the ONLY way to get it is to PRACTISE all of the time."},{"t":"p","text":"I've been PAYING attention to PITCH, too. It's like walking DOWN a STAIRCASE."},{"t":"p","text":"I've been TALKING to a lot of AMERICANS lately, and they TELL me I'm EASIER to underSTAND."},{"t":"p","text":"Anyway, I could go ON and ON, but the IMPORTANT thing is to LISTEN well and sound GOOD. What do you THINK? DO I?"}]},{"title":"RISING OR FALLING?","expl":"Yes/No questions rise at the end. WH- questions and statements fall. A rising tone on a statement means surprise or doubt.","fr":"Questions fermées : ton montant. Questions en WH- et affirmations : ton descendant.","mg":"Fanontaniana eny/tsia: miakatra. WH- sy filaza: midina.","blocks":[{"t":"v","v":[{"en":"Are you coming? ↗","ph":"ar you ka-ming","fr":"Tu viens ?","mg":"Ho avy ve ianao?"},{"en":"Where are you going? ↘","ph":"wèr ar you go-ing","fr":"Où vas-tu ?","mg":"Ho aiza ianao?"},{"en":"I'm leaving tomorrow. ↘","ph":"aïm li-ving","fr":"Je pars demain.","mg":"Handeha rahampitso aho."},{"en":"You're leaving? ↗ (surprise)","ph":"yor li-ving","fr":"Tu pars ?!","mg":"Handeha ianao?!"},{"en":"Coffee ↗ or tea ↘?","ph":"ko-fi or ti","fr":"Café ou thé ?","mg":"Kafe sa dite?"}]},{"t":"c","title":"Practice method","text":"Record yourself reading forty seconds of any English text. Listen once. You will hear your own biggest problem faster than any teacher could tell you."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Mark ↗ or ↘ at the end of each sentence, then read aloud.","items":["Do you speak English? ____","What time is it? ____","I've been studying for two years. ____","Really? You did that alone? ____","Record yourself reading the staircase text, then listen and correct."]}},{"seance":46,"chapitre":46,"title":"Liaison & Connected Speech","sub":"Les liaisons et le débit naturel • Fampifandraisana feo","intro":["If you understand every written word but nothing of what natives say, you are not bad at English. You simply learned the words separately, and they speak them glued together. Five rules explain almost all of it."],"sections":[{"title":"WHY YOU DON'T UNDERSTAND NATIVE SPEAKERS","expl":"Native speakers do not pronounce words one by one: they glue them together. If you learn only isolated words, you will read English but not hear it. These five rules explain most of the difficulty.","fr":"Les natifs collent les mots. Ces cinq règles expliquent l'essentiel de la difficulté.","mg":"Ampifandraisin'ny teratany ny teny. Ireto fitsipika dimy ireto no manazava izany.","blocks":[{"t":"tb","rows":[["Rule","Written","Spoken"],["consonant + vowel","American accent","a-me-ri-ka-nak-sent"],["T between vowels → D","I get it","I ge-dit"],["T + Y → CH","I got you","I go-tchou"],["D + Y → DJ","Did you come?","Di-djou come?"],["DO + YOU → DY","What do you mean?","Wa-dya mean?"],["want to / going to","want to / going to","wanna / gonna"],["-ing → -in'","What are you doing?","Wha-cha doin'?"]]}]},{"title":"WEAK FORMS","expl":"Small grammatical words (to, of, for, and, can, a) are almost never stressed. They are reduced to a very short 'e' sound. That is why 'a cup of tea' sounds like 'a cup-e-tea'.","fr":"Les petits mots grammaticaux se réduisent à un 'e' très bref.","mg":"Ny teny kely dia mihena ho feo 'e' fohy.","blocks":[{"t":"v","v":[{"en":"a cup of tea","ph":"e kap-e-ti","fr":"une tasse de thé","mg":"kaopy dite"},{"en":"I have to go.","ph":"aï haf-te go","fr":"Je dois y aller.","mg":"Tsy maintsy mandeha aho."},{"en":"What are you gonna do?","ph":"wa-cha go-ne dou","fr":"Qu'est-ce que tu vas faire ?","mg":"Inona no hataonao?"},{"en":"Let me see.","ph":"lè-mi si","fr":"Fais voir.","mg":"Avelao hijery aho."},{"en":"Come on!","ph":"ka-mon","fr":"Allez !","mg":"Andao!"},{"en":"I dunno. (I don't know)","ph":"aï de-no","fr":"Je sais pas.","mg":"Tsy fantatro."}]}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Write how these are really pronounced, then say them fast.","items":["What do you want? → ______","Did you eat? → ______","I got it. → ______","I'm going to call you. → ______","Listen to two minutes of an English podcast and write down three liaisons you hear."]}},{"seance":47,"chapitre":47,"title":"Slang, Idioms & Daily Expressions","sub":"Argot, expressions et langage familier • Teny an-davanandro sy fomba fiteny","intro":[],"sections":[{"title":"IDIOMS YOU WILL ACTUALLY HEAR","expl":"An idiom cannot be translated word by word. Learn the meaning and one example sentence — that is the only way it will come out naturally.","fr":"Un idiome ne se traduit pas mot à mot : apprends le sens + un exemple.","mg":"Tsy azo adika teny tsirairay ny fomba fiteny: ianaro ny dikany sy ohatra.","blocks":[{"t":"v","v":[{"en":"to beat around the bush","ph":"bit e-raound the buch","fr":"tourner autour du pot","mg":"manodidina ny resaka"},{"en":"to pull someone's leg","ph":"poul sam-wanz lèg","fr":"faire marcher quelqu'un","mg":"manao vazivazy"},{"en":"to be at a loss","ph":"at e loss","fr":"être désemparé","mg":"very hevitra"},{"en":"to have bigger fish to fry","ph":"bi-guer fich tou fraï","fr":"avoir d'autres chats à fouetter","mg":"manana zava-dehibe kokoa"},{"en":"to be out of the woods","ph":"aout ov the woudz","fr":"être tiré d'affaire","mg":"afaka amin'ny loza"},{"en":"to hit the sack","ph":"hit the sak","fr":"aller se coucher","mg":"mandeha matory"},{"en":"to give it a whirl","ph":"guiv it e wirl","fr":"tenter le coup","mg":"manandrana"},{"en":"it's not my cup of tea","ph":"kap ov ti","fr":"ce n'est pas mon truc","mg":"tsy tiako izany"},{"en":"to break the ice","ph":"breïk the aïss","fr":"briser la glace","mg":"manala hakivian-tsaina"},{"en":"to be on the same page","ph":"seïm peïdj","fr":"être sur la même longueur d'onde","mg":"mitovy hevitra"}]}]},{"title":"EVERYDAY SLANG","expl":"Slang is informal: perfect with friends, dangerous in a job interview. Know it to understand — choose carefully when to use it.","fr":"L'argot est familier : parfait entre amis, risqué en entretien.","mg":"Teny tsotra: tsara amin'ny namana, tsy mety amin'ny fanadinana asa.","blocks":[{"t":"v","v":[{"en":"No big deal.","ph":"no big dil","fr":"C'est pas grave.","mg":"Tsinontsinona."},{"en":"No way!","ph":"no weï","fr":"Pas question !","mg":"Tsy misy resaka!"},{"en":"Hang in there!","ph":"hang in thèr","fr":"Tiens bon !","mg":"Aza kivy!"},{"en":"I'm broke.","ph":"aïm brok","fr":"Je suis fauché.","mg":"Tsy manam-bola aho."},{"en":"That's awesome!","ph":"o-sem","fr":"C'est génial !","mg":"Mahafinaritra be!"},{"en":"I'm swamped.","ph":"aïm swompt","fr":"Je suis débordé.","mg":"Tototry ny asa aho."},{"en":"My bad.","ph":"maï bad","fr":"Autant pour moi.","mg":"Hadisoako."},{"en":"Let's chill out.","ph":"tchil aout","fr":"On se détend.","mg":"Andao hiala voly."},{"en":"Who cares!","ph":"hou kèrz","fr":"On s'en fiche !","mg":"Tsy maninona!"},{"en":"Knock on wood!","ph":"nok on woud","fr":"Touchons du bois !","mg":"Sanatria!"}]},{"t":"c","title":"Watch out","text":"Slang is for friends. In an interview, a report or an email to a professor, use the standard forms. Knowing slang is understanding; using it is a choice of context."}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Replace the underlined part with an idiom.","items":["Stop avoiding the subject and tell me the truth. → ______","I'm exhausted, I'm going to bed. → ______","Don't worry, it's not serious. → ______","I was joking! → ______","Write five sentences of your own using five different idioms."]}},{"seance":48,"chapitre":48,"title":"Proverbs in Conversation","sub":"Les proverbes dans la conversation • Ohabolana amin'ny resaka","intro":["A proverb is a whole argument compressed into six words. Placed at the right moment, it ends a discussion elegantly — and it shows a level of English that no vocabulary list can prove."],"sections":[{"title":"FOUR PROVERBS AND HOW TO USE THEM","expl":"A proverb is a short sentence carrying a lesson. Used at the right moment, it closes an argument elegantly. Read each dialogue aloud with a partner, taking turns as A and B.","fr":"Un proverbe bien placé clôt élégamment un argument. Lis chaque dialogue à deux.","mg":"Ny ohabolana mety dia mamarana tsara ny resaka.","blocks":[{"t":"p","text":"1. Two heads are better than one — L'union fait la force"},{"t":"p","text":"A — Can I pick your brain for a minute? I have to hand in this composition tomorrow and I'm stuck on the introduction."},{"t":"p","text":"B — To be honest, I'm not that good with words, but I'm willing to help out if I can."},{"t":"p","text":"A — Thanks. My brain is all dried up. Two heads are better than one — together we'll solve it faster than I could alone."},{"t":"p","text":"B — Fair enough. Let me look at what you've written and we'll take it from there."},{"t":"p","text":"2. Do as I say, not as I do — Fais ce que je dis, pas ce que je fais"},{"t":"p","text":"A — For heaven's sake! How many times do I have to tell you that this habit is going to cost you your health?"},{"t":"p","text":"B — You can talk all you want — but look at yourself!"},{"t":"p","text":"A — Never mind me. Do as I say, not as I do. Just because I've made a mistake doesn't mean you have to repeat it."},{"t":"p","text":"B — OK, you win. But why don't we both try to stop? Maybe we can help each other out."},{"t":"p","text":"3. Curiosity killed the cat — La curiosité est un vilain défaut"},{"t":"p","text":"A — You have no business going through those papers on the teacher's desk. Just because she's out of the room doesn't give you the right."},{"t":"p","text":"B — If I don't pass this exam, I probably won't pass the course. I know I could be severely punished, but I'm desperate!"},{"t":"p","text":"A — Don't you realise that curiosity killed the cat? Sooner or later it will do you in."},{"t":"p","text":"B — All right. It's your funeral, you'd say — but I'd rather revise honestly."},{"t":"p","text":"4. Don't bite the hand that feeds you — Ne mords pas la main qui te nourrit"},{"t":"p","text":"A — I simply can't understand you! I've worked my fingers to the bone and scrimped to pay for your education, and now you drop everything."},{"t":"p","text":"B — I'm sorry. I don't mean to hurt you after all you've done for me."},{"t":"p","text":"A — Hasn't anyone told you not to bite the hand that feeds you? You must know how disappointed I am."},{"t":"p","text":"B — I do. I fully intend to go back and finish. Don't be hasty — give me a chance to prove it."}]}],"dialogue":[],"practice":{"slot":"Slot 3 — evening: do the practice, then say three sentences of your own out loud.","instr":"Which proverb fits?","items":["Your teammate wants to solve everything alone and fails. → ______","A friend reads someone else's private messages. → ______","Someone criticises his employer who trained and paid him. → ______","A smoker tells his brother not to smoke. → ______","Write your own four-line dialogue ending with a proverb."]}},{"seance":49,"chapitre":49,"title":"English for Presentation & Pitching","sub":"L'anglais de la présentation et du pitch • Anglisy ho an'ny fanolorana","intro":[],"sections":[{"title":"THE GOLDEN FORMULA","expl":"Every good presentation follows three steps: 1) Tell them what you're going to say (introduction), 2) Say it (body), 3) Tell them what you said (conclusion). If you respect only this, you are already above average.","fr":"Trois étapes : annoncer, dire, rappeler.","mg":"Dingana telo: milaza mialoha, milaza, mamerina.","blocks":[{"t":"v","v":[{"en":"Good morning, everyone.","ph":"èv-ri-wan","fr":"Bonjour à tous.","mg":"Manao ahoana daholo."},{"en":"Thank you all for coming.","ph":"for ka-ming","fr":"Merci d'être venus.","mg":"Misaotra tonga."},{"en":"Let me introduce myself.","ph":"in-tro-diouss maï-sèlf","fr":"Permettez-moi de me présenter.","mg":"Avelao aho hanolo-tena."},{"en":"Today's topic is…","ph":"to-deïz to-pik","fr":"Le sujet du jour est…","mg":"Ny lohahevitra androany dia…"},{"en":"I've divided my talk into three parts.","ph":"di-vaï-did","fr":"J'ai divisé mon exposé en trois parties.","mg":"Nozaraiko telo ny resako."},{"en":"First of all, I'll look at…","ph":"first ov ol","fr":"Tout d'abord, j'examinerai…","mg":"Voalohany indrindra…"},{"en":"Then I'll move on to…","ph":"mouv on tou","fr":"Puis je passerai à…","mg":"Avy eo dia handroso amin'ny…"},{"en":"Finally, I'll offer some solutions.","ph":"faï-ne-li","fr":"Enfin, je proposerai des solutions.","mg":"Farany, hanolotra vahaolana aho."}]}]},{"title":"DURING AND AFTER","expl":"Signal each transition out loud: the audience must always know where you are. End by inviting questions — it shows confidence.","fr":"Signale chaque transition à voix haute, puis invite aux questions.","mg":"Lazao mafy ny fiovan-dohahevitra, avy eo asao hanontany.","blocks":[{"t":"v","v":[{"en":"As you can see on the screen,","ph":"on the skrin","fr":"Comme vous le voyez à l'écran,","mg":"Araka ny hitanareo,"},{"en":"Let's move on to the next point.","ph":"nèkst poïnt","fr":"Passons au point suivant.","mg":"Andao ho amin'ny manaraka."},{"en":"This brings me to my second issue.","ph":"bringz mi tou","fr":"Cela m'amène à mon deuxième point.","mg":"Mitondra ahy amin'ny faharoa."},{"en":"To put it simply,","ph":"tou pout it sim-pli","fr":"Pour dire les choses simplement,","mg":"Raha tsorina,"},{"en":"In conclusion,","ph":"in kon-klou-jen","fr":"Pour conclure,","mg":"Ho famaranana,"},{"en":"Thank you for your attention.","ph":"e-ten-chen","fr":"Merci de votre attention.","mg":"Misaotra tamin'ny fihainoana."},{"en":"Are there any questions?","ph":"è-ni kwès-tchenz","fr":"Y a-t-il des questions ?","mg":"Misy fanontaniana ve?"},{"en":"That's a good question.","ph":"goud kwès-tchen","fr":"C'est une bonne question.","mg":"Fanontaniana tsara izany."}]}]}],"dialogue":[],"practice":{"slot":"Slot 1 — morning: read the whole chapter aloud once.","instr":"Prepare a three-minute presentation.","items":["Write your opening (welcome + introduce yourself + topic + plan): 5 sentences.","Write two transition sentences.","Write your conclusion + invitation to questions.","Present it standing, out loud, twice. Record the second time."]}},{"seance":50,"chapitre":50,"title":"Irregular Verbs — Reference Table","sub":"Tableau des verbes irréguliers • Tabilaon'ny matoanteny tsy manaraka fitsipika","intro":[],"sections":[{"title":"HOW TO LEARN THEM","expl":"Do not learn the list alphabetically from A to Z — you will always know the beginning and never the end. Learn ten verbs a day, in a sentence, and revise the previous ten before adding new ones.","fr":"Dix verbes par jour, dans une phrase, en révisant les dix précédents.","mg":"Matoanteny folo isan'andro, ao anaty fehezanteny, miaraka amin'ny famerenana.","blocks":[{"t":"tb","rows":[["Infinitive","Past","Past participle"],["arise / awake","arose / awoke","arisen / awoken"],["bear / beat","bore / beat","borne / beaten"],["become / begin","became / began","become / begun"],["bend / bet / bite","bent / bet / bit","bent / bet / bitten"],["bleed / blow","bled / blew","bled / blown"],["break / bring","broke / brought","broken / brought"],["build / burn / burst","built / burnt / burst","built / burnt / burst"],["catch / choose","caught / chose","caught / chosen"],["cost / cut / creep","cost / cut / crept","cost / cut / crept"],["deal / dig / draw","dealt / dug / drew","dealt / dug / drawn"],["dream / drink / drive","dreamt / drank / drove","dreamt / drunk / driven"],["fall / feed / feel","fell / fed / felt","fallen / fed / felt"],["fight / find / flee","fought / found / fled","fought / found / fled"],["fly / forbid / forget","flew / forbade / forgot","flown / forbidden / forgotten"],["forgive / freeze","forgave / froze","forgiven / frozen"],["grow / hang / hide","grew / hung / hid","grown / hung / hidden"],["hit / hold / hurt","hit / held / hurt","hit / held / hurt"],["keep / kneel / know","kept / knelt / knew","kept / knelt / known"],["lay / lead / lean","laid / led / leant","laid / led / leant"],["learn / leave / lend","learnt / left / lent","learnt / left / lent"],["let / lie / light / lose","let / lay / lit / lost","let / lain / lit / lost"],["mean / meet / pay","meant / met / paid","meant / met / paid"],["put / quit / read","put / quit / read","put / quit / read"],["ride / ring / rise / run","rode / rang / rose / ran","ridden / rung / risen / run"],["sell / send / shake","sold / sent / shook","sold / sent / shaken"],["shine / shoot / show","shone / shot / showed","shone / shot / shown"],["sing / sink / sit","sang / sank / sat","sung / sunk / sat"],["sleep / speak / spend","slept / spoke / spent","slept / spoken / spent"],["stand / steal / stick","stood / stole / stuck","stood / stolen / stuck"],["swim / swear / teach","swam / swore / taught","swum / sworn / taught"],["tear / throw / understand","tore / threw / understood","torn / thrown / understood"],["wake / wear / win / write","woke / wore / won / wrote","woken / worn / won / written"]]}]}],"dialogue":[],"practice":{"slot":"Slot 2 — midday: cover the French column and say the English.","instr":"Complete with the correct form.","items":["She has ______ (write) three articles this month.","They ______ (fly) to Kenya last June.","I've ______ (lose) my keys again.","He ______ (teach) me everything I know.","Choose ten verbs from the table and write one sentence with each in the present perfect."]}}];
const LESSON_EMOJI = ['', '👋', '🤝', '👨‍👩‍👧', '🏠', '⏰', '🩺', '💬', '☕', '🔤', '👤', '🔁', '⏱️', '🔗', '⏮️', '📍', '🥤', '🌀', '❓', '✅', '⏪', '✨', '🔮', '🧭', '🔢', '🔀', '🔄', '🗣️', '✏️', '🧩', '📱', '💸', '🎮', '🤖', '🏃', '✈️', '💭', '💼', '🎓', '📲', '🌍', '👔', '⚖️', '🗳️', '🧍', '🎙️', '🔊', '😎', '📜', '🎤', '📚'];
const PART_ACCENT = ['', '#2D61B5', '#A92B3A', '#C98A12', '#14238A', '#1F8A56'];
const partOf = no => no <= 8 ? 1 : no <= 29 ? 2 : no <= 35 ? 3 : no <= 43 ? 4 : 5;
const hasDeck = no => !!COURS[no - 1];

const DK = { no: 0, slides: [], i: 0, step: 0, opts: {}, el: null, touch: null };

/* ---- construction des diapositives ---- */
const qHL = s => esc(s).replace(/(^|[\s(])&#39;([^&]+?)&#39;(?=[\s.,;:!?)]|$)/g, '$1<em class="q">$2</em>');
function chunk(a, n) { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; }
function slideTag(label, no) { return `<div class="dk-tag" style="--d:0s"><span>${esc(label)}</span></div>`; }

function buildSlides(no, opts) {
  const c = COURS[no - 1]; const next = COURS[no];
  const S_ = []; const part = partOf(no); const lec = lecon(no);
  const partName = (lec && lec.partie) || '';
  S_.push({ k: 'cover', accent: PART_ACCENT[part], html: `
    <div class="dk-cover"><div class="dk-blob b1"></div><div class="dk-blob b2"></div><div class="dk-blob b3"></div>
     <div class="dk-emoji">${LESSON_EMOJI[no] || '📖'}</div>
     <div class="dk-kick" style="--d:.1s"><span>Séance ${no}</span><i></i><span>Chapter ${c.chapitre}</span></div>
     <h1 class="dk-title" style="--d:.25s">${esc(c.title)}</h1>
     <div class="dk-sub" style="--d:.55s">${esc((c.sub || '').split(' • ')[0] || '')}</div>
     <div class="dk-sub mg" style="--d:.7s">${esc((c.sub || '').split(' • ')[1] || '')}</div>
     <div class="dk-part" style="--d:.9s">${esc(partName)}</div></div>` });

  if (c.intro && c.intro.length) S_.push({ k: 'intro', html: `${slideTag('Pourquoi ce chapitre ?')}<div class="dk-center"><div class="dk-quote" style="--d:.15s"><span class="mark">“</span>${c.intro.map(p => qHL(p)).join('<br><br>')}</div></div>` });

  c.sections.forEach((s, si) => {
    const st = s.title || 'Leçon';
    if (s.expl || s.fr || s.mg) S_.push({ k: 'expl', html: `${slideTag(st)}
      <div class="dk-split"><div class="dk-card big" style="--d:.15s"><div class="dk-lang">EN</div><p>${qHL(s.expl || '')}</p></div>
      <div class="dk-side">${s.fr ? `<div class="dk-card fr" style="--d:.45s"><div class="dk-lang">FR</div><p>${qHL(s.fr)}</p></div>` : ''}${s.mg ? `<div class="dk-card mg" style="--d:.7s"><div class="dk-lang">MG</div><p>${qHL(s.mg)}</p></div>` : ''}</div></div>` });
    s.blocks.forEach(b => {
      if (b.t === 'v') {
        const long = b.v.some(x => x.en.length > 30 || x.fr.length > 38);
        chunk(b.v, long ? 4 : 6).forEach((grp, gi, all) => S_.push({ k: 'vocab', html: `${slideTag(st + (all.length > 1 ? `  ·  ${gi + 1}/${all.length}` : ''))}
          <div class="dk-vgrid ${grp.length > 4 ? 'g6' : 'g4'}">${grp.map((v, i) => `<div class="dk-v" data-rv><div class="dk-en">${esc(v.en)}</div>${v.ph ? `<div class="dk-ph">${esc(v.ph)}</div>` : ''}${v.fr ? `<div class="dk-fr"><b>FR</b>${esc(v.fr)}</div>` : ''}${v.mg ? `<div class="dk-mgl"><b>MG</b>${esc(v.mg)}</div>` : ''}</div>`).join('')}</div>` }));
      } else if (b.t === 'tb') {
        const head = b.rows[0], body = b.rows.slice(1); const per = head.length >= 3 ? 7 : 8;
        chunk(body, per).forEach((grp, gi, all) => S_.push({ k: 'table', html: `${slideTag(st + (all.length > 1 ? `  ·  ${gi + 1}/${all.length}` : ''))}
          <div class="dk-table-wrap"><table class="dk-table"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${grp.map((r, i) => `<tr style="--d:${(.2 + i * .12).toFixed(2)}s">${r.map((x, j) => `<td class="${j === 0 ? 'f' : ''}">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` }));
      } else if (b.t === 'c') {
        S_.push({ k: 'callout', html: `<div class="dk-center"><div class="dk-callout" style="--d:.1s"><div class="dk-ico">⚠️</div><div><div class="dk-ct">${esc(b.title)}</div><p>${qHL(b.text)}</p></div></div></div>` });
      } else if (b.t === 'p') { /* regroupés ci-dessous */ }
    });
    const paras = s.blocks.filter(b => b.t === 'p').map(b => b.text);
    if (paras.length) chunk(paras, paras.length > 6 ? 4 : 3).forEach((grp, gi, all) => S_.push({ k: 'text', html: `${slideTag(st + (all.length > 1 ? `  ·  ${gi + 1}/${all.length}` : ''))}
      <div class="dk-paras">${grp.map(p => `<div class="dk-para" data-rv>${qHL(p)}</div>`).join('')}</div>` }));
  });

  if (c.dialogue.length) S_.push({ k: 'dialogue', html: `${slideTag('In real use  ·  En situation  ·  Amin’ny tena izy')}
    <div class="dk-chat">${c.dialogue.map(d => `<div class="dk-bub ${d.who === 'A' ? 'l' : 'r'}" data-rv><div class="dk-av">${d.who}</div><div class="dk-bt">${esc(d.text)}</div></div>`).join('')}</div>` });

  const pr = c.practice;
  if (pr.items.length) chunk(pr.items, 5).forEach((grp, gi, all) => S_.push({ k: 'practice', html: `${slideTag('✎  Your 10 minutes of practice' + (all.length > 1 ? `  ·  ${gi + 1}/${all.length}` : ''))}
    <div class="dk-prac">${pr.slot && gi === 0 ? `<div class="dk-slot" style="--d:.1s">${esc(pr.slot)}</div>` : ''}${pr.instr ? `<div class="dk-instr" style="--d:.2s">${esc(pr.instr)}</div>` : ''}
    <ol class="dk-ol" start="${gi * 5 + 1}">${grp.map(t => `<li data-rv>${esc(t)}</li>`).join('')}</ol></div>` }));

  const canUnlock = !!opts.gid;
  const g = opts.gid ? by(D.groupes, opts.gid) : null;
  S_.push({ k: 'end', accent: PART_ACCENT[part], html: `<div class="dk-cover end"><div class="dk-blob b1"></div><div class="dk-blob b2"></div>
    <div class="dk-emoji">🎉</div><h1 class="dk-title" style="--d:.2s">Well done!</h1>
    <div class="dk-sub" style="--d:.5s">Bravo ! · Tsara be!</div>
    ${next ? `<div class="dk-next" style="--d:.8s">Prochaine séance · <b>${no + 1}</b> — ${esc(next.title)}</div>` : '<div class="dk-next" style="--d:.8s">Fin du programme — félicitations !</div>'}
    ${canUnlock && g ? `<button class="dk-btn" data-dk="unlock" style="--d:1s">🔓 Débloquer cette séance pour ${esc(g.nom)}</button>` : ''}
    <div class="dk-part" style="--d:1.1s">SpeakUp English Institute · Own YOUR English</div></div>` });
  return S_;
}

/* ---- affichage ---- */
function deckFit() {
  const st = $('.dk-stage', DK.el); if (!st) return;
  const w = Math.min(window.innerWidth, window.innerHeight * 16 / 9 * .98);
  const h = w * 9 / 16; st.style.width = w + 'px'; st.style.height = h + 'px'; st.style.setProperty('--u', (w / 100) + 'px');
}
function deckShow(i, dir = 1, fullyRevealed = false) {
  DK.i = Math.max(0, Math.min(DK.slides.length - 1, i)); const sl = DK.slides[DK.i];
  const view = $('.dk-view', DK.el); view.className = 'dk-view ' + (dir > 0 ? 'fwd' : 'back'); view.style.setProperty('--acc', sl.accent || '');
  view.innerHTML = `<section class="dk-slide ${sl.k}">${sl.html}</section>`;
  void view.offsetWidth; view.classList.add('go');
  DK.rv = $$('[data-rv]', view); DK.step = 0;
  if (fullyRevealed) { DK.rv.forEach(e => e.classList.add('on')); DK.step = DK.rv.length; }
  $('.dk-prog i', DK.el).style.width = ((DK.i + 1) / DK.slides.length * 100) + '%';
  $('.dk-count', DK.el).textContent = `${DK.i + 1} / ${DK.slides.length}`;
  $('[data-dk=prev]', DK.el).disabled = DK.i === 0; $('[data-dk=next]', DK.el).disabled = DK.i === DK.slides.length - 1 && DK.step >= DK.rv.length;
}
function deckNext() {
  if (DK.step < DK.rv.length) { DK.rv[DK.step++].classList.add('on'); return; }
  if (DK.i < DK.slides.length - 1) deckShow(DK.i + 1, 1);
}
function deckPrev() {
  if (DK.step > 0) { DK.rv[--DK.step].classList.remove('on'); return; }
  if (DK.i > 0) deckShow(DK.i - 1, -1, true);
}
function deckAll() { DK.rv.forEach(e => e.classList.add('on')); DK.step = DK.rv.length; }
function closeDeck() {
  if (!DK.el) return; document.removeEventListener('keydown', DK.key); window.removeEventListener('resize', deckFit);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => { });
  DK.el.remove(); DK.el = null; document.body.style.overflow = '';
}
function openDeck(no, opts = {}) {
  no = Number(no); if (!hasDeck(no)) return toast('Pas de contenu pour cette séance.', 'err');
  if (DK.el) closeDeck();
  DK.no = no; DK.opts = opts; DK.slides = buildSlides(no, opts);
  const el = document.createElement('div'); el.className = 'dk'; DK.el = el;
  el.innerHTML = `<div class="dk-prog"><i></i></div><div class="dk-stage"><div class="dk-view"></div>
    <div class="dk-brand"><img src="${LOGO}" alt=""><span>SpeakUp English Institute</span></div></div>
    <div class="dk-bar"><button data-dk="prev" title="Précédent (←)">‹</button><span class="dk-count"></span><button data-dk="next" title="Suivant (→ ou Espace)">›</button>
    <button data-dk="all" title="Tout afficher (A)">☰</button><button data-dk="fs" title="Plein écran (F)">⛶</button><button data-dk="close" title="Fermer (Échap)">✕</button></div>
    <div class="dk-hint">← → pour naviguer · A tout afficher · F plein écran</div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  deckFit(); window.addEventListener('resize', deckFit); deckShow(0, 1);
  DK.key = e => { if (!DK.el) return; const k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); deckNext(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); deckPrev(); }
    else if (k === 'Escape') { e.stopPropagation(); closeDeck(); }
    else if (k === 'f' || k === 'F') deckFs(); else if (k === 'a' || k === 'A') deckAll(); else if (k === 'Home') deckShow(0, -1); else if (k === 'End') deckShow(DK.slides.length - 1, 1); };
  document.addEventListener('keydown', DK.key, true);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-dk]');
    if (b) { const a = b.dataset.dk; if (a === 'next') deckNext(); else if (a === 'prev') deckPrev(); else if (a === 'close') closeDeck(); else if (a === 'fs') deckFs(); else if (a === 'all') deckAll(); else if (a === 'unlock') deckUnlock(b); return; }
    if (e.target.closest('.dk-bar')) return;
    const r = el.getBoundingClientRect(); (e.clientX - r.left) < r.width * .25 ? deckPrev() : deckNext();
  });
  el.addEventListener('touchstart', e => { DK.touch = e.changedTouches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => { if (DK.touch == null) return; const dx = e.changedTouches[0].clientX - DK.touch; DK.touch = null; if (Math.abs(dx) > 50) { dx < 0 ? deckNext() : deckPrev(); e.preventDefault(); } });
}
function deckFs() { const el = DK.el; if (!el) return; if (document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen?.().catch(() => { }); }
async function deckUnlock(btn) {
  try { btn.disabled = true; await api('unlock', { groupe_id: DK.opts.gid, seance_no: DK.no, open: true }); await refresh(); btn.textContent = '✅ Séance débloquée pour le groupe'; toast(`Séance ${DK.no} débloquée`, 'ok'); }
  catch (e) { btn.disabled = false; toast(e.message, 'err'); }
}


</script>
